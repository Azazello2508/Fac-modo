# Публикует сайт приложения на GitHub Pages.
# Отсюда приложение на телефоне скачивает обновления (version.json + index.html).
name: Сайт и обновления приложения

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Номер сборки (время коммита, но не позже текущего — tools/build_no.sh)
        run: echo "FM_B=$(bash tools/build_no.sh)" >> "$GITHUB_ENV"

      - name: Подготовить сайт
        run: |
          B=$FM_B
          mkdir _site
          cp index.html privacy.html support.html manifest.webmanifest sw.js apple-touch-icon.png icon-192.png icon-512.png _site/
          touch _site/.nojekyll
          sed -i "s/__FM_BUILD__/$B/" _site/index.html
          grep -c "FM_BUILD=parseInt(\"$B\")" _site/index.html

      # Подпись обновления (ECDSA P-256, секрет OTA_SIGN_KEY — закрытый ключ PEM). Без секрета — version.json без подписи, как раньше.
      # [store-ok] в сообщении последнего коммита (или в названии PR) — обновление только с исправлениями, его примет и версия из App Store.
      - name: Подписать обновление
        env:
          K: ${{ secrets.OTA_SIGN_KEY }}
        run: |
          B=$FM_B
          SO=0; if git log -1 --format=%B | grep -qF '[store-ok]'; then SO=1; fi
          KF=""
          if [ -n "$K" ]; then KF="$RUNNER_TEMP/ota.pem"; printf '%s\n' "$K" > "$KF"; else echo "::warning::Нет секрета OTA_SIGN_KEY — обновление публикуется без подписи"; fi
          python3 tools/ota_sign.py _site "$B" "$SO" $KF
          rm -f "$RUNNER_TEMP/ota.pem"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
