# Сборка приложения Fac Modo для iPhone.
# Запускается сама после каждого обновления в репозитории.
# Готовый файл FacModo.ipa появляется в разделе Releases.
name: Сборка для iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # вызывается проверкой «Танчиков», когда игра обновилась

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить Capacitor (обёртка, которая делает из страницы приложение)
        run: npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest @capacitor/filesystem@latest

      - name: Подготовить файлы приложения
        run: |
          rm -rf www && mkdir www
          cp index.html manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png www/
          # номер версии = время последнего изменения; по нему приложение понимает, что вышло обновление
          sed -i '' "s/__FM_BUILD__/$(git log -1 --format=%ct)/" www/index.html
          grep -c 'FM_BUILD=parseInt("[0-9]' www/index.html

      - name: Создать проект iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Иконка, заставка и настройки экрана
        run: |
          for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do cp assets/icon-1024.png "$f"; done
          for f in ios/App/App/Assets.xcassets/Splash.imageset/*.png; do cp assets/splash-2732.png "$f"; done
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Fac Modo" "$PL"
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarStyle" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" "$PL"
          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PL"

      - name: Собрать приложение
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.$(git -C ../.. log -1 --format=%ct) CURRENT_PROJECT_VERSION=$(git -C ../.. log -1 --format=%ct) \
            build | tail -n 40
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../FacModo.ipa Payload
          ls -la ../../FacModo.ipa

      - name: Выложить файл в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$(git log -1 --format=%ct)
          WHEN=$(TZ=Asia/Baku date -d @$B '+%d.%m.%Y %H:%M' 2>/dev/null || TZ=Asia/Baku date -r $B '+%d.%m.%Y %H:%M')
          gh release create "ios-${{ github.run_id }}" FacModo.ipa \
            --title "Fac Modo для iPhone — версия от $WHEN" \
            --notes "Установка: Sideloadly на компьютере → перетащить FacModo.ipa → Start. Подробно — в README." \
            --latest
