# Сборка приложения Fac Modo для iPhone.
# Запускается сама после каждого обновления в репозитории.
# Готовый файл FacModo.ipa появляется в разделе Releases.
name: Сборка для iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # вызывается проверкой «Танчиков», когда игра обновилась

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Установить Capacitor (обёртка, которая делает из страницы приложение)
        # Версии закреплены (а не @latest): новая версия чужой библиотеки не попадёт в сборку сама, без проверки
        run: npm install --no-audit --no-fund @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/ios@8.5.3 @capacitor/filesystem@8.1.5 @capacitor/local-notifications@8.3.1

      - name: Подготовить проект iOS (файлы, иконки, разрешения, конфиденциальность)
        run: bash tools/ios_prepare.sh

      - name: Собрать приложение
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION=$(node -p "require('../../package.json').version") CURRENT_PROJECT_VERSION=$(git -C ../.. log -1 --format=%ct) \
            build | tail -n 40
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          # проверка: файл конфиденциальности, тексты разрешений и «только iPhone» попали в приложение
          test -f Payload/App.app/PrivacyInfo.xcprivacy
          test -f Payload/App.app/ru.lproj/InfoPlist.strings
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" Payload/App.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" Payload/App.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/App.app/Info.plist
          zip -qry ../../FacModo.ipa Payload
          ls -la ../../FacModo.ipa

      - name: Выложить файл в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$(git log -1 --format=%ct)
          WHEN=$(TZ=Asia/Baku date -d @$B '+%d.%m.%Y %H:%M' 2>/dev/null || TZ=Asia/Baku date -r $B '+%d.%m.%Y %H:%M')
          gh release create "ios-${{ github.run_id }}" FacModo.ipa \
            --title "Fac Modo для iPhone — версия от $WHEN" \
            --notes "Установка: Sideloadly на компьютере → перетащить FacModo.ipa → Start. Подробно — в README." \
            --latest
