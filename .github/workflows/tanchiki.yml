# Каждый час проверяет игры на GitHub:
#   «Танчики»    — Azazello2508/Tanchiki
#   «Самолётики» — Azazello2508/Samolety
#   Карты и настольные игры (durak, debertz, chess, checkers, nardy) — из папки games/ этого репозитория
# Если игра изменилась — встраивает новую версию в Fac Modo, публикует сайт и пересобирает приложение для iPhone.
name: Обновление игр

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.embed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Скачать свежие игры и встроить в приложение
        id: embed
        run: |
          CHANGED=false
          embed () {  # $1 — адрес игры, $2 — id блока, $3 — копия в репозитории (может быть пустой)
            if curl -fsSL -o /tmp/game.html "$1"; then
              R=$(python3 tools/embed_tanchiki.py /tmp/game.html "$2")
              echo "$2: $R"
              if [ "$R" = "changed=true" ]; then CHANGED=true; fi
              if [ -n "$3" ]; then cp /tmp/game.html "$3"; fi
            else
              echo "$2: игра пока недоступна по адресу $1 — пропускаю"
            fi
          }
          embed https://raw.githubusercontent.com/Azazello2508/Tanchiki/main/index.html tk-src ""
          embed https://raw.githubusercontent.com/Azazello2508/Samolety/main/index.html sm-src games/samolety.html
          # Настольные игры правятся прямо здесь, в games/*.html (оба разработчика могут их менять)
          for g in durak:dr-src debertz:db-src chess:cs-src checkers:cr-src nardy:nd-src morboy:mb-src sudoku:su-src pyatnashki:p15-src krossvord:kw-src more2048:g2-src; do
            R=$(python3 tools/embed_tanchiki.py "games/${g%%:*}.html" "${g##*:}")
            echo "${g##*:}: $R"
            if [ "$R" = "changed=true" ]; then CHANGED=true; fi
          done
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Сохранить обновление
        if: steps.embed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Обновлены игры из Tanchiki, Samolety и games/"
          git push

  ios:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/ios.yml

  site:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
