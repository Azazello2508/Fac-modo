<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Судовые системы</title>
<style>
:root{--bg:#0d2236;--fg:#eef;--card:#123552;--line:#2d5a80;--muted:#9ab;--accent:#2f7a5a}
*{box-sizing:border-box}
body{margin:0 auto;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--fg);padding:12px 10px 28px;max-width:980px}
h2{margin:6px 0 4px;padding-right:120px}p.help{color:var(--muted);font-size:14px;margin:0 0 12px}
[hidden]{display:none!important}
#menu{display:flex;flex-direction:column;gap:8px}
#menu button{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;padding:12px;border-radius:12px;border:2px solid #3b6488;background:#24405c;color:#eef;cursor:pointer;min-height:56px}
#menu button i{font-style:normal;font-size:26px}#menu button b{display:block;font-size:16px}#menu button span{display:block;font-size:13px;color:#b9cde0;margin-top:2px}
#back{margin:6px 0 10px}
.sim{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.sim canvas{max-width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
.ctls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:8px 0}
.ctl{font-size:14px;display:flex;flex-direction:column;min-width:170px;background:#17405f;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.ctl b{color:#9fe7c0}
.ctl input[type=range]{width:100%}.ctl select{margin-top:4px;padding:6px;border-radius:8px;border:1px solid var(--line);background:#0f2c44;color:#eef;font:inherit}
.btn{padding:7px 14px;border-radius:8px;border:2px solid #3b6488;background:#24405c;color:#eef;cursor:pointer;font:inherit;font-size:14px;min-height:38px}
.btn.on{background:var(--accent);border-color:#7fe0b0;color:#fff}
.out{margin-top:8px;font-size:15px;line-height:1.45}.sim .out{background:#0b1a14;color:#7dffb0;font-family:Consolas,monospace;border:2px solid #2a4a3a;border-radius:8px;padding:10px 12px}
.sim .out b{color:#fff3a8}.sim .out .bad{color:#ff9a8a}.sim .out .good{color:#7dffb0}.note{color:var(--muted);font-size:14px}
.sim h5{margin:6px 0 2px}
.scheme-info{margin:10px 0;padding:10px 14px;border-left:5px solid #f4c430;background:rgba(244,196,48,.1);border-radius:0 4px 4px 0;font-size:15px;min-height:64px}.tour{margin-top:4px}
</style></head><body>
<h2>🚢 Судовые системы</h2>
<p class="help">Учебные модели: числа условные и типичные. На судне всегда действуй по инструкции изготовителя и проекту судна.</p>
<div id="menu"></div>
<div id="stage" hidden><button class="btn" id="back" type="button">← К списку тренажёров</button><div id="host"></div></div>
<script>
const SIMS = {};
const $ = (r, s) => r.querySelector(s);
function slider(id, label, min, max, val, step = 1, unit = '') {
  return `<label class="ctl">${label}: <b id="${id}v">${val}</b> ${unit}<input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" oninput="var b=this.parentNode.querySelector('b');if(b)b.textContent=this.value"></label>`;
}
function bind(root, ids, fn) {
  ids.forEach(id => $(root, '#' + id).addEventListener('input', () => { $(root, '#' + id + 'v').textContent = $(root, '#' + id).value; fn(); }));
}
const val = (root, id) => +$(root, '#' + id).value;
function cv(root, w = 640, h = 300) { const c = $(root, 'canvas'); c.width = w; c.height = h; return c.getContext('2d'); }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// f(t, dt): t — номер кадра, dt — секунды с прошлого кадра (не больше 0.1 с), чтобы скорость не зависела от частоты монитора.
function loop(root, f) { let t = 0, last = performance.now(); (function frame(now) { if (!root.isConnected) return; now = now || performance.now(); const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now; f(t++, dt); requestAnimationFrame(frame); })(); }

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Общий конструктор «объясняющих схем»: блоки с подписями, клик по блоку — объяснение простыми словами,
// экскурсия по шагам («далее»/«авто»), подсветка. Используется в судовых тренажёрах (sims-ship-*.js).
// schemeKit(root, { w, h, parts, steps, draw(g, t, ctx), controls })
//   parts: [{ id, x, y, w, h, label, desc, color }]   label может содержать \n
//   steps: [{ part: 'id', text: 'Что происходит на этом шаге' }]
//   draw(g, t, { sel, hover, tour }): рисует фон, трубы, потоки, анимацию ПОД блоками
//   controls: HTML с ползунками/кнопками под схемой (подключайте через bind/val из sims.js)
function schemeKit(root, o) {
  root.innerHTML = `<div class="sim"><canvas></canvas>
  <div class="scheme-info" id="sinfo"><b>Нажмите на любой блок схемы</b> — здесь появится объяснение: что это и зачем оно нужно. Или запустите экскурсию кнопкой «Далее».</div>
  <div class="ctls tour"><button class="btn" id="tprev">← Назад</button><button class="btn" id="tnext">Экскурсия: далее →</button><button class="btn" id="tauto">Авто</button><span class="note" id="tstep"></span></div>
  ${o.controls || ''}</div>`;
  const cv = root.querySelector('canvas'); cv.width = o.w; cv.height = o.h; cv.style.cursor = 'pointer';
  const g = cv.getContext('2d'), info = root.querySelector('#sinfo'), stepEl = root.querySelector('#tstep');
  const ctx = { sel: null, hover: null, tour: -1 };
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const find = id => o.parts.find(p => p.id === id);
  const show = (p, extra) => { info.innerHTML = `<b>${esc(p.label.replace(/\n/g, ' '))}</b>${extra ? '<br>' + esc(extra) : ''}<br>${esc(p.desc || '')}`; };
  function select(id) { ctx.sel = id; const p = find(id); if (p) show(p); }
  function go(i) {
    if (!o.steps || !o.steps.length) return;
    ctx.tour = (i + o.steps.length) % o.steps.length; const s = o.steps[ctx.tour], p = find(s.part);
    ctx.sel = s.part; if (p) show(p, s.text); else info.textContent = s.text;
    stepEl.textContent = `Шаг ${ctx.tour + 1} из ${o.steps.length}`;
  }
  const at = e => { const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * o.w / r.width, y = (e.clientY - r.top) * o.h / r.height; return o.parts.find(p => x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h); };
  cv.onmousemove = e => { const p = at(e); ctx.hover = p ? p.id : null; };
  cv.onmouseleave = () => { ctx.hover = null; };
  cv.onclick = e => { const p = at(e); if (p) { ctx.tour = -1; stepEl.textContent = ''; select(p.id); } };
  root.querySelector('#tnext').onclick = () => go(ctx.tour + 1);
  root.querySelector('#tprev').onclick = () => go(ctx.tour - 1);
  let autoOn = false; const ab = root.querySelector('#tauto');
  ab.onclick = () => { autoOn = !autoOn; ab.className = 'btn' + (autoOn ? ' on' : ''); if (autoOn && ctx.tour < 0) go(0); };
  const timer = setInterval(() => { if (!root.isConnected) return clearInterval(timer); if (autoOn) go(ctx.tour + 1); }, 5000);
  (function frame() {
    if (!root.isConnected) return; const t = performance.now() / 1000;
    g.clearRect(0, 0, o.w, o.h); o.draw && o.draw(g, t, ctx);
    for (const p of o.parts) {
      const on = ctx.sel === p.id, hv = ctx.hover === p.id;
      g.fillStyle = p.color || '#2c3e68'; g.globalAlpha = on || hv ? 1 : 0.88; g.beginPath(); g.roundRect(p.x, p.y, p.w, p.h, 8); g.fill(); g.globalAlpha = 1;
      g.lineWidth = on ? 3 + Math.sin(t * 5) : hv ? 2 : 1; g.strokeStyle = on ? '#f4c430' : hv ? '#ffffff' : 'rgba(255,255,255,.35)'; g.stroke();
      g.fillStyle = '#fff'; g.font = '600 13px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      const L = p.label.split('\n'); L.forEach((s, i) => g.fillText(s, p.x + p.w / 2, p.y + p.h / 2 + (i - (L.length - 1) / 2) * 15));
    }
    requestAnimationFrame(frame);
  })();
  return { select, go, ctx };
}

// Тренажёры «Исполнителя А»: судовой котёл (shipboiler) и подруливающее устройство (shipthruster).
// Все числа условные, учебные («типично, задаёт проект»); реальные уставки берите из документации судна.
(function () {
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fgc = () => css('--fg') || '#d8dde8';
function plen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function pat(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (d <= l || i === pts.length - 1) { const k = l ? clamp(d / l, 0, 1) : 0; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
    d -= l;
  }
}
// Труба с бегущими частицами: flow 0..1 (интенсивность), o: {w, gap, speed, rev}
function pipe(g, pts, col, flow, t, o) {
  o = o || {}; const w = o.w || 6, gap = o.gap || 22, sp = o.speed || 45, L = plen(pts);
  g.save(); g.lineJoin = 'round'; g.lineCap = 'round';
  g.strokeStyle = 'rgba(130,140,160,.30)'; g.lineWidth = w + 4; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
  g.globalAlpha = flow > 0 ? 0.45 : 0.18; g.strokeStyle = col; g.lineWidth = w; g.stroke(); g.globalAlpha = 1;
  if (flow > 0) {
    const n = Math.max(1, Math.floor(L / gap)), off = (t * sp * (0.3 + flow)) % gap;
    g.fillStyle = col;
    for (let k = 0; k < n + 1; k++) { let d = (k * gap + off) % (n * gap || 1); if (o.rev) d = L - d; if (d > L || d < 0) continue; const p = pat(pts, d); g.beginPath(); g.arc(p[0], p[1], w / 2 + 1, 0, 7); g.fill(); }
  }
  const n2 = pts.length, tip = o.rev ? pts[0] : pts[n2 - 1], prev = o.rev ? pts[1] : pts[n2 - 2], an = Math.atan2(tip[1] - prev[1], tip[0] - prev[0]);
  g.fillStyle = flow > 0 ? col : 'rgba(150,160,180,.6)'; g.beginPath(); g.moveTo(tip[0], tip[1]); g.lineTo(tip[0] - 11 * Math.cos(an - 0.45), tip[1] - 11 * Math.sin(an - 0.45)); g.lineTo(tip[0] - 11 * Math.cos(an + 0.45), tip[1] - 11 * Math.sin(an + 0.45)); g.closePath(); g.fill();
  g.restore();
}
function wire(g, pts, on, t, col) {
  g.save(); g.lineWidth = on ? 2.2 : 1.2; g.setLineDash([6, 5]); g.lineDashOffset = on ? -t * 28 : 0; g.strokeStyle = on ? (col || '#f4c430') : 'rgba(244,196,48,.28)';
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); g.restore();
}
function txt(g, s, x, y, col, font, al) { g.fillStyle = col; g.font = font || '12px system-ui, sans-serif'; g.textAlign = al || 'left'; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); }
function lamp(g, x, y, on, col, label, fg) {
  g.fillStyle = on ? col : 'rgba(130,130,130,.35)'; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill();
  if (on) { g.strokeStyle = col; g.globalAlpha = 0.4; g.lineWidth = 4; g.stroke(); g.globalAlpha = 1; }
  txt(g, label, x + 13, y + 4, fg, '11px system-ui, sans-serif');
}
function legend(g, items, x, y, fg) {
  items.forEach(([l, c], i) => { g.fillStyle = c; g.fillRect(x + i * 78, y - 8, 14, 8); txt(g, l, x + i * 78 + 18, y, fg, '11px system-ui, sans-serif'); });
}
const f1 = (x, n) => x.toFixed(n === undefined ? 1 : n).replace('.', ',');

// ============================== 1. СУДОВОЙ КОТЁЛ ==============================
SIMS.shipboiler = root => {
  const W = 900, H = 540;
  const parts = [
    { id: 'fuel', x: 20, y: 190, w: 130, h: 70, label: 'Топливный насос\nи подогрев', color: '#8a5a2b', desc: 'Насос берёт топливо из расходной цистерны и гонит его к горелке под давлением. Тяжёлое топливо холодным густое, как мёд, поэтому электрический или паровой подогреватель греет его (порядка 90–130 °C, зависит от сорта топлива). Если насос встал или топливо холодное — форсунка не сможет распылить его в туман, факел будет плохим или не загорится вовсе.' },
    { id: 'fan', x: 20, y: 330, w: 130, h: 70, label: 'Вентилятор\nвоздуха', color: '#2d7fa6', desc: 'Электродвигатель с крыльчаткой подаёт воздух для горения и перед каждым розжигом продувает топку. Топливо без воздуха не горит, а лишний воздух уносит тепло в трубу. Если вентилятор встал — защита не даёт включить топливо: без воздуха в топке копились бы пары топлива, а потом они могут хлопнуть.' },
    { id: 'burner', x: 200, y: 310, w: 120, h: 70, label: 'Горелка\nс форсункой', color: '#c0562b', desc: 'Форсунка превращает струйку топлива в мелкий туман (как пульверизатор), горелка смешивает его с воздухом и направляет в топку. Рядом стоят два электрода: между ними проскакивает искра от трансформатора розжига. Забилась форсунка — факел рваный, дымит, может погаснуть.' },
    { id: 'furnace', x: 360, y: 290, w: 220, h: 110, label: 'Топка', color: 'rgba(0,0,0,0)', desc: 'Огнеупорная камера, где горит факел. Горячие газы омывают трубки с водой и отдают им тепло, затем уходят в дымовую трубу. Перед розжигом топку обязательно продувают воздухом — иначе остатки паров топлива могут вспыхнуть взрывом («хлопок»).' },
    { id: 'drum', x: 360, y: 130, w: 220, h: 120, label: 'Паровой барабан', color: 'rgba(0,0,0,0)', desc: 'Большая ёмкость, наполовину с водой, сверху — пар. Вода по трубкам греется в топке, кипит, и пар собирается наверху. Это «кастрюля» котла. Главное правило: трубки и барабан всегда должны быть в воде. Остался без воды при горящем факеле — металл перегреется и порвётся.' },
    { id: 'level', x: 190, y: 125, w: 130, h: 75, label: 'Водомерное стекло\nи датчики уровня', color: '#2f6f8f', desc: 'Стеклянная трубка показывает уровень воды глазами (как в чайнике с прозрачной стенкой), а электрические датчики дают сигналы автоматике: «мало — включи питательный насос», «низко — тревога», «аварийно низко — погаси горелку». Это самая важная защита котла; уровень проверяют вахтенные.' },
    { id: 'feed', x: 650, y: 300, w: 200, h: 70, label: 'Питательный бак\nи насос (конденсат)', color: '#2a6f9c', desc: 'В тёплый бак возвращается конденсат (вода из остывшего пара) и подпитка. Питательный насос подаёт воду в барабан, когда уровень упал. Это «подливание воды в кастрюлю». Насос включается и выключается по датчикам уровня. Отказал насос — уровень медленно падает, пока защита не погасит горелку.' },
    { id: 'safety', x: 360, y: 68, w: 100, h: 46, label: 'Предохранит.\nклапан', color: '#a33a3a', desc: 'Пружинный клапан — последняя линия обороны от разрыва. Если давление поднялось выше настройки (типично чуть выше рабочего, задаёт проект и правила), пружина поддаётся, клапан приподнимается, и пар со свистом уходит наружу. Давление падает, клапан садится. Он работает без электричества и без автоматики.' },
    { id: 'press', x: 480, y: 68, w: 100, h: 46, label: 'Датчик давления\nи прессостат', color: '#6b4fa3', desc: 'Прессостат — выключатель, который срабатывает от давления. Достигли верхней уставки (в тренажёре 7,5 бар) — горелка выключается; упало до нижней (6,0 бар) — включается. Рядом — второй, независимый ограничитель давления (8,5 бар) на случай, если первый залип.' },
    { id: 'flame', x: 200, y: 420, w: 130, h: 55, label: 'Фотоэлемент\nконтроля факела', color: '#c28a1e', desc: '«Глаз» горелки: смотрит в топку и видит свет факела (бывают инфракрасные и ультрафиолетовые). Нет света — значит, топливо подаётся, а огня нет. За секунды топливный клапан закрывается и горелка блокируется. Без этого топка наполнилась бы горючим туманом.' },
    { id: 'consumers', x: 700, y: 130, w: 180, h: 110, label: 'Потребители пара', color: '#4f7a4f', desc: 'Пар по трубе идёт на подогрев топлива и масла, в камбуз (варка, посудомойка), в прачечную (гладильные катки, сушка), на обогрев помещений. Отдав тепло, пар превращается обратно в воду — конденсат — и по трубе возвращается в питательный бак.' },
    { id: 'panel', x: 600, y: 8, w: 260, h: 46, label: 'Щит управления\n+ трансформатор розжига', color: '#555f7a', desc: 'Электрический «мозг» котла: пускатели двигателей вентилятора и насосов, реле времени (продувка, время безопасности), защиты. Трансформатор розжига повышает напряжение до нескольких киловольт (порядка 10 кВ) для искры. Вся последовательность розжига выполняется по программе, и любая защита способна остановить её.' }
  ];
  const steps = [
    { part: 'level', text: 'Шаг 1. Перед любым пуском автоматика проверяет воду. Датчики видят норму (около 50 %), и сигнал «вода есть» разрешает розжиг. Без воды горелка не запустится вообще.' },
    { part: 'fuel', text: 'Шаг 2. Включается топливный насос и подогрев. Топливо циркулирует и греется до рабочей температуры. Пока оно холодное, розжиг не разрешён.' },
    { part: 'fan', text: 'Шаг 3. Запускается вентилятор — начинается ПРОДУВКА топки. Несколько объёмов воздуха вытесняют остатки паров топлива в дымовую трубу. Топливо ещё закрыто.' },
    { part: 'panel', text: 'Шаг 4. Продувка закончена. Реле времени в щите включает трансформатор розжига: между электродами горелки пошла искра. Топлива ещё нет — сначала нужна искра.' },
    { part: 'burner', text: 'Шаг 5. Открывается топливный клапан: форсунка распыляет топливо, оно смешивается с воздухом и вспыхивает от искры. Это самый ответственный момент — «время безопасности» (несколько секунд).' },
    { part: 'flame', text: 'Шаг 6. Фотоэлемент видит факел и «подтверждает» огонь, искра выключается. Если за время безопасности факела нет — топливо отсекается и котёл блокируется (авария «нет факела»).' },
    { part: 'furnace', text: 'Шаг 7. Идёт нормальная работа: факел греет топку и трубки. Мощность горелки — полная или плавно меняется по необходимости.' },
    { part: 'drum', text: 'Шаг 8. Вода в трубках закипает, пар собирается в барабане, давление растёт. Уровень воды поддерживает питательный насос.' },

      fromW(upsAlive, 60, 1, { id: 'gnss', t: 'GNSS/GPS и AIS' });
      fromW(live, 350, 0, { id: 'rad', t: 'Радар' }, live && S.radar < 1 ? `прогрев ${(S.radar * 100).toFixed(0)} %` : null);
      fromW(upsAlive, 200, 1, { id: 'ecd', t: 'ECDIS + резервный комплект' });
      fromW(apOn, 120, 0, { id: 'ap', t: 'Автопилот, эхолот, лаг' });
      fromW(upsAlive, 100, 1, { id: 'vdr', t: 'VDR + BNWAS' });
      fromW(gmAlive, 300, 1, { id: 'gm', t: 'Радиостанции ГМССБ' }, gmAlive && !live ? 'работает от своей АКБ' : null);
      parts.find(q => q.id === 'msb').color = S.mainOK ? '#a04000' : '#4d5656';
      parts.find(q => q.id === 'esb').color = genUp ? '#6c3483' : S.mainOK ? '#6c3483' : '#4d5656';
      parts.find(q => q.id === 'nsb').color = live ? '#1f6fa5' : '#4d5656';
      parts.find(q => q.id === 'ups').color = !live && S.soc > 0 ? '#b9770e' : S.soc <= 0 ? '#7b241c' : '#1e8449';
      parts.find(q => q.id === 'ups').label = `АКБ и ИБП 24 В\nзаряд ${(S.soc * 100).toFixed(0)} % · ${cap} А·ч`;
      const MAIN = '#e67e22', EM = '#b36bff', AC = '#f4d03f', DC = '#2ecc71';
      flowB(g, [[190, 75], [230, 75], [230, 140], [270, 140]], MAIN, t, src === 'main', 4);
      flowB(g, [[190, 235], [230, 235], [230, 190], [270, 190]], EM, t, src === 'emerg', 4);
      flowB(g, [[105, 110], [105, 200]], MAIN, t, S.mainOK, 3);
      flowB(g, live ? [[365, 220], [365, 300]] : [[365, 300], [365, 220]], DC, t, live || S.soc > 0, 3);
      flowB(g, [[460, 165], [560, 165]], AC, t, live, 4);
      const busCol = live ? AC : DC;
      flowB(g, [[560, 40], [560, 481]], busCol, t, upsAlive || gmAlive, 4);
      const list = [['gyro', 40, upsAlive], ['mag', 103, true], ['gnss', 166, upsAlive], ['rad', 229, live], ['ecd', 292, upsAlive], ['ap', 355, apOn], ['vdr', 418, upsAlive], ['gm', 481, gmAlive]];
      list.forEach(([id, y, on]) => { flowB(g, [[560, y], [650, y]], live ? AC : DC, t, on && id !== 'mag', 3); });
      if (!live && S.soc > 0) flowB(g, [[460, 335], [560, 335]], DC, t, true, 4);
      g.fillStyle = css('--fg'); g.font = '12px system-ui'; g.textAlign = 'left';
      g.fillText('основной фидер', 232, 100); g.fillText('аварийный фидер', 192, 262); g.fillText('ток', 569, 55);
      g.fillText(live ? '230 В переменного тока' : '24 В от АКБ', 466, 156);
      // показания
      g.font = '13px system-ui'; const srcT = { main: 'основной (ГРЩ)', emerg: 'аварийный (АРЩ)', none: 'НЕТ (АКБ)' }[src];
      const rows = [
        `Время блэкаута: ${S.mainOK ? '—' : fmtT(S.tb)}`, `Источник мостика: ${srcT}`,
        `Аварийный ДГ: ${S.mainOK ? 'готов (в дежурстве)' : S.genFail ? 'НЕ ЗАПУСТИЛСЯ' : genUp ? 'в работе' : 'запуск (до 45 с)…'}`,
        `АКБ ИБП: ${(S.soc * 100).toFixed(0)} % · хватит на ${live ? '—' : fmtT(S.soc * cap * 24 * 0.8 / Wups * 3600)}`,
        `Нагрузка на ИБП: ${Wups} Вт`, `ГМССБ: осталось ${(S.gm * gmh).toFixed(1)} ч из ${gmh} ч`,
        `Гирокомпас: ${upsAlive ? (S.gyro < 1 ? 'выход на меридиан ' + (S.gyro * 100).toFixed(0) + ' %' : 'готов') : 'остановлен'}`
      ];
      rows.forEach((s, i) => g.fillText(s, 20, 322 + i * 21));
      g.font = '600 13px system-ui'; g.fillStyle = !live && S.soc <= 0 ? '#e74c3c' : S.mainOK ? '#2ecc71' : '#f39c12';
      g.fillText(!live && S.soc <= 0 ? 'АКБ разряжены: мостик без питания!' : S.mainOK ? 'Нормальное питание.' : live ? 'Блэкаут: питание от аварийного источника.' : 'Блэкаут: питание только от АКБ.', 20, 480);
      g.font = '12px system-ui'; [[MAIN, 'сеть 440 В от ГРЩ'], [EM, 'аварийный фидер'], [AC, '230 В на приборы'], [DC, '24 В постоянный ток (АКБ)']].forEach((q, i) => { g.strokeStyle = q[0]; g.lineWidth = 4; g.beginPath(); g.moveTo(275, 410 + i * 17); g.lineTo(305, 410 + i * 17); g.stroke(); g.lineWidth = 1; g.fillStyle = css('--fg'); g.fillText(q[1], 313, 411 + i * 17); });
      g.fillText('серый пунктир — нет тока', 275, 490);
    }
  });
  const B = (id, f) => { $(root, '#' + id).onclick = f; };
  B('n1', () => { S.mainOK = false; S.tb = 0; }); B('n2', () => { S.genFail = !S.genFail; $(root, '#n2').className = 'btn' + (S.genFail ? ' on' : ''); });
  B('n3', () => { S.mainOK = true; S.tb = 0; });
  bind(root, ['cap'], () => { });
  return kit;
};
