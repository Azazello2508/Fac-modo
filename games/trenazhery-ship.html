<html lang="ru"><head><!--fm-i18n--><script>(function(){var L=window.FM_LANG;if(L!=="en"&&L!=="uk")return;var X=L==="en"?0:1,D={"В":["V","В"],"А":["A","А"],"м":["m","м"],"с":["s","с"],"ч":["h","год"],"% (макс.":["% (max.","% (макс."],"% · хватит на":["% · enough for","% · вистачить на"],"% от полных), мощность ≈":["% of full), power ≈","% від повних), потужність ≈"],"(Y-Δ или частотник)":["(Y-Δ or VFD)","(Y-Δ або частотник)"],"(ГРЩ) 440 В":["(MSB) 440 V","(ГРЩ) 440 В"],"(бесперебойное питание)":["(uninterruptible power)","(безперебійне живлення)"],"(выбран)":["(selected)","(обрано)"],"(главный щит)":["(main switchboard)","(головний щит)"],"(двухтактный)":["(two-stroke)","(двотактний)"],"(джойстик, кнопки)":["(joystick, buttons)","(джойстик, кнопки)"],"(клапан впрыска FIVA)":["(injection valve FIVA)","(клапан упорскування FIVA)"],"(лопасти рег. шага)":["(controllable pitch blades)","(лопаті рег. кроку)"],"(насос работает)":["(pump running)","(насос працює)"],"(порядка 1,5 МВт)":["(about 1.5 MW)","(близько 1,5 МВт)"],"(своя резервная батарея)":["(own backup battery)","(власна резервна батарея)"],"(тревога)":["(alarm)","(тривога)"],"(удар!)":["(shock!)","(удар!)"],"+ BNWAS (бдительность)":["+ BNWAS (alertness)","+ BNWAS (пильність)"],"+ аварийный ДГ":["+ emergency DG","+ аварійний ДГ"],"+ резервный комплект":["+ backup set","+ резервний комплект"],"+ трансформатор розжига":["+ ignition transformer","+ трансформатор розпалу"],". Разгон":[". Acceleration",". Розгін"],"1 час (есть аварийный источник)":["1 hour (an emergency source exists)","1 година (є аварійне джерело)"],"230 В на приборы":["230 V to the instruments","230 В на прилади"],"230 В переменного тока":["230 V AC","230 В змінного струму"],"24 В от АКБ":["24 V from the battery","24 В від АКБ"],"24 В постоянный ток (АКБ)":["24 V DC (battery)","24 В постійний струм (АКБ)"],"35 %) — защита по минимальному напряжению сорвала пуск. На судне мигает свет!":["35%) — the undervoltage protection aborted the start. The lights flicker on the ship!","35 %) — захист за мінімальною напругою зірвав пуск. На судні блимає світло!"],"50 %): падают контакторы и частотные преобразователи, срабатывает защита ДГ":["50%): contactors and frequency converters drop out, the DG protection trips","50 %): падають контактори й частотні перетворювачі, спрацьовує захист ДГ"],"6 часов (нет аварийного источника)":["6 hours (no emergency source)","6 годин (немає аварійного джерела)"],"ECDIS (электронная карта)":["ECDIS (electronic chart)","ECDIS (електронна карта)"],"ECDIS (электронная картографическая навигационная информационная система) заменяет бумажную карту. Обязателен резервный: второй ECDIS на отдельном питании или бумажные карты. Если пропадёт питание, карта гаснет — важно, чтобы резерв был на другом источнике.":["ECDIS (electronic chart display and information system) replaces the paper chart. A backup is mandatory: a second ECDIS on a separate supply, or paper charts. If the power is lost, the chart goes out — it is important that the backup is on a different source.","ECDIS (електронна картографічна навігаційна інформаційна система) замінює паперову карту. Обов’язковий резервний: другий ECDIS на окремому живленні або паперові карти. Якщо зникне живлення, карта гасне — важливо, щоб резерв був на іншому джерелі."],"ECDIS + резервный комплект":["ECDIS + backup set","ECDIS + резервний комплект"],"ECDIS на ИБП работает без перерыва; второй комплект должен быть на отдельном питании.":["The ECDIS on the UPS works without a break; the second set must be on a separate supply.","ECDIS на ДБЖ працює без перерви; другий комплект має бути на окремому живленні."],"ECU подаёт короткий сигнал на электроклапан. Он открывается на миллисекунды, масло давит на усилитель и топливо (жёлтый поток) летит к форсункам под ~1000 бар.":["The ECU sends a short signal to the electro-valve. It opens for milliseconds, the oil presses on the booster and the fuel (yellow flow) flies to the nozzles at ~1000 bar.","ECU подає короткий сигнал на електроклапан. Він відкривається на мілісекунди, мастило тисне на підсилювач і паливо (жовтий потік) летить до форсунок під ~1000 бар."],"ECU получает заданные обороты и рассчитывает, сколько топлива нужно и в какой момент оборота впрыснуть и открыть клапан для каждого цилиндра.":["The ECU receives the set speed and calculates how much fuel is needed and at what point of the revolution to inject and open the valve for each cylinder.","ECU отримує задані оберти і розраховує, скільки палива потрібно і в який момент оберту впорснути й відкрити клапан для кожного циліндра."],"GNSS (глобальная навигационная спутниковая система, включая GPS) — определяет место судна. AIS (автоматическая идентификационная система) — передаёт данные о судне другим кораблям и берегу. Потеряют питание — пропадёт точка на карте, суда перестанут видеть вас на экранах.":["GNSS (global navigation satellite system, including GPS) determines the ship's position. AIS (automatic identification system) transmits data about the ship to other ships and the shore. If they lose power, the dot disappears from the chart, and ships stop seeing you on their screens.","GNSS (глобальна навігаційна супутникова система, включно з GPS) визначає місце судна. AIS (автоматична ідентифікаційна система) передає дані про судно іншим кораблям і берегу. Втратять живлення — зникне точка на карті, судна перестануть бачити вас на екранах."],"GNSS/GPS и AIS":["GNSS/GPS and AIS","GNSS/GPS і AIS"],"PMS (Power Management System) — «диспетчер энергии». Перед пуском подруливающего проверяет, хватит ли свободной мощности. Если нет — заранее запускает ещё один ДГ, синхронизирует его и только потом разрешает пуск. Во время работы может ограничить тягу, чтобы не допустить перегруза и блэкаута.":["PMS (Power Management System) is the \"energy dispatcher\". Before the thruster starts it checks whether there is enough free power. If not, it starts another DG in advance, synchronises it and only then permits the start. During operation it can limit the thrust to avoid overload and blackout.","PMS (Power Management System) — «диспетчер енергії». Перед пуском підрулювального перевіряє, чи вистачить вільної потужності. Якщо ні — заздалегідь запускає ще один ДГ, синхронізує його і лише потім дозволяє пуск. Під час роботи може обмежити тягу, щоб не допустити перевантаження і блекауту."],"PMS ОБОЙДЕНА вручную: проверки мощности нет! Свободно":["PMS BYPASSED manually: no power check! Free","PMS ОБІЙДЕНО вручну: перевірки потужності немає! Вільно"],"PMS обойдена: пуски и тяга без проверки мощности!":["PMS bypassed: starts and thrust without a power check!","PMS обійдено: пуски й тяга без перевірки потужності!"],"PMS ограничила тягу!":["PMS limited the thrust!","PMS обмежила тягу!"],"PMS снова в работе.":["PMS is back in service.","PMS знову в роботі."],"PMS: ЗАПРЕТ пуска. Свободно":["PMS: start PROHIBITED. Free","PMS: ЗАБОРОНА пуску. Вільно"],"PMS: мощности всё ещё мало — пуск запрещён.":["PMS: power is still short — start prohibited.","PMS: потужності все ще мало — пуск заборонено."],"PMS: пуск резервного ДГ…":["PMS: starting the standby DG…","PMS: пуск резервного ДГ…"],"PMS: свободно":["PMS: free","PMS: вільно"],"PMS: свободно только":["PMS: only","PMS: вільно лише"],"PMS: система":["PMS: power","PMS: система"],"Pсжатия≈":["Pcompression≈","Pстиснення≈"],"VDR («чёрный ящик»)":["VDR (\"black box\")","VDR («чорна скринька»)"],"VDR (регистратор данных рейса) записывает переговоры на мостике, радар, курс, скорость — для расследования аварий. После пропажи основной сети должен работать от резервной батареи ещё около 2 часов (сверять с требованиями). BNWAS (система сигнализации бдительности вахтенного) будит вахтенного, если он не нажал кнопку.":["The VDR (voyage data recorder) records bridge conversations, radar, course and speed for accident investigation. After the main supply is lost it must keep working from its backup battery for about 2 more hours (check against the requirements). The BNWAS (bridge navigational watch alarm system) wakes the watchkeeper if they have not pressed the button.","VDR (реєстратор даних рейсу) записує переговори на містку, радар, курс, швидкість — для розслідування аварій. Після зникнення основної мережі має працювати від резервної батареї ще близько 2 годин (звіряти з вимогами). BNWAS (система сигналізації пильності вахтового) будить вахтового, якщо він не натиснув кнопку."],"VDR продолжает запись от своей резервной батареи; без неё расследование аварии потеряет все данные.":["The VDR keeps recording from its own backup battery; without it the accident investigation will lose all the data.","VDR продовжує запис від власної резервної батареї; без неї розслідування аварії втратить усі дані."],"«Глаз» горелки: смотрит в топку и видит свет факела (бывают инфракрасные и ультрафиолетовые). Нет света — значит, топливо подаётся, а огня нет. За секунды топливный клапан закрывается и горелка блокируется. Без этого топка наполнилась бы горючим туманом.":["The \"eye\" of the burner: it looks into the furnace and sees the light of the flame (infrared and ultraviolet types exist). No light means fuel is being supplied but there is no fire. Within seconds the fuel valve closes and the burner is locked out. Without this the furnace would fill with combustible mist.","«Око» пальника: дивиться в топку і бачить світло факела (бувають інфрачервоні й ультрафіолетові). Немає світла — значить, паливо подається, а вогню немає. За секунди паливний клапан закривається і пальник блокується. Без цього топка наповнилася б пальним туманом."],"° от ВМТ":["° from TDC","° від ВМТ"],"° от ВМТ, длит.":["° from TDC, duration","° від ВМТ, тривал."],"° после ВМТ":["° after TDC","° після ВМТ"],"° угла поворота коленвала (− раньше)":["° of crank angle (− earlier)","° кута повороту колінвала (− раніше)"],"°C   Пар:":["°C   Steam:","°C   Пара:"],"× Iн":["× Ir","× Iн"],"Ёмкость АКБ ИБП":["UPS battery capacity","Ємність АКБ ДБЖ"],"А·ч":["Ah","А·год"],"А·ч (24 В)":["Ah (24 V)","А·год (24 В)"],"АВАРИЙНАЯ ОСТАНОВКА (SHUTDOWN): топливо отсечено.":["EMERGENCY STOP (SHUTDOWN): fuel cut off.","АВАРІЙНА ЗУПИНКА (SHUTDOWN): паливо відсічено."],"АВАРИЙНЫЙ ОСТАНОВ (нужен сброс)":["EMERGENCY STOP (reset needed)","АВАРІЙНА ЗУПИНКА (потрібне скидання)"],"АВАРИЯ:":["ALARM:","АВАРІЯ:"],"АВАРИЯ: перегрев обмотки двигателя (≥ 125 °C) — защита остановила двигатель":["FAULT: motor winding overheating (≥ 125 °C) — the protection stopped the motor","АВАРІЯ: перегрів обмотки двигуна (≥ 125 °C) — захист зупинив двигун"],"АВАРИЯ: просадка напряжения":["FAULT: voltage sag","АВАРІЯ: просідання напруги"],"АКБ ИБП:":["UPS battery:","АКБ ДБЖ:"],"АКБ и ИБП 24 В":["Batteries and UPS 24 V","АКБ і ДБЖ 24 В"],"АКБ разряжены: мостик без питания!":["Batteries are flat: the bridge has no power!","АКБ розряджені: місток без живлення!"],"Аварийная остановка":["Emergency stop","Аварійна зупинка"],"Аварийный ДГ не запустился":["Emergency DG failed to start","Аварійний ДГ не запустився"],"Аварийный ДГ:":["Emergency DG:","Аварійний ДГ:"],"Аварийный распределительный щит и аварийный дизель-генератор. В нормальном режиме щит питается от ГРЩ. При блэкауте дизель стартует сам и принимает нагрузку в течение 45 секунд (требование SOLAS, сверять с классификационным обществом). Он питает только самое важное: навигацию, связь, освещение, рули.":["The emergency switchboard and the emergency diesel generator. In normal mode the board is supplied from the MSB. In a blackout the diesel starts by itself and takes the load within 45 seconds (a SOLAS requirement, check with the classification society). It supplies only the most important things: navigation, communications, lighting, steering.","Аварійний розподільний щит і аварійний дизель-генератор. У нормальному режимі щит живиться від ГРЩ. При блекауті дизель стартує сам і приймає навантаження протягом 45 секунд (вимога SOLAS, звіряти з класифікаційним товариством). Він живить лише найважливіше: навігацію, зв’язок, освітлення, стерна."],"Аварийный щит (АРЩ)":["Emergency switchboard (ESB)","Аварійний щит (АРЩ)"],"Аварийный щит запитан от главного (серые стрелки). Аварийный дизель стоит наготове: по сигналу пропажи напряжения стартует.":["The emergency board is supplied from the main one (grey arrows). The emergency diesel stands ready: on the loss-of-voltage signal it starts.","Аварійний щит живиться від головного (сірі стрілки). Аварійний дизель стоїть напоготові: за сигналом зникнення напруги стартує."],"Авария сброшена.":["Fault reset.","Аварію скинуто."],"Авария: залип прессостат":["Fault: pressure switch stuck","Аварія: залип пресостат"],"Авария: нет давления гидравлики":["Fault: no hydraulic pressure","Аварія: немає тиску гідравліки"],"Авария: нет охлаждения":["Fault: no cooling","Аварія: немає охолодження"],"Авария: отказ питательного насоса":["Fault: feed pump failure","Аварія: відмова живильного насоса"],"Авария: отказали прессостат и ограничитель":["Fault: pressure switch and limiter failed","Аварія: відмовили пресостат і обмежувач"],"Авария: пропал факел":["Fault: flame loss","Аварія: зник факел"],"Авто":["Auto","Авто"],"Автоматика подруливающего. Разрешает пуск только если выполнены условия (блокировки): рукоятка на нуле, есть давление масла в гидравлике, идёт охлаждение, PMS даёт «добро», нет аварий. Следит за температурой и током и останавливает двигатель при угрозе.":["The thruster automation. It permits a start only if the conditions (interlocks) are met: lever at zero, hydraulic oil pressure present, cooling running, PMS gives the \"go-ahead\", no alarms. It monitors temperature and current and stops the motor in case of danger.","Автоматика підрулювального. Дозволяє пуск, лише якщо виконано умови (блокування): рукоятка на нулі, є тиск мастила в гідравліці, йде охолодження, PMS дає «добро», немає аварій. Стежить за температурою й струмом і зупиняє двигун при загрозі."],"Автоматически (АВР)":["Automatic (ATS)","Автоматично (АВР)"],"Автопилот держит курс, эхолот измеряет глубину под килём, лаг — скорость относительно воды. При аварийном питании автопилот обычно отключается: на ручном управлении рулём судно ведёт рулевой. Эхолот и лаг тоже зависят от проекта.":["The autopilot holds the course, the echo sounder measures the depth under the keel, the log measures speed through the water. On emergency power the autopilot usually switches off: the helmsman steers the ship by hand. The echo sounder and log also depend on the design.","Автопілот тримає курс, ехолот вимірює глибину під кілем, лаг — швидкість відносно води. При аварійному живленні автопілот зазвичай вимикається: на ручному керуванні стерном судно веде стернове. Ехолот і лаг теж залежать від проєкту."],"Автопилот, эхолот, лаг":["Autopilot, echo sounder, log","Автопілот, ехолот, лаг"],"Аккумуляторы и ИБП 24 В":["Batteries and UPS 24 V","Акумулятори й ДБЖ 24 В"],"БЛОКИРОВКА (нужен сброс)":["LOCKOUT (reset needed)","БЛОКУВАННЯ (потрібне скидання)"],"БЛОКИРОВКА: джойстик не в нуле — пуск разрешён только при нулевой тяге (нулевом шаге).":["INTERLOCK: joystick not at zero — a start is permitted only at zero thrust (zero pitch).","БЛОКУВАННЯ: джойстик не в нулі — пуск дозволений лише при нульовій тязі (нульовому кроці)."],"БЛОКИРОВКА: нет давления в гидросистеме шага лопастей — пуск запрещён.":["INTERLOCK: no pressure in the blade pitch hydraulics — start prohibited.","БЛОКУВАННЯ: немає тиску в гідросистемі кроку лопатей — пуск заборонено."],"БЛОКИРОВКА: нет охлаждения двигателя — пуск запрещён.":["INTERLOCK: no motor cooling — start prohibited.","БЛОКУВАННЯ: немає охолодження двигуна — пуск заборонено."],"БЛЭКАУТ":["BLACKOUT","БЛЕКАУТ"],"БЛЭКАУТ — на шинах нет напряжения":["BLACKOUT — no voltage on the buses","БЛЕКАУТ — на шинах немає напруги"],"БЛЭКАУТ:":["BLACKOUT:","БЛЕКАУТ:"],"Блокировка сброшена вручную, цикл начнётся заново":["Lockout reset manually, the cycle will start again","Блокування скинуто вручну, цикл почнеться знову"],"Блэкаут":["Blackout","Блекаут"],"Блэкаут: питание от аварийного источника.":["Blackout: powered from the emergency source.","Блекаут: живлення від аварійного джерела."],"Блэкаут: питание только от АКБ.":["Blackout: powered from the batteries only.","Блекаут: живлення лише від АКБ."],"Большая ёмкость, наполовину с водой, сверху — пар. Вода по трубкам греется в топке, кипит, и пар собирается наверху. Это «кастрюля» котла. Главное правило: трубки и барабан всегда должны быть в воде. Остался без воды при горящем факеле — металл перегреется и порвётся.":["A large vessel, half full of water with steam above. The water heats in the tubes in the furnace, boils, and the steam collects at the top. This is the \"saucepan\" of the boiler. The main rule: the tubes and the drum must always be under water. If the flame burns with no water, the metal overheats and bursts.","Велика ємність, наполовину з водою, зверху — пара. Вода по трубках гріється в топці, кипить, і пара збирається нагорі. Це «каструля» котла. Головне правило: трубки й барабан завжди мають бути у воді. Лишився без води при палаючому факелі — метал перегріється і розірветься."],"В нормальном режиме мостик питается от главного щита: ток 440 В идёт на щит навигации. Оттуда — на приборы.":["In normal mode the bridge is supplied from the main switchboard: 440 V goes to the navigation board. From there it goes to the instruments.","У нормальному режимі місток живиться від головного щита: струм 440 В іде на щит навігації. Звідти — на прилади."],"В тёплый бак возвращается конденсат (вода из остывшего пара) и подпитка. Питательный насос подаёт воду в барабан, когда уровень упал. Это «подливание воды в кастрюлю». Насос включается и выключается по датчикам уровня. Отказал насос — уровень медленно падает, пока защита не погасит горелку.":["Condensate (water from cooled steam) and make-up return to the warm tank. The feed pump supplies water to the drum when the level has dropped. It is like \"topping up the saucepan\". The pump starts and stops on the level sensors. If the pump fails, the level slowly falls until the protection shuts off the burner.","До теплого бака повертається конденсат (вода з охолодженої пари) і підживлення. Живильний насос подає воду в барабан, коли рівень упав. Це «доливання води в каструлю». Насос вмикається й вимикається за датчиками рівня. Відмовив насос — рівень повільно падає, поки захист не погасить пальник."],"Вентилятор":["Air","Вентилятор"],"Вернуть судно к исходному положению":["Return the ship to the initial position","Повернути судно в початкове положення"],"Винт в тоннеле":["Propeller in tunnel","Гвинт у тунелі"],"Вкл/выкл (полная мощность)":["On/off (full output)","Вкл/викл (повна потужність)"],"Вместо кулачка на валу выпускной клапан открывает масло под давлением: электроклапан ELVA (Exhaust Valve Actuator) подаёт его в гидроцилиндр над клапаном, а пружина (воздушная) закрывает. ECU выбирает момент открытия и закрытия отдельно для каждого цилиндра. Не откроется — цилиндр не «выдохнет» и двигатель не пойдёт на этом цилиндре.":["Instead of a camshaft cam, the exhaust valve is opened by oil under pressure: the ELVA electro-valve (Exhaust Valve Actuator) feeds it to a hydraulic cylinder above the valve, and an (air) spring closes it. The ECU chooses the opening and closing moment separately for each cylinder. If it does not open, the cylinder does not \"exhale\" and the engine will not fire on that cylinder.","Замість кулачка на валу випускний клапан відкриває мастило під тиском: електроклапан ELVA (Exhaust Valve Actuator) подає його в гідроциліндр над клапаном, а пружина (повітряна) закриває. ECU вибирає момент відкриття й закриття окремо для кожного циліндра. Не відкриється — циліндр не «видихне» і двигун не піде на цьому циліндрі."],"Вода или воздух через теплообменник уносят тепло обмоток. Двигатель на 1,5 МВт при потерях в несколько процентов выделяет десятки киловатт тепла: без охлаждения за считанные минуты температура вырастет до опасной. Датчики температуры обмоток отключат двигатель по аварии.":["Water or air carries the heat of the windings away through a heat exchanger. A 1.5 MW motor with losses of a few percent gives off tens of kilowatts of heat: without cooling the temperature will rise to a dangerous level within minutes. The winding temperature sensors will trip the motor on an alarm.","Вода або повітря через теплообмінник виносять тепло обмоток. Двигун на 1,5 МВт при втратах у кілька відсотків виділяє десятки кіловат тепла: без охолодження за лічені хвилини температура виросте до небезпечної. Датчики температури обмоток відключать двигун за аварією."],"Водомерное стекло":["Gauge glass","Водомірне скло"],"Восстановить питание":["Restore power","Відновити живлення"],"Впрыск: начало":["Injection: start","Упорскування: початок"],"Время блэкаута:":["Blackout time:","Час блекауту:"],"Все уставки и времена здесь учебные: пуск горелки 6,0 бар, останов 7,5 бар, ограничитель 8,5 бар, предохранительный клапан 9,0 бар, аварийно-низкий уровень 15 %. Продувка в тренажёре 6 с (в жизни — десятки секунд, по инструкции котла). Реальные значения задаёт проект и требования классификационного общества и флага — сверяйте.":["All setpoints and times here are for learning: burner start 6.0 bar, stop 7.5 bar, limiter 8.5 bar, safety valve 9.0 bar, extremely low level 15%. The purge in the trainer is 6 s (in real life tens of seconds, per the boiler manual). Real values are set by the design and the requirements of the classification society and the flag — check them.","Усі уставки й часи тут навчальні: пуск пальника 6,0 бар, зупин 7,5 бар, обмежувач 8,5 бар, запобіжний клапан 9,0 бар, аварійно-низький рівень 15 %. Продування в тренажері 6 с (у житті — десятки секунд, за інструкцією котла). Реальні значення задає проєкт та вимоги класифікаційного товариства й прапора — звіряйте."],"Вт":["W","Вт"],"ГМССБ имеет собственный резерв: 1 или 6 часов (ползунок «Резерв ГМССБ»). Потратили — радио замолчит.":["The GMDSS has its own reserve: 1 or 6 hours (the \"GMDSS reserve\" slider). Once used up, the radio falls silent.","ГМЗЛБ має власний резерв: 1 або 6 годин (повзунок «Резерв ГМЗЛБ»). Витратили — радіо замовкне."],"ГМССБ — глобальная морская система связи при бедствии и для безопасности. Передаёт сигнал бедствия, принимает штормовые предупреждения. Имеет собственную резервную батарею: 1 или 6 часов (в зависимости от того, есть ли на судне соответствующий аварийный источник; сверять с требованиями классификационного общества и флага).":["The GMDSS is the global maritime distress and safety communication system. It sends the distress signal and receives storm warnings. It has its own backup battery: 1 or 6 hours (depending on whether the ship has the corresponding emergency source; check with the requirements of the classification society and the flag).","ГМЗЛБ — глобальна морська система зв’язку при лихах і для безпеки. Передає сигнал лиха, приймає штормові попередження. Має власну резервну батарею: 1 або 6 годин (залежно від того, чи є на судні відповідне аварійне джерело; звіряти з вимогами класифікаційного товариства й прапора)."],"ГМССБ: осталось":["GMDSS: remaining","ГМЗЛБ: залишилось"],"Гидравлическая силовая":["Hydraulic power","Гідравлічна силова"],"Гидроблок цилиндра":["Cylinder hydraulic unit","Гідроблок циліндра"],"Гидростанция":["Pitch hydraulic","Гідростанція"],"Гирокомпас":["Gyrocompass","Гірокомпас"],"Гирокомпас — на ИБП: потеряет питание, придётся ждать часы выхода на меридиан. Попробуйте «Только АКБ» и маленькую ёмкость.":["The gyrocompass is on the UPS: if it loses power you will have to wait hours for it to settle on the meridian. Try \"Batteries only\" and a small capacity.","Гірокомпас — на ДБЖ: утратить живлення, доведеться чекати години виходу на меридіан. Спробуйте «Лише АКБ» і малу ємність."],"Гирокомпас:":["Gyrocompass:","Гірокомпас:"],"Главный двигатель с электронным управлением":["Main engine with electronic control","Головний двигун з електронним керуванням"],"Главный распред. щит":["Main switchboard","Головний розподільний щит"],"Главный распределительный щит: сюда подключены судовые генераторы. Это основной источник для всего судна, в том числе для мостика. Блэкаут — когда все генераторы встали и щит остался без напряжения.":["The main switchboard: the ship's generators are connected here. It is the main source for the whole ship, including the bridge. A blackout is when all generators have stopped and the board is left without voltage.","Головний розподільний щит: сюди підключені суднові генератори. Це основне джерело для всього судна, зокрема для містка. Блекаут — коли всі генератори стали і щит залишився без напруги."],"Горелка":["Burner","Пальник"],"Гц":["Hz","Гц"],"ДГ":["DG","ДГ"],"ДГ1 работает":["DG1 running","ДГ1 працює"],"ДГ2 работает":["DG2 running","ДГ2 працює"],"ДГ3 остановлен":["DG3 stopped","ДГ3 зупинено"],"ДО пуска подруливающего.":["BEFORE the thruster start.","ДО пуску підрулювального."],"Давление":["Pressure","Тиск"],"Давление в цилиндре: сейчас":["Cylinder pressure: now","Тиск у циліндрі: зараз"],"Давление высокое — ждём падения до 6,0 бар":["Pressure is high — waiting for it to fall to 6.0 bar","Тиск високий — чекаємо падіння до 6,0 бар"],"Давление гидравлики восстановлено.":["Hydraulic pressure restored.","Тиск гідравліки відновлено."],"Давление масла силовой установки:":["Power unit oil pressure:","Тиск мастила силової установки:"],"Давление масла упало ниже ~150 бар: клапаны не работают — остановка.":["The oil pressure fell below ~150 bar: the valves do not work — stop.","Тиск мастила впав нижче ~150 бар: клапани не працюють — зупинка."],"Давление пара:":["Steam pressure:","Тиск пари:"],"Давление упало до":["Pressure fell to","Тиск упав до"],"Датчик давления":["Pressure sensor","Датчик тиску"],"Датчик на коленвале постоянно сообщает ECU точный угол поворота. Попробуйте кнопку «Потеря датчика» и посмотрите, что произойдёт.":["The crankshaft sensor constantly reports the exact angle to the ECU. Try the \"Sensor loss\" button and see what happens.","Датчик на колінвалі постійно повідомляє ECU точний кут повороту. Спробуйте кнопку «Втрата датчика» і подивіться, що станеться."],"Датчик положения":["Crankshaft position","Датчик положення"],"Двигатель на рабочих оборотах. Теперь джойстик меняет тягу.":["The motor is at working speed. Now the joystick changes the thrust.","Двигун на робочих обертах. Тепер джойстик змінює тягу."],"Двигатель стоит горизонтально, а вал винта в тоннеле — поперёк судна. Редуктор «поворачивает» вращение на 90° и (часто) снижает обороты. Нужна смазка и охлаждение масла; перегрев или нехватка масла — причина поломки.":["The motor lies horizontally, while the propeller shaft in the tunnel runs across the ship. The gearbox \"turns\" the rotation through 90° and (often) reduces the speed. Lubrication and oil cooling are needed; overheating or lack of oil is a cause of breakdown.","Двигун стоїть горизонтально, а вал гвинта в тунелі — упоперек судна. Редуктор «повертає» обертання на 90° і (часто) знижує оберти. Потрібні мащення й охолодження мастила; перегрів або нестача мастила — причина поломки."],"Джойстик в ноль":["Joystick to zero","Джойстик у нуль"],"Джойстик: ← нос влево … нос вправо →":["Joystick: ← bow left … bow right →","Джойстик: ← ніс ліворуч … ніс праворуч →"],"Дизель-":["Diesel","Дизель-"],"Диск с метками на коленвале и считывающие головки (обычно два комплекта). ECU по ним знает угол поворота с точностью долей градуса и обороты. Без этого сигнала ECU «слепой»: не знает, когда впрыскивать. Потеряли один — работает резервный; оба — аварийная остановка.":["A disc with marks on the crankshaft and reading heads (usually two sets). From them the ECU knows the angle of rotation to a fraction of a degree, and the speed. Without this signal the ECU is \"blind\": it does not know when to inject. If one is lost, the backup works; if both, an emergency stop.","Диск із мітками на колінвалі та зчитувальні головки (зазвичай два комплекти). З них ECU знає кут повороту з точністю до часток градуса та оберти. Без цього сигналу ECU «сліпий»: не знає, коли впорскувати. Втратили один — працює резервний; обидва — аварійна зупинка."],"Дистанционное":["Remote","Дистанційне"],"Для сравнения:":["For comparison:","Для порівняння:"],"Дутьё после останова":["Post-purge","Дуття після зупину"],"Если масло, температура или обороты вышли за предел — защита сама снижает нагрузку или останавливает двигатель. Нажмите «Аварийная остановка».":["If the oil, temperature or speed goes beyond the limit, the protection itself reduces the load or stops the engine. Press \"Emergency stop\".","Якщо мастило, температура чи оберти вийшли за межу — захист сам знижує навантаження або зупиняє двигун. Натисніть «Аварійна зупинка»."],"Журнал событий:":["Event log:","Журнал подій:"],"Заданные обороты":["Set speed","Задані оберти"],"Замедление показа:":["Slow-motion display:","Уповільнення показу:"],"Зачем электроника вместо кулачкового вала.":["Why electronics instead of a camshaft.","Навіщо електроніка замість розподільного вала."],"Защиты по давлению исправны":["Pressure protections healthy","Захисти за тиском справні"],"Звезда-треугольник":["Star-delta","Зірка-трикутник"],"Звезда-треугольник + ВРШ":["Star-delta + CPP","Зірка-трикутник + ГРК"],"Здесь сгорает топливо. Двухтактный двигатель: за один оборот вала — один рабочий ход. Воздух входит через окна внизу цилиндра, продукты сгорания уходят через выпускной клапан сверху. Поршень толкает шатун и вращает коленвал, а тот — гребной винт.":["This is where the fuel burns. A two-stroke engine: one power stroke per shaft revolution. Air enters through the ports at the bottom of the cylinder, and the combustion products leave through the exhaust valve at the top. The piston pushes the connecting rod and turns the crankshaft, and that turns the propeller.","Тут згоряє паливо. Двотактний двигун: за один оберт вала — один робочий хід. Повітря входить через вікна внизу циліндра, продукти згоряння йдуть через випускний клапан угорі. Поршень штовхає шатун і обертає колінвал, а той — гребний гвинт."],"ИБП — источник бесперебойного питания: зарядное устройство плюс батарея на 24 В. Пока сеть есть — заряжает батарею. Пропала сеть — приборы переходят на батарею без пропуска. Это «переходный источник»: перекрывает пустоту, пока запускается аварийный дизель. Сели аккумуляторы — приборы гаснут.":["A UPS is an uninterruptible power supply: a charger plus a 24 V battery. While the mains is present, it charges the battery. When the mains is lost, the instruments transfer to the battery without a gap. It is a \"transitional source\": it bridges the gap while the emergency diesel starts. If the batteries run flat, the instruments go dark.","ДБЖ — джерело безперебійного живлення: зарядний пристрій плюс батарея на 24 В. Поки мережа є — заряджає батарею. Зникла мережа — прилади переходять на батарею без пропуску. Це «перехідне джерело»: перекриває порожнечу, поки запускається аварійний дизель. Сіли акумулятори — прилади гаснуть."],"Источник всей энергии на судне. Каждый ДГ в тренажёре даёт 2000 кВт (условно). Подруливающее на 1,5 МВт — крупный потребитель: на небольшой станции оно способно «съесть» почти весь запас мощности. Работающих ДГ должно хватать на нагрузку судна плюс подруливающее.":["The source of all power on the ship. Each DG in the trainer gives 2000 kW (conditional). The 1.5 MW bow thruster is a large consumer: on a small power plant it can \"eat\" almost the whole power reserve. The running DGs must be enough for the ship's load plus the thruster.","Джерело всієї енергії на судні. Кожен ДГ у тренажері дає 2000 кВт (умовно). Підрулювальний на 1,5 МВт — великий споживач: на невеликій станції він здатен «з’їсти» майже весь запас потужності. Працюючих ДГ має вистачати на навантаження судна плюс підрулювальний."],"Источник мостика:":["Bridge source:","Джерело містка:"],"Когда поршень отработал вниз, ECU открывает выпускной клапан: газы уходят из цилиндра, через окна входит свежий воздух (зелёные стрелки).":["When the piston has done its downward stroke, the ECU opens the exhaust valve: gases leave the cylinder and fresh air enters through the ports (green arrows).","Коли поршень відпрацював донизу, ECU відкриває випускний клапан: гази йдуть із циліндра, крізь вікна входить свіже повітря (зелені стрілки)."],"Котёл остановлен":["Boiler stopped","Котел зупинено"],"Котёл остановлен оператором":["Boiler stopped by the operator","Котел зупинено оператором"],"Кулачковый вал: на малых оборотах топливо сгорает плохо — дым, неровная работа.":["Camshaft: at low speed the fuel burns poorly — smoke, uneven running.","Розподільний вал: на малих обертах паливо згоряє погано — дим, нерівна робота."],"Кулачок «заточен» под один режим — полный ход. На малой нагрузке давление в цилиндре низкое, топливо сгорает хуже, двигатель дымит и дёргается на малых оборотах. Электроника подбирает момент впрыска и закрытия выпускного клапана под каждую нагрузку — отсюда экономия топлива на частичных режимах (порядка нескольких процентов, типично), меньше дыма и устойчивая работа на самых малых оборотах. Переключите «Привод клапанов» и сравните цифры на схеме.":["A cam is \"ground\" for one mode — full speed. At low load the cylinder pressure is low, the fuel burns worse, and the engine smokes and jerks at low speed. Electronics selects the injection timing and exhaust valve closing for each load — hence the fuel saving at part loads (of the order of a few percent, typical), less smoke and stable running at the very lowest speeds. Switch the \"Valve drive\" and compare the numbers on the diagram.","Кулачок «заточений» під один режим — повний хід. На малому навантаженні тиск у циліндрі низький, паливо згоряє гірше, двигун димить і сіпається на малих обертах. Електроніка підбирає момент упорскування і закриття випускного клапана під кожне навантаження — звідси економія палива на часткових режимах (близько кількох відсотків, типово), менше диму і стійка робота на найменших обертах. Перемкніть «Привід клапанів» і порівняйте цифри на схемі."],"Магнитный компас":["Magnetic compass","Магнітний компас"],"Магнитный компас работает всегда — в нём нет электроники. Последний друг штурмана при блэкауте.":["The magnetic compass works always — it has no electronics. The navigator's last friend in a blackout.","Магнітний компас працює завжди — у ньому немає електроніки. Останній друг штурмана при блекауті."],"Масляный насос создаёт давление и по команде автоматики поворачивает лопасти винта. Это как руль для воды: ноль — лопасти плоские, тяги нет; больше шаг — больше тяга. Пропало давление — шаг «замораживается» и тягой управлять нельзя; судоводителя об этом предупреждают.":["An oil pump creates pressure and, on a command from the automation, turns the propeller blades. It is like a rudder for water: zero — the blades are flat, no thrust; more pitch — more thrust. If the pressure is lost, the pitch \"freezes\" and the thrust cannot be controlled; the navigating officer is warned about it.","Масляний насос створює тиск і за командою автоматики повертає лопаті гвинта. Це як кермо для води: нуль — лопаті плоскі, тяги немає; більший крок — більша тяга. Зник тиск — крок «завмирає» і тягою керувати не можна; судноводія про це попереджають."],"Мозг двигателя: компьютер (ECU, Engine Control Unit). 1000 раз в секунду он решает, когда открыть клапан впрыска и выпускной клапан в каждом цилиндре. Блоков обычно два-три с дублированием. Если откажет один — работает второй; если оба — двигатель останавливается.":["The brain of the engine: a computer (ECU, Engine Control Unit). 1000 times a second it decides when to open the injection valve and the exhaust valve in each cylinder. There are usually two or three units, duplicated. If one fails, the other works; if both fail, the engine stops.","Мозок двигуна: комп’ютер (ECU, Engine Control Unit). 1000 разів на секунду він вирішує, коли відкрити клапан упорскування і випускний клапан у кожному циліндрі. Блоків зазвичай два-три з дублюванням. Відмовить один — працює другий; обидва — двигун зупиняється."],"Мощность горелки:":["Burner output:","Потужність пальника:"],"Мощность двигателя:":["Motor power:","Потужність двигуна:"],"НЕ ЗАПУСТИЛСЯ":["FAILED TO START","НЕ ЗАПУСТИВСЯ"],"НЕТ (АКБ)":["NONE (battery)","НЕМАЄ (АКБ)"],"Нагрузка на ИБП:":["UPS load:","Навантаження на ДБЖ:"],"Нагрузка судна без подруливающего":["Ship load without the thruster","Навантаження судна без підрулювального"],"Нажмите «Пуск котла», затем включайте аварии.":["Press \"Start boiler\", then switch on the faults.","Натисніть «Пуск котла», потім вмикайте аварії."],"Нажмите «Пуск котла».":["Press \"Start boiler\".","Натисніть «Пуск котла»."],"Нажмите «Пуск подруливающего».":["Press \"Start thruster\".","Натисніть «Пуск підрулювального»."],"Нажмите на любой блок схемы":["Click any block of the diagram","Натисніть на будь-який блок схеми"],"Насос берёт топливо из расходной цистерны и гонит его к горелке под давлением. Тяжёлое топливо холодным густое, как мёд, поэтому электрический или паровой подогреватель греет его (порядка 90–130 °C, зависит от сорта топлива). Если насос встал или топливо холодное — форсунка не сможет распылить его в туман, факел будет плохим или не загорится вовсе.":["The pump takes fuel from the service tank and drives it to the burner under pressure. Heavy fuel is as thick as honey when cold, so an electric or steam heater warms it (about 90–130 °C, depending on the fuel grade). If the pump stops or the fuel is cold, the nozzle cannot atomise it into a mist and the flame will be poor or will not light at all.","Насос бере паливо з витратної цистерни й жене його до пальника під тиском. Важке паливо холодним густе, як мед, тому електричний або паровий підігрівач гріє його (приблизно 90–130 °C, залежить від сорту палива). Якщо насос став або паливо холодне, форсунка не зможе розпилити його в туман, факел буде поганий або взагалі не загориться."],"Насосы высокого давления (гидравлическая силовая установка, HPS): часть качает масло от самого двигателя, часть — от электромоторов (резерв и пуск). Создают около 300 бар (типично, задаёт проект). Это «мускулы» электроники: сигнал ECU слабый, а клапан открыть надо с силой. Откажет один насос — включится резервный; откажут все — давление упадёт и двигатель остановится.":["High-pressure pumps (hydraulic power supply, HPS): some are driven by the engine itself, some by electric motors (backup and starting). They create about 300 bar (typical, set by the design). These are the \"muscles\" of the electronics: the ECU signal is weak, but the valve has to be opened with force. If one pump fails, the standby starts; if all fail, the pressure will fall and the engine will stop.","Насоси високого тиску (гідравлічна силова установка, HPS): частина качає мастило від самого двигуна, частина — від електромоторів (резерв і пуск). Створюють близько 300 бар (типово, задає проєкт). Це «м’язи» електроніки: сигнал ECU слабкий, а клапан відкрити треба із зусиллям. Відмовить один насос — увімкнеться резервний; відмовлять усі — тиск упаде і двигун зупиниться."],"Насосы создают масло под давлением ~300 бар (красные потоки). Оно — мускулы электроники. Попробуйте «Отказ насоса масла».":["The pumps create oil under a pressure of ~300 bar (red flows). It is the muscle of the electronics. Try \"Oil pump failure\".","Насоси створюють мастило під тиском ~300 бар (червоні потоки). Воно — м’язи електроніки. Спробуйте «Відмова масляного насоса»."],"Независимая от ECU цепочка датчиков и реле. SLOWDOWN — «сбросить нагрузку»: двигатель сам снижает обороты, пока не исчезнет опасность. SHUTDOWN — аварийная остановка: топливо отсекается сразу. Это как предохранитель: должна работать, даже когда «мозг» завис.":["A chain of sensors and relays independent of the ECU. SLOWDOWN is \"shed the load\": the engine reduces its own speed until the danger is gone. SHUTDOWN is an emergency stop: the fuel is cut off at once. It is like a fuse: it must work even when the \"brain\" has hung.","Незалежний від ECU ланцюжок датчиків і реле. SLOWDOWN — «скинути навантаження»: двигун сам знижує оберти, поки не зникне небезпека. SHUTDOWN — аварійна зупинка: паливо відсікається одразу. Це як запобіжник: має працювати, навіть коли «мозок» завис."],"Неисправность: залип прессостат (ограничитель 8,5 бар работает)":["Fault: pressure switch stuck (the 8.5 bar limiter is working)","Несправність: залип пресостат (обмежувач 8,5 бар працює)"],"Неисправность: отказ питательного насоса":["Fault: feed pump failure","Несправність: відмова живильного насоса"],"Неисправность: отказали прессостат И ограничитель — остаётся предохранительный клапан (9,0 бар)":["Fault: pressure switch AND limiter failed — only the safety valve (9.0 bar) remains","Несправність: відмовили пресостат І обмежувач — лишається запобіжний клапан (9,0 бар)"],"Неисправность: пропал факел (форсунка/подача)":["Fault: flame lost (nozzle/supply)","Несправність: зник факел (форсунка/подача)"],"Неисправность: пропало давление гидравлики шага (для ВРШ — шаг замёрз).":["Fault: pitch hydraulic pressure lost (for a CPP the pitch is frozen).","Несправність: зник тиск гідравліки кроку (для ГРК крок замерз)."],"Неисправность: пропало охлаждение двигателя.":["Fault: motor cooling lost.","Несправність: зникло охолодження двигуна."],"Нет напряжения на шинах — сначала восстановите станцию.":["There is no voltage on the buses — restore the plant first.","На шинах немає напруги — спочатку відновіть станцію."],"Нет факела":["No flame","Немає факела"],"Низкий уровень":["Low level","Низький рівень"],"Норма: все системы в порядке.":["Normal: all systems are in order.","Норма: усі системи в порядку."],"Нормальное питание.":["Normal supply.","Нормальне живлення."],"Нос до причала:":["Bow to the quay:","Ніс до причалу:"],"Нос коснулся кранцев причала — тягу надо снимать заранее!":["The bow touched the quay fenders — take off the thrust in advance!","Ніс торкнувся кранців причалу — тягу треба знімати заздалегідь!"],"ОТКЛЮЧЁН":["OFF","ВІДКЛЮЧЕНО"],"Обойти PMS (опасно!)":["Bypass PMS (dangerous!)","Обійти PMS (небезпечно!)"],"Обороты:":["Speed:","Оберти:"],"Общие «электрические трубы», на которые работают все генераторы и от которых питаются потребители. Любой удар по току (мощный пуск) сразу виден на шинах как проседание напряжения и частоты — и его «чувствуют» все: освещение, насосы, рулевая машина.":["The common \"electric pipes\" that all generators feed and from which the consumers are supplied. Any current shock (a powerful start) shows at once on the buses as a sag in voltage and frequency — and everyone \"feels\" it: lighting, pumps, the steering gear.","Спільні «електричні труби», на які працюють усі генератори й від яких живляться споживачі. Будь-який удар за струмом (потужний пуск) одразу видно на шинах як просідання напруги й частоти — і його «відчувають» усі: освітлення, насоси, рульова машина."],"Обычный компас со стрелкой. Электричества не требует вообще — только лампочка подсветки. Это последний резерв направления: если все электрические приборы погасли, курс всё равно виден. Ошибка — девиация (влияние стальных конструкций), её периодически проверяют.":["An ordinary compass with a needle. It needs no electricity at all, only a lighting bulb. It is the last backup for direction: if all electrical instruments go out, the heading is still visible. The error is deviation (the influence of steel structures), which is checked periodically.","Звичайний компас зі стрілкою. Електрики не потребує взагалі — лише лампочку підсвічування. Це останній резерв напрямку: якщо всі електричні прилади погасли, курс усе одно видно. Похибка — девіація (вплив сталевих конструкцій), її періодично перевіряють."],"Огнеупорная камера, где горит факел. Горячие газы омывают трубки с водой и отдают им тепло, затем уходят в дымовую трубу. Перед розжигом топку обязательно продувают воздухом — иначе остатки паров топлива могут вспыхнуть взрывом («хлопок»).":["A refractory chamber where the flame burns. Hot gases wash the water tubes and give them their heat, then leave through the funnel. The furnace must always be purged with air before light-off, otherwise leftover fuel vapour may flash into an explosion (a \"puff-back\").","Вогнетривка камера, де горить факел. Гарячі гази омивають трубки з водою й віддають їм тепло, потім ідуть у димову трубу. Перед розпалом топку обов’язково продувають повітрям, інакше залишки парів палива можуть спалахнути вибухом («хлопок»)."],"Ожидание: давление выше нижней уставки":["Waiting: pressure above the lower setpoint","Очікування: тиск вище нижньої уставки"],"Основное и аварийное питание, ИБП: что остаётся работать при пропадании напряжения.":["Main and emergency power, UPS: what keeps working when the voltage is lost.","Основне й аварійне живлення, ДБЖ: що лишається працювати при зникненні напруги."],"Отказ насоса масла":["Oil pump failure","Відмова масляного насоса"],"Открытие выпускного клапана":["Exhaust valve opening","Відкриття випускного клапана"],"Охлаждение":["Motor","Охолодження"],"Охлаждение восстановлено.":["Cooling restored.","Охолодження відновлено."],"Пар по трубе идёт на подогрев топлива и масла, в камбуз (варка, посудомойка), в прачечную (гладильные катки, сушка), на обогрев помещений. Отдав тепло, пар превращается обратно в воду — конденсат — и по трубе возвращается в питательный бак.":["Steam goes through the pipe to heat fuel and oil, to the galley (cooking, dishwasher), to the laundry (ironing rollers, drying), and to space heating. After giving up its heat, the steam turns back into water, condensate, and returns by pipe to the feed tank.","Пара трубою йде на підігрів палива й мастила, на камбуз (варіння, посудомийка), у пральню (прасувальні катки, сушіння), на обігрів приміщень. Віддавши тепло, пара перетворюється назад на воду — конденсат — і трубою повертається до живильного бака."],"Паровой барабан":["Steam drum","Паровий барабан"],"Питание навигационного оборудования":["Navigation equipment power","Живлення навігаційного обладнання"],"Питательный бак":["Feed tank","Живильний бак"],"Плавное (модуляция)":["Modulating (smooth)","Плавне (модуляція)"],"Подогрев топлива":["Fuel heating","Підігрів палива"],"Подруливающее остановлено":["Thruster stopped","Підрулювальний зупинено"],"Подруливающее остановлено.":["Thruster stopped.","Підрулювальний зупинено."],"Подруливающее устройство":["Bow thruster","Підрулювальний пристрій"],"Пока дизель запускается (до 45 с), все критичные приборы держатся на аккумуляторах, а у радара питание пропадает.":["While the diesel is starting (up to 45 s), all critical instruments are held on the batteries, and the radar loses power.","Поки дизель запускається (до 45 с), усі критичні прилади тримаються на акумуляторах, а в радара живлення зникає."],"Поправка момента впрыска":["Injection timing correction","Поправка моменту упорскування"],"Потеря датчика":["Sensor loss","Втрата датчика"],"Потеряны оба датчика угла: ECU не знает, когда впрыскивать, — остановка.":["Both angle sensors lost: the ECU does not know when to inject — stop.","Втрачено обидва датчики кута: ECU не знає, коли впорскувати, — зупинка."],"Потребители пара":["Steam consumers","Споживачі пари"],"Предохранит.":["Safety","Запобіжний"],"Прессостат исправен":["Pressure switch healthy","Пресостат справний"],"Прессостат — выключатель, который срабатывает от давления. Достигли верхней уставки (в тренажёре 7,5 бар) — горелка выключается; упало до нижней (6,0 бар) — включается. Рядом — второй, независимый ограничитель давления (8,5 бар) на случай, если первый залип.":["A pressure switch is a switch that operates on pressure. When the upper setpoint is reached (7.5 bar in the trainer) the burner is switched off; when it falls to the lower one (6.0 bar) it is switched on. Next to it is a second, independent pressure limiter (8.5 bar) in case the first one sticks.","Пресостат — вимикач, що спрацьовує від тиску. Досягли верхньої уставки (у тренажері 7,5 бар) — пальник вимикається; впало до нижньої (6,0 бар) — вмикається. Поряд — другий, незалежний обмежувач тиску (8,5 бар) на випадок, якщо перший залип."],"Прибор, который сам находит направление на север. Ему нужен стабильный ток: ротор раскручен до десятков тысяч оборотов. Если питание пропало — гироскоп останавливается и после включения идёт на меридиан (на север) несколько часов (типично 3–6 ч). Поэтому его подключают к ИБП.":["An instrument that finds the direction of north by itself. It needs a stable current: the rotor is spun up to tens of thousands of revolutions. If the power is lost, the gyroscope stops and after switching on takes several hours to settle on the meridian (north), typically 3–6 hours. That is why it is connected to the UPS.","Прилад, який сам знаходить напрямок на північ. Йому потрібен стабільний струм: ротор розкручений до десятків тисяч обертів. Якщо живлення зникло — гіроскоп зупиняється і після ввімкнення виходить на меридіан (на північ) кілька годин (типово 3–6 год). Тому його підключають до ДБЖ."],"Привод выпускного":["Exhaust valve","Привод випускного"],"Привод клапанов:":["Valve drive:","Привід клапанів:"],"Принудительно аварийный фидер":["Force emergency feeder","Примусово аварійний фідер"],"Принудительно основной фидер":["Force main feeder","Примусово основний фідер"],"Программа внутри ECU, которая держит обороты: сравнивает заданные обороты с настоящими (по датчику) и прибавляет или убавляет подачу топлива. Как водитель круиз-контроля. Если откажет — обороты начнут «плавать» вверх-вниз, сработает защита от разноса.":["A programme inside the ECU that holds the speed: it compares the set speed with the real one (from the sensor) and adds or reduces the fuel supply. Like a driver's cruise control. If it fails, the speed starts to \"hunt\" up and down and the overspeed protection trips.","Програма всередині ECU, що тримає оберти: порівнює задані оберти зі справжніми (за датчиком) і додає або зменшує подачу палива. Як водій круїз-контролю. Відмовить — оберти почнуть «плавати» вгору-вниз, спрацює захист від розносу."],"Продувка завершена. Искра розжига":["Purge complete. Ignition spark","Продування завершено. Іскра розпалу"],"Продувка топки":["Furnace purge","Продування топки"],"Просадка напряжения:":["Voltage sag:","Просідання напруги:"],"Пружинный клапан — последняя линия обороны от разрыва. Если давление поднялось выше настройки (типично чуть выше рабочего, задаёт проект и правила), пружина поддаётся, клапан приподнимается, и пар со свистом уходит наружу. Давление падает, клапан садится. Он работает без электричества и без автоматики.":["A spring-loaded valve is the last line of defence against rupture. If the pressure rises above the setting (typically just above working pressure, set by the design and rules), the spring yields, the valve lifts and steam escapes outside with a whistle. The pressure falls and the valve seats. It works without electricity and without automation.","Пружинний клапан — остання лінія оборони від розриву. Якщо тиск піднявся вище налаштування (типово трохи вище робочого, задає проєкт і правила), пружина піддається, клапан піднімається і пара зі свистом іде назовні. Тиск падає, клапан сідає. Він працює без електрики і без автоматики."],"Прямой пуск":["Direct start","Прямий пуск"],"Прямой пуск + ВРШ (шаг на нуле)":["Direct start + CPP (pitch at zero)","Прямий пуск + ГРК (крок на нулі)"],"Пульт на мостике":["Bridge console","Пульт на містку"],"Пуск двигателя":["Motor start","Пуск двигуна"],"Пуск котла.":["Boiler start.","Пуск котла."],"Пуск:":["Start:","Пуск:"],"Пусковое устройство":["Starting device","Пусковий пристрій"],"Работа":["Running","Робота"],"Радар":["Radar","Радар"],"Радар гаснет при блэкауте и прогревается после появления аварийного питания. Автопилот на аварийный фидер не переходит.":["The radar goes out in a blackout and warms up after emergency power appears. The autopilot does not transfer to the emergency feeder.","Радар гасне при блекауті й прогрівається після появи аварійного живлення. Автопілот на аварійний фідер не переходить."],"Радиолокатор показывает берег и другие суда, в тумане и ночью. Мощный потребитель, поэтому обычно не стоит на ИБП: при блэкауте гаснет, а когда аварийный фидер появился, прогревается около минуты (типично).":["The radar shows the coast and other ships, in fog and at night. It is a heavy consumer, so it is usually not on the UPS: in a blackout it goes out, and when the emergency feeder appears it warms up for about a minute (typical).","Радіолокатор показує берег і інші судна, у тумані й уночі. Потужний споживач, тому зазвичай не стоїть на ДБЖ: при блекауті гасне, а коли з’явився аварійний фідер, прогрівається близько хвилини (типово)."],"Радиостанции ГМССБ":["GMDSS radios","Радіостанції ГМЗЛБ"],"Распределительный щит":["Navigation","Розподільний щит"],"Распылители топлива в крышке цилиндра (обычно 2–3 на цилиндр). Топливо под давлением открывает их иглу, и оно вылетает мелким туманом. Нагар или износ — плохое распыление, дым, перерасход топлива.":["Fuel atomisers in the cylinder cover (usually 2–3 per cylinder). Fuel under pressure opens their needle and it flies out as a fine mist. Carbon deposits or wear mean poor atomisation, smoke, and excess fuel consumption.","Розпилювачі палива в кришці циліндра (зазвичай 2–3 на циліндр). Паливо під тиском відкриває їхню голку, і воно вилітає дрібним туманом. Нагар чи знос — погане розпилення, дим, перевитрата палива."],"Расход пара потребителями":["Steam consumption by consumers","Витрата пари споживачами"],"Расход топлива ≈":["Fuel consumption ≈","Витрата палива ≈"],"Регулирование:":["Control:","Регулювання:"],"Регулятор":["Speed","Регулятор"],"Регулятор сравнивает заданные и фактические обороты и корректирует топливо — например, при встречной волне, когда винт тормозит.":["The governor compares the set and actual speed and corrects the fuel — for example in a head sea, when the propeller is held back.","Регулятор порівнює задані й фактичні оберти та коригує паливо — наприклад, при зустрічній хвилі, коли гвинт гальмує."],"Режим питания:":["Supply mode:","Режим живлення:"],"Режим:":["Mode:","Режим:"],"Резерв ГМССБ:":["GMDSS reserve:","Резерв ГМЗЛБ:"],"Розжиг":["Light-off","Розпал"],"Рычаг на мостике: вахтенный штурман ставит «Малый, Средний, Полный вперёд». Это просьба, а не прямое управление двигателем. Если сломается — команды на машину передают по резервному каналу или голосом, двигатель при этом продолжает работать на последнем режиме.":["The lever on the bridge: the officer of the watch sets \"Slow, Half, Full ahead\". This is a request, not direct control of the engine. If it breaks, commands to the engine room are passed by a backup channel or by voice, and the engine keeps running on the last setting.","Важіль на містку: вахтовий помічник ставить «Малий, Середній, Повний уперед». Це прохання, а не пряме керування двигуном. Якщо зламається — команди в машину передають по резервному каналу або голосом, двигун при цьому продовжує працювати на останньому режимі."],"СБРОС НАГРУЗКИ (SLOWDOWN): обороты ограничены 60 %.":["LOAD SHED (SLOWDOWN): speed limited to 60%.","СКИДАННЯ НАВАНТАЖЕННЯ (SLOWDOWN): оберти обмежено 60 %."],"Сброс аварии / восстановить станцию":["Reset fault / restore the plant","Скидання аварії / відновити станцію"],"Сброс блокировки":["Reset lockout","Скидання блокування"],"Сброс нагрузки (SLOWDOWN)":["Load shed (SLOWDOWN)","Скидання навантаження (SLOWDOWN)"],"Сброс невозможен: давление выше 7 бар — подождите, пока оно упадёт":["Reset impossible: the pressure is above 7 bar — wait for it to fall","Скидання неможливе: тиск вище 7 бар — зачекайте, поки він упаде"],"Сброс невозможен: двигатель ещё горячий (> 100 °C), подождите.":["Reset impossible: the motor is still hot (> 100 °C), wait.","Скидання неможливе: двигун ще гарячий (> 100 °C), зачекайте."],"Сброс невозможен: уровень воды ниже 35 % — сначала восстановите воду (питательный насос)":["Reset impossible: the water level is below 35% — restore the water first (feed pump)","Скидання неможливе: рівень води нижче 35 % — спочатку відновіть воду (живильний насос)"],"Сбросить аварии":["Reset faults","Скинути аварії"],"Сердце подруливающего: на круизных судах типично 1–3 МВт (задаёт проект). Асинхронный двигатель на 440 В или 690 В, а на мощных — на 6,6 кВ. Нагревается при работе и особенно при пусках — поэтому нужно охлаждение и ограничение числа пусков в час.":["The heart of the thruster: on cruise ships typically 1–3 MW (set by the design). An induction motor at 440 V or 690 V, and on powerful ones at 6.6 kV. It heats up in operation and especially at starts — so cooling and a limit on the number of starts per hour are needed.","Серце підрулювального: на круїзних суднах типово 1–3 МВт (задає проєкт). Асинхронний двигун на 440 В або 690 В, а на потужних — на 6,6 кВ. Нагрівається під час роботи і особливо при пусках — тому потрібні охолодження й обмеження кількості пусків на годину."],"Система дистанционного автоматического управления: переводит просьбу телеграфа в заданные обороты и следит, чтобы двигатель не разгоняли слишком резко (есть программа разгона). Если откажет — управление переходит на пульт в ЦПУ (центральный пост управления) или прямо у двигателя.":["The remote automatic control system: converts the telegraph request into a set speed and makes sure the engine is not accelerated too sharply (there is an acceleration programme). If it fails, control passes to the console in the ECR (engine control room) or directly at the engine.","Система дистанційного автоматичного керування: перетворює прохання телеграфа на задані оберти і стежить, щоб двигун не розганяли надто різко (є програма розгону). Якщо відмовить — керування переходить на пульт у ЦПК (центральний пост керування) або прямо біля двигуна."],"Система дистанционного управления переводит «Средний ход» в заданные обороты (по ползунку «Заданные обороты») и плавно их наращивает.":["The remote control system converts \"Half ahead\" into a set speed (by the \"Set speed\" slider) and raises it smoothly.","Система дистанційного керування перетворює «Середній хід» на задані оберти (за повзунком «Задані оберти») і плавно їх нарощує."],"Система защиты":["Protection system","Система захисту"],"Скорость времени:":["Time speed:","Швидкість часу:"],"Скорость показа:":["Display speed:","Швидкість показу:"],"Смягчает удар при пуске. «Звезда-треугольник» сначала включает обмотки так, что ток втрое меньше, потом переключает. Частотный преобразователь плавно поднимает частоту от нуля, и двигатель разгоняется без рывка. Прямой пуск (просто включить в сеть) даёт ток в 5–7 раз больше номинального.":["Softens the shock at start. Star-delta first connects the windings so that the current is three times lower, then switches over. A frequency converter raises the frequency smoothly from zero and the motor accelerates without a jerk. A direct start (simply connecting to the mains) gives a current 5–7 times the rated one.","Пом’якшує удар при пуску. «Зірка-трикутник» спочатку вмикає обмотки так, що струм утричі менший, потім перемикає. Частотний перетворювач плавно піднімає частоту від нуля, і двигун розганяється без ривка. Прямий пуск (просто ввімкнути в мережу) дає струм у 5–7 разів більший за номінальний."],"Состав станции (2000 кВт каждый)":["Plant composition (2000 kW each)","Склад станції (по 2000 кВт)"],"Состояние:":["State:","Стан:"],"Способ пуска:":["Starting method:","Спосіб пуску:"],"Сравнение при текущей нагрузке (":["Comparison at the current load (","Порівняння при поточному навантаженні ("],"Станция восстановлена: ДГ1 и ДГ2 на шинах.":["Plant restored: DG1 and DG2 on the buses.","Станцію відновлено: ДГ1 і ДГ2 на шинах."],"Станция:":["Plant:","Станція:"],"Стеклянная трубка показывает уровень воды глазами (как в чайнике с прозрачной стенкой), а электрические датчики дают сигналы автоматике: «мало — включи питательный насос», «низко — тревога», «аварийно низко — погаси горелку». Это самая важная защита котла; уровень проверяют вахтенные.":["A glass tube shows the water level to the eye (like a kettle with a transparent wall), and electric sensors give signals to the automation: \"low — start the feed pump\", \"very low — alarm\", \"extremely low — shut off the burner\". This is the most important protection of the boiler; the level is checked by the watchkeepers.","Скляна трубка показує рівень води очима (як у чайнику з прозорою стінкою), а електричні датчики дають сигнали автоматиці: «мало — увімкни живильний насос», «низько — тривога», «аварійно низько — погаси пальник». Це найважливіший захист котла; рівень перевіряють вахтові."],"Судовой котёл":["Ship boiler","Судновий котел"],"Судовые системы":["Ship systems","Суднові системи"],"Схема системы: блоки, экскурсия по шагам, что происходит при пуске и нагрузке.":["System diagram: blocks, a step-by-step tour, what happens at start and under load.","Схема системи: блоки, екскурсія за кроками, що відбувається при пуску й навантаженні."],"ТР":["PS","ПС"],"Телеграф":["Telegraph","Телеграф"],"Темп. обмотки:":["Winding temp.:","Темп. обмотки:"],"Ток двигателя после нажатия «Пуск» (кратность к номинальному; 1 — номинальный ток)":["Motor current after pressing \"Start\" (multiple of rated; 1 is the rated current)","Струм двигуна після натискання «Пуск» (кратність до номінального; 1 — номінальний струм)"],"Ток:":["Current:","Струм:"],"Только АКБ (оба фидера отключены)":["Batteries only (both feeders off)","Лише АКБ (обидва фідери вимкнено)"],"Тоннель — это сквозная труба поперёк корпуса у носа под водой. Винт внутри гонит воду из одного борта в другой, и по закону действия-противодействия нос толкает в обратную сторону. Лопасти поворотные: меняя их шаг, меняют направление и силу тяги без остановки двигателя.":["The tunnel is a through pipe across the hull at the bow, under water. The propeller inside drives water from one side to the other, and by the law of action and reaction the bow is pushed the opposite way. The blades are pivoting: changing their pitch changes the direction and force of thrust without stopping the motor.","Тунель — це наскрізна труба впоперек корпусу біля носа під водою. Гвинт усередині жене воду з одного борту в інший, і за законом дії та протидії ніс штовхає у зворотний бік. Лопаті поворотні: змінюючи їхній крок, змінюють напрямок і силу тяги без зупинки двигуна."],"Топка":["Furnace","Топка"],"Топливный насос":["Fuel pump","Паливний насос"],"Топливо готово (90 °C). Продувка топки":["Fuel is ready (90 °C). Furnace purge","Паливо готове (90 °C). Продування топки"],"Топливо, воздух, вода и пар: как котёл держит давление и уровень, что делает автоматика.":["Fuel, air, water and steam: how the boiler holds pressure and level, and what the automation does.","Паливо, повітря, вода і пара: як котел тримає тиск і рівень, що робить автоматика."],"Топливо:":["Fuel:","Паливо:"],"Тревога: датчик №1 потерян, ECU работает по резервному датчику №2.":["Alarm: sensor No. 1 lost, the ECU works from backup sensor No. 2.","Тривога: датчик №1 втрачено, ECU працює за резервним датчиком №2."],"Тревога: насос масла отказал, включился резервный электронасос (давление ниже нормы).":["Alarm: the oil pump failed, the standby electric pump started (pressure below normal).","Тривога: масляний насос відмовив, увімкнувся резервний електронасос (тиск нижче норми)."],"Тренажёр не запустился.":["The trainer failed to start.","Тренажер не запустився."],"Тяга:":["Thrust:","Тяга:"],"У каждого цилиндра свой гидроблок. Внутри — быстрый электромагнитный клапан (FIVA, Fuel Injection Valve Actuator). По сигналу ECU он впускает масло под высоким давлением, оно давит на плунжер-усилитель, а тот выдавливает топливо к форсункам под давлением около 1000 бар. Заклинит — цилиндр перестанет получать топливо или будет «лить» непрерывно (поэтому есть аварийная защита).":["Each cylinder has its own hydraulic unit. Inside is a fast solenoid valve (FIVA, Fuel Injection Valve Actuator). On a signal from the ECU it admits high-pressure oil, which presses on the booster plunger, and that forces fuel to the nozzles at a pressure of about 1000 bar. If it jams, the cylinder stops receiving fuel or \"pours\" continuously (which is why there is emergency protection).","У кожного циліндра свій гідроблок. Усередині — швидкий електромагнітний клапан (FIVA, Fuel Injection Valve Actuator). За сигналом ECU він впускає мастило під високим тиском, воно тисне на плунжер-підсилювач, а той видавлює паливо до форсунок під тиском близько 1000 бар. Заклинить — циліндр перестане отримувати паливо або буде «лити» безперервно (тому є аварійний захист)."],"Угловой":["Angle","Кутовий"],"Уровень воды:":["Water level:","Рівень води:"],"Учебная модель: ДГ по 2000 кВт, двигатель 1500 кВт (≈1750 кВА), просадка напряжения оценивается упрощённо. Кратность пускового тока: прямой 6, Y-Δ 2 (+всплеск при переключении), ЧР не более ~1. Реальные значения берите из паспорта двигателя и расчёта электростанции (типично, задаёт проект; нормы — по требованиям классификационного общества и флага).":["Learning model: DGs of 2000 kW each, motor 1500 kW (≈1750 kVA), the voltage sag is estimated in a simplified way. Starting current multiples: direct 6, Y-Δ 2 (+ a surge at changeover), VFD no more than ~1. Take real values from the motor data sheet and the power plant calculation (typical, set by the design; the standards — per the requirements of the classification society and the flag).","Навчальна модель: ДГ по 2000 кВт, двигун 1500 кВт (≈1750 кВА), просідання напруги оцінюється спрощено. Кратність пускового струму: прямий 6, Y-Δ 2 (+сплеск при перемиканні), ЧП не більше ~1. Реальні значення беріть із паспорта двигуна та розрахунку електростанції (типово, задає проєкт; норми — за вимогами класифікаційного товариства й прапора)."],"Учебные модели: числа условные и типичные. На судне всегда действуй по инструкции изготовителя и проекту судна.":["Learning models: the numbers are typical and conditional. On board always follow the manufacturer's instructions and the ship's design.","Навчальні моделі: числа умовні й типові. На судні завжди дійте за інструкцією виробника та проєктом судна."],"Фидеры: основной и аварийный":["Feeders: main and emergency","Фідери: основний і аварійний"],"Форсунка превращает струйку топлива в мелкий туман (как пульверизатор), горелка смешивает его с воздухом и направляет в топку. Рядом стоят два электрода: между ними проскакивает искра от трансформатора розжига. Забилась форсунка — факел рваный, дымит, может погаснуть.":["The nozzle turns a thin stream of fuel into a fine mist (like a spray bottle), and the burner mixes it with air and directs it into the furnace. Two electrodes stand nearby: a spark from the ignition transformer jumps between them. If the nozzle is clogged, the flame is ragged, smoky and may go out.","Форсунка перетворює цівку палива на дрібний туман (як пульверизатор), пальник змішує його з повітрям і спрямовує в топку. Поряд стоять два електроди: між ними проскакує іскра від трансформатора розпалу. Забилася форсунка — факел рваний, димить, може згаснути."],"Форсунки":["Injectors","Форсунки"],"Форсунки впрыскивают топливо в горячий сжатый воздух — на схеме видно облако распыла в момент впрыска. Сдвигайте «Момент впрыска».":["The nozzles inject fuel into the hot compressed air — in the diagram you can see the spray cloud at the moment of injection. Move the \"Injection timing\".","Форсунки впорскують паливо в гаряче стиснене повітря — на схемі видно хмару розпилу в момент упорскування. Пересувайте «Момент упорскування»."],"Фотоэлемент":["Flame","Фотоелемент"],"Фотоэлемент видит факел — работа":["The photocell sees the flame — running","Фотоелемент бачить факел — робота"],"Цилиндр и поршень":["Cylinder and piston","Циліндр і поршень"],"Цифры учебные: типично, задаёт проект. Нормы SOLAS (глава V — навигационное оборудование; глава IV — ГМССБ: резерв 1 час при соответствующем аварийном источнике, 6 часов при его отсутствии; аварийный ДГ принимает нагрузку не позднее 45 с; переходный источник на пассажирских судах — 30 мин; аварийный источник — до 36 ч) изложены кратко и неполно —":["The numbers are for learning: typical, set by the design. The SOLAS standards (chapter V — navigation equipment; chapter IV — GMDSS: 1 hour reserve with a suitable emergency source, 6 hours without one; the emergency DG takes the load within 45 s; the transitional source on passenger ships — 30 min; the emergency source — up to 36 h) are summarised briefly and incompletely —","Цифри навчальні: типово, задає проєкт. Норми SOLAS (глава V — навігаційне обладнання; глава IV — ГМЗЛБ: резерв 1 година при відповідному аварійному джерелі, 6 годин за його відсутності; аварійний ДГ приймає навантаження не пізніше 45 с; перехідне джерело на пасажирських суднах — 30 хв; аварійне джерело — до 36 год) викладено коротко й неповно —"],"Частотный преобразователь":["Frequency converter","Частотний перетворювач"],"Частотный преобразователь, винт фикс. шага":["Frequency converter, fixed-pitch propeller","Частотний перетворювач, гвинт фікс. кроку"],"Шаг":["Step","Крок"],"Шаг 1. Перед любым пуском автоматика проверяет воду. Датчики видят норму (около 50 %), и сигнал «вода есть» разрешает розжиг. Без воды горелка не запустится вообще.":["Step 1. Before any start the automation checks the water. The sensors see normal (about 50%), and the \"water present\" signal permits light-off. Without water the burner will not start at all.","Крок 1. Перед будь-яким пуском автоматика перевіряє воду. Датчики бачать норму (близько 50 %), і сигнал «вода є» дозволяє розпал. Без води пальник не запуститься взагалі."],"Шаг 1. Штурман готовится прижать нос к причалу. Рукоятка стоит в нуле, он нажимает «Пуск подруливающего» на пульте. Команда уходит в шкаф управления.":["Step 1. The navigator is getting ready to press the bow against the quay. The lever stands at zero, and he presses \"Start thruster\" on the console. The command goes to the control cabinet.","Крок 1. Штурман готується притиснути ніс до причалу. Рукоятка стоїть на нулі, він натискає «Пуск підрулювального» на пульті. Команда йде в шафу керування."],"Шаг 10. Всё это время на шинах следят за напряжением, частотой и нагрузкой ДГ. Если запаса не хватило, нагрузка >100 % держится дольше 10 с — и ДГ отключаются. Так подруливающее может вызвать блэкаут (см. урок про электростанцию).":["Step 10. All this time the buses are monitored for voltage, frequency and DG load. If the margin was not enough and the load stays above 100% for longer than 10 s, the DGs trip. This is how a thruster can cause a blackout (see the lesson on the power plant).","Крок 10. Увесь цей час на шинах стежать за напругою, частотою і навантаженням ДГ. Якщо запасу не вистачило, навантаження >100 % тримається довше 10 с — і ДГ відключаються. Так підрулювальний може викликати блекаут (див. урок про електростанцію)."],"Шаг 10. Пар идёт к потребителям (подогрев топлива, камбуз, прачечная), отдаёт тепло и конденсируется. Конденсат возвращается в питательный бак — круг замкнулся.":["Step 10. Steam goes to the consumers (fuel heating, galley, laundry), gives up heat and condenses. The condensate returns to the feed tank — the circle is closed.","Крок 10. Пара йде до споживачів (підігрів палива, камбуз, пральня), віддає тепло й конденсується. Конденсат повертається до живильного бака — коло замкнулося."],"Шаг 2. PMS считает: свободная мощность = то, что могут дать работающие ДГ, минус текущая нагрузка судна. Нужно запас под 1,5 МВт плюс небольшой резерв. Хватает — пуск разрешён. Не хватает — следующий шаг.":["Step 2. The PMS calculates: free power = what the running DGs can give, minus the ship's current load. A margin for 1.5 MW plus a small reserve is needed. If it is enough — the start is permitted. If not — the next step.","Крок 2. PMS рахує: вільна потужність = те, що можуть дати працюючі ДГ, мінус поточне навантаження судна. Потрібен запас під 1,5 МВт плюс невеликий резерв. Вистачає — пуск дозволено. Не вистачає — наступний крок."],"Шаг 2. Включается топливный насос и подогрев. Топливо циркулирует и греется до рабочей температуры. Пока оно холодное, розжиг не разрешён.":["Step 2. The fuel pump and heater switch on. The fuel circulates and heats to working temperature. While it is cold, light-off is not permitted.","Крок 2. Вмикаються паливний насос і підігрів. Паливо циркулює й гріється до робочої температури. Поки воно холодне, розпал не дозволений."],"Шаг 3. Если мощности мало, PMS запускает резервный ДГ (десятки секунд в жизни), синхронизирует его с шинами и принимает нагрузку. Только ПОСЛЕ этого пуск подруливающего разрешается. Это и есть защита от блэкаута.":["Step 3. If power is short, the PMS starts a standby DG (tens of seconds in real life), synchronises it with the buses and takes the load. Only AFTER that is the thruster start permitted. This is the protection against blackout.","Крок 3. Якщо потужності мало, PMS запускає резервний ДГ (десятки секунд у житті), синхронізує його з шинами й приймає навантаження. Лише ПІСЛЯ цього пуск підрулювального дозволяється. Це і є захист від блекауту."],"Шаг 3. Запускается вентилятор — начинается ПРОДУВКА топки. Несколько объёмов воздуха вытесняют остатки паров топлива в дымовую трубу. Топливо ещё закрыто.":["Step 3. The fan starts and the PURGE of the furnace begins. Several volumes of air push the leftover fuel vapour out to the funnel. The fuel is still shut.","Крок 3. Запускається вентилятор — починається ПРОДУВАННЯ топки. Кілька об’ємів повітря витісняють залишки парів палива в димову трубу. Паливо ще закрите."],"Шаг 4. Блокировки: рукоятка в нуле, давление масла гидравлики есть, охлаждение работает, нет аварийных сигналов. Любое условие не выполнено — пуск запрещён, на пульте горит причина.":["Step 4. Interlocks: lever at zero, hydraulic oil pressure present, cooling running, no alarm signals. If any condition is not met, the start is prohibited and the reason lights up on the console.","Крок 4. Блокування: рукоятка на нулі, тиск мастила гідравліки є, охолодження працює, немає аварійних сигналів. Будь-яка умова не виконана — пуск заборонено, на пульті горить причина."],"Шаг 4. Продувка закончена. Реле времени в щите включает трансформатор розжига: между электродами горелки пошла искра. Топлива ещё нет — сначала нужна искра.":["Step 4. Purge complete. A timer in the panel switches on the ignition transformer: a spark appears between the burner electrodes. There is still no fuel — the spark must come first.","Крок 4. Продування закінчено. Реле часу в щиті вмикає трансформатор розпалу: між електродами пальника пішла іскра. Палива ще немає — спочатку потрібна іскра."],"Шаг 5. Включается пусковое устройство. Y-Δ: сначала ток ~в 2 раза выше номинального, потом переключение со всплеском. ЧР (частотный преобразователь): плавный разгон. Прямой пуск — удар в 5–7 раз.":["Step 5. The starting device switches on. Y-Δ: first the current is about 2 times the rated, then a changeover with a surge. VFD (frequency converter): smooth acceleration. A direct start is a shock of 5–7 times.","Крок 5. Вмикається пусковий пристрій. Y-Δ: спочатку струм ~у 2 рази вищий за номінальний, потім перемикання зі сплеском. ЧП (частотний перетворювач): плавний розгін. Прямий пуск — удар у 5–7 разів."],"Шаг 5. Открывается топливный клапан: форсунка распыляет топливо, оно смешивается с воздухом и вспыхивает от искры. Это самый ответственный момент — «время безопасности» (несколько секунд).":["Step 5. The fuel valve opens: the nozzle atomises the fuel, it mixes with air and ignites from the spark. This is the most critical moment — the \"safety time\" (a few seconds).","Крок 5. Відкривається паливний клапан: форсунка розпилює паливо, воно змішується з повітрям і спалахує від іскри. Це найвідповідальніший момент — «час безпеки» (кілька секунд)."],"Шаг 6. Двигатель разгоняется до рабочих оборотов. Пока винт на нулевом шаге, нагрузка на валу мала, и потребляется немного. Разгон тяжёлых вращающихся масс — самый нагруженный по току момент.":["Step 6. The motor accelerates to working speed. While the propeller is at zero pitch the shaft load is small and little is consumed. Accelerating the heavy rotating masses is the highest-current moment.","Крок 6. Двигун розганяється до робочих обертів. Поки гвинт на нульовому кроці, навантаження на валу мале, і споживається небагато. Розгін важких обертових мас — найбільш навантажений за струмом момент."],"Шаг 6. Фотоэлемент видит факел и «подтверждает» огонь, искра выключается. Если за время безопасности факела нет — топливо отсекается и котёл блокируется (авария «нет факела»).":["Step 6. The photocell sees the flame and \"confirms\" the fire, the spark switches off. If there is no flame within the safety time, the fuel is cut off and the boiler is locked out (a \"no flame\" alarm).","Крок 6. Фотоелемент бачить факел і «підтверджує» вогонь, іскра вимикається. Якщо за час безпеки факела немає — паливо відсікається, і котел блокується (аварія «немає факела»)."],"Шаг 7. Идёт нормальная работа: факел греет топку и трубки. Мощность горелки — полная или плавно меняется по необходимости.":["Step 7. Normal operation: the flame heats the furnace and tubes. The burner output is full or varies smoothly as needed.","Крок 7. Іде нормальна робота: факел гріє топку й трубки. Потужність пальника повна або плавно змінюється за потреби."],"Шаг 7. Пошла охлаждающая вода. Датчики температуры обмоток и подшипников следят за нагревом. Пуски нагревают сильнее работы, поэтому число пусков в час ограничивают.":["Step 7. Cooling water starts to flow. The winding and bearing temperature sensors watch the heating. Starts heat more than running, so the number of starts per hour is limited.","Крок 7. Пішла охолоджувальна вода. Датчики температури обмоток і підшипників стежать за нагріванням. Пуски нагрівають сильніше за роботу, тому кількість пусків на годину обмежують."],"Шаг 8. Вода в трубках закипает, пар собирается в барабане, давление растёт. Уровень воды поддерживает питательный насос.":["Step 8. The water in the tubes boils, the steam collects in the drum and the pressure rises. The feed pump maintains the water level.","Крок 8. Вода в трубках закипає, пара збирається в барабані, тиск росте. Рівень води підтримує живильний насос."],"Шаг 8. Двигатель набрал обороты. Теперь по команде джойстика гидростанция плавно поворачивает лопасти: тяга растёт от нуля до заданной за время порядка десятков секунд. Электрическая мощность растёт вместе с тягой.":["Step 8. The motor has reached speed. Now, on the joystick command, the hydraulic unit smoothly turns the blades: the thrust grows from zero to the set value over tens of seconds. The electric power grows together with the thrust.","Крок 8. Двигун набрав оберти. Тепер за командою джойстика гідростанція плавно повертає лопаті: тяга росте від нуля до заданої за десятки секунд. Електрична потужність росте разом із тягою."],"Шаг 9. Винт гонит воду через тоннель в один борт, нос судна движется в другой. Смотрите на вид сверху: чем больше тяга, тем быстрее нос идёт к причалу. Сняли тягу — движение прекращается.":["Step 9. The propeller drives water through the tunnel to one side, and the ship's bow moves to the other. Look at the top view: the greater the thrust, the faster the bow goes to the quay. Take off the thrust and the movement stops.","Крок 9. Гвинт жене воду крізь тунель в один борт, ніс судна рухається в інший. Дивіться на вигляд зверху: чим більша тяга, тим швидше ніс іде до причалу. Зняли тягу — рух припиняється."],"Шаг 9. Давление достигло верхней уставки — прессостат отключает горелку. Пар расходуется, давление падает до нижней уставки — цикл розжига повторяется. Если прессостат залип — сработает ограничитель, а в крайнем случае предохранительный клапан.":["Step 9. The pressure reaches the upper setpoint and the pressure switch shuts the burner off. Steam is used and the pressure falls to the lower setpoint, and the light-off cycle repeats. If the pressure switch sticks, the limiter will operate, and in the extreme case the safety valve.","Крок 9.
