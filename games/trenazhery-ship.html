 Тиск досяг верхньої уставки — пресостат відключає пальник. Пара витрачається, тиск падає до нижньої уставки — цикл розпалу повторюється. Якщо пресостат залип, спрацює обмежувач, а в крайньому разі запобіжний клапан."],"Шины ГРЩ":["MSB buses","Шини ГРЩ"],"Шкаф управления":["Control cabinet","Шафа керування"],"Штурман отклоняет рукоятку влево или вправо — это команда «хочу тягу такой величины и в такую сторону». Сам пульт ничего не двигает: он отправляет сигнал в шкаф управления. Есть местный пост у двигателя для обслуживания и аварийного управления.":["The navigator moves the lever left or right — this is a command \"I want thrust of this size in this direction\". The console itself moves nothing: it sends a signal to the control cabinet. There is a local station at the motor for maintenance and emergency control.","Штурман відхиляє рукоятку ліворуч або праворуч — це команда «хочу тягу такої величини і в такий бік». Сам пульт нічого не рухає: він надсилає сигнал у шафу керування. Є місцевий пост біля двигуна для обслуговування й аварійного керування."],"Штурман ставит рукоятку телеграфа на «Средний ход». На мостике загорается лампа подтверждения, когда машина ответила.":["The navigator sets the telegraph lever to \"Half ahead\". A confirmation lamp lights on the bridge when the engine room has replied.","Штурман ставить рукоятку телеграфа на «Середній хід». На містку загоряється лампа підтвердження, коли машина відповіла."],"Щит мостика с двумя входами — основным (от ГРЩ) и аварийным (от АРЩ). АВР (автоматический ввод резерва) сам переключается на запасной фидер, когда основной пропал. Если откажет — мостик останется без питания, поэтому приборы дополнительно подстрахованы аккумуляторами.":["The bridge board with two inputs — the main one (from the MSB) and the emergency one (from the ESB). The ATS (automatic transfer switch) switches by itself to the standby feeder when the main one is lost. If it fails, the bridge is left without power, which is why the instruments are additionally backed up by batteries.","Щит містка з двома входами — основним (від ГРЩ) і аварійним (від АРЩ). АВР (автоматичне введення резерву) сам перемикається на запасний фідер, коли основний зник. Якщо відмовить — місток залишиться без живлення, тому прилади додатково підстраховані акумуляторами."],"Щит навигации сам выбирает источник. Нажмите «Блэкаут»: основной фидер погаснет, АВР дождётся аварийного дизеля и переключится.":["The navigation board chooses the source by itself. Press \"Blackout\": the main feeder will go out, the ATS will wait for the emergency diesel and switch over.","Щит навігації сам обирає джерело. Натисніть «Блекаут»: основний фідер погасне, АВР дочекається аварійного дизеля і перемкнеться."],"Щит управления":["Control panel","Щит керування"],"Экскурсия: далее →":["Tour: next →","Екскурсія: далі →"],"Электрический «мозг» котла: пускатели двигателей вентилятора и насосов, реле времени (продувка, время безопасности), защиты. Трансформатор розжига повышает напряжение до нескольких киловольт (порядка 10 кВ) для искры. Вся последовательность розжига выполняется по программе, и любая защита способна остановить её.":["The electrical \"brain\" of the boiler: starters for the fan and pump motors, timers (purge, safety time), protections. The ignition transformer raises the voltage to several kilovolts (about 10 kV) for the spark. The whole light-off sequence runs by a programme, and any protection can stop it.","Електричний «мозок» котла: пускачі двигунів вентилятора й насосів, реле часу (продування, час безпеки), захисти. Трансформатор розпалу підвищує напругу до кількох кіловольт (приблизно 10 кВ) для іскри. Уся послідовність розпалу виконується за програмою, і будь-який захист здатен її зупинити."],"Электродвигатель":["Electric motor","Електродвигун"],"Электродвигатель с крыльчаткой подаёт воздух для горения и перед каждым розжигом продувает топку. Топливо без воздуха не горит, а лишний воздух уносит тепло в трубу. Если вентилятор встал — защита не даёт включить топливо: без воздуха в топке копились бы пары топлива, а потом они могут хлопнуть.":["An electric motor with an impeller supplies combustion air and purges the furnace before every light-off. Fuel does not burn without air, and too much air carries heat up the funnel. If the fan stops, the protection does not let the fuel be switched on: without air, fuel vapour would build up in the furnace and could then explode.","Електродвигун із крильчаткою подає повітря для горіння і перед кожним розпалом продуває топку. Паливо без повітря не горить, а зайве повітря виносить тепло в трубу. Якщо вентилятор став, захист не дає ввімкнути паливо: без повітря в топці накопичувалися б пари палива, а потім вони можуть вибухнути."],"Электродвигатель, шаг винта и тяга носового подруливающего: пуск и управление.":["The electric motor, blade pitch and thrust of the bow thruster: starting and control.","Електродвигун, крок гвинта і тяга носового підрулювального: пуск і керування."],"Электронный блок":["Electronic control","Електронний блок"],"ав. низкий 15 %":["extremely low 15%","ав. низький 15 %"],"аварийно-низкий уровень воды (≤ 15 %) — горелка заблокирована":["extremely low water level (≤ 15%) — burner locked out","аварійно низький рівень води (≤ 15 %) — пальник заблоковано"],"аварийный (АРЩ)":["emergency (ESB)","аварійний (АРЩ)"],"аварийный фидер":["emergency feeder","аварійний фідер"],"бар":["bar","бар"],"бар · Pmax ≈":["bar · Pmax ≈","бар · Pmax ≈"],"бар — запрос на пуск горелки":["bar — burner start request","бар — запит на пуск пальника"],"бар — прессостат отключил горелку":["bar — the pressure switch shut the burner off","бар — пресостат відключив пальник"],"бар, расход ≈":["bar, consumption ≈","бар, витрата ≈"],"в работе":["in service","у роботі"],"вид сверху":["top view","вигляд зверху"],"вкл/выкл":["on/off","вкл/викл"],"включён на шины вручную.":["connected to the buses manually.","увімкнено на шини вручну."],"вода":["water","вода"],"воздух":["air","повітря"],"воздух (продувка)":["air (scavenging)","повітря (продування)"],"воздуха":["fan","повітря"],"впуск воздуха":["air intake","впуск повітря"],"выброс пара!":["steam release!","викид пари!"],"выпускной клапан":["exhaust valve","випускний клапан"],"высокий 80 %":["high 80%","високий 80 %"],"выхлоп":["exhaust","вихлоп"],"выхлопные газы":["exhaust gases","вихлопні гази"],"выход на меридиан":["settling on the meridian","вихід на меридіан"],"г/кВт·ч (учебная модель)":["g/kWh (learning model)","г/кВт·год (навчальна модель)"],"г/кВт·ч. Для справки идеальное Pmax ≈ 150 бар (расход 170 г/кВт·ч).":["g/kWh. For reference, the ideal Pmax ≈ 150 bar (consumption 170 g/kWh).","г/кВт·год. Для довідки ідеальне Pmax ≈ 150 бар (витрата 170 г/кВт·год)."],"газы":["gases","гази"],"генераторы (ДГ)":["generators (DG)","генератори (ДГ)"],"готов":["ready","готово"],"готов (в дежурстве)":["ready (on standby)","готовий (у чергуванні)"],"двигателя":["cooling","двигуна"],"дымовые газы в трубу":["flue gases to the funnel","димові гази в трубу"],"жёлтые пунктиры — электрические цепи":["yellow dashes — electrical circuits","жовті пунктири — електричні кола"],"запуск (до 45 с)…":["starting (up to 45 s)…","запуск (до 45 с)…"],"запускается…":["starting…","запускається…"],"запущен, синхронизирован, принял нагрузку. Теперь пуск подруливающего.":["started, synchronised, took the load. Now the thruster start.","запущено, синхронізовано, прийняв навантаження. Тепер пуск підрулювального."],"заряд":["charge","заряд"],"и блокировки":["and interlocks","і блокування"],"и датчики уровня":["and level sensors","і датчики рівня"],"и насос (конденсат)":["and pump (condensate)","і насос (конденсат)"],"и подогрев":["and heater","і підігрівач"],"и прессостат":["and pressure switch","і пресостат"],"из":["of","із"],"кВт":["kW","кВт"],"кВт   Частота:":["kW   Frequency:","кВт   Частота:"],"кВт — запрашивает пуск ДГ":["kW free — requests a DG start","кВт — запитує пуск ДГ"],"кВт — пуск разрешён.":["kW — start permitted       g.fillStyle = col; g.font = '600 13px system-ui'; g.fillText(msg.length > 62 ? msg.slice(0, msg.lastIndexOf(' ', 62)) : msg, 20, 418); if (msg.length > 62) g.fillText(msg.slice(msg.lastIndexOf(' ', 62) + 1), 20, 436);
      // легенда
      g.font = '12px system-ui'; [[SIG, 'сигнал (слабый ток, команды ECU)'], [OIL, 'масло под давлением ~300 бар'], [FUEL, 'топливо ~1000 бар при впрыске'], [AIR, 'воздух (продувка)'], [GAS, 'выхлопные газы']].forEach((q, i) => { g.strokeStyle = q[0]; g.lineWidth = 4; g.beginPath(); g.moveTo(20, 462 + i * 15); g.lineTo(50, 462 + i * 15); g.stroke(); g.lineWidth = 1; g.fillStyle = css('--fg'); g.fillText(q[1], 58, 463 + i * 15); });
      // цвета блоков по состоянию
      const pc = id => parts.find(p => p.id === id);
      pc('sen').color = S.sens === 2 ? '#7b241c' : S.sens === 1 ? '#9c640c' : '#6c3483';
      pc('hps').color = S.P < 150 ? '#7b241c' : S.pump === 1 ? '#9c640c' : '#b03a2e';
      pc('saf').color = S.shut || S.slow ? '#e74c3c' : '#a93226';
      pc('ecu').color = S.sens === 2 || S.shut ? '#5d6d7e' : '#1f6fa5';
      $(root, '#cmp').innerHTML = `<b>Сравнение при текущей нагрузке (${(load * 100).toFixed(0)} %):</b> ${elec ? 'электроника' : 'кулачковый вал'} — Pmax ≈ ${pmax.toFixed(0)} бар, расход ≈ ${sfoc.toFixed(0)} г/кВт·ч. Для справки идеальное Pmax ≈ 150 бар (расход 170 г/кВт·ч).`;
    }
  });
  const B = (id, f) => { $(root, '#' + id).onclick = f; };
  B('b1', () => { S.sens = Math.min(2, S.sens + 1); }); B('b2', () => { S.pump = Math.min(2, S.pump + 1); });
  B('b3', () => { S.slow = !S.slow; }); B('b4', () => { S.shut = true; });
  B('b0', () => { S.sens = 0; S.pump = 0; S.slow = false; S.shut = false; S.P = Math.max(S.P, 0); });
  bind(root, ['rpm', 'inj', 'exo'], () => { });
  return kit;
};

        `Гирокомпас: ${upsAlive ? (S.gyro < 1 ? 'выход на меридиан ' + (S.gyro * 100).toFixed(0) + ' %' : 'готов') : 'остановлен'}`

      g.fillText(!live && S.soc <= 0 ? 'АКБ разряжены: мостик без питания!' : S.mainOK ? 'Нормальное питание.' : live ? 'Блэкаут: питание от аварийного источника.' : 'Блэкаут: питание только от АКБ.', 20, 480);
      g.font = '12px system-ui'; [[MAIN, 'сеть 440 В от ГРЩ'], [EM, 'аварийный фидер'], [AC, '230 В на приборы'], [DC, '24 В постоянный ток (АКБ)']].forEach((q, i) => { g.strokeStyle = q[0]; g.lineWidth = 4; g.beginPath(); g.moveTo(275, 410 + i * 17); g.lineTo(305, 410 + i * 17); g.stroke(); g.lineWidth = 1; g.fillStyle = css('--fg'); g.fillText(q[1], 313, 411 + i * 17); });
      g.fillText('серый пунктир — нет тока', 275, 490);
    }
  });
  const B = (id, f) => { $(root, '#' + id).onclick = f; };
  B('n1', () => { S.mainOK = false; S.tb = 0; }); B('n2', () => { S.genFail = !S.genFail; $(root, '#n2').className = 'btn' + (S.genFail ? ' on' : ''); });
