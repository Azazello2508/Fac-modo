on: generators tripped.","Захист від перевантаження: генератори відключено."],"Звезда-треугольник":["Star-delta","Зірка-трикутник"],"КПД = P2/P1 =":["Efficiency = P2/P1 =","ККД = P2/P1 ="],"Как вращение рамки в поле даёт переменное напряжение: частота, амплитуда, период.":["How a loop rotating in a field produces alternating voltage: frequency, amplitude, period.","Як обертання рамки в полі дає змінну напругу: частота, амплітуда, період."],"Кондиционирование":["Air conditioning","Кондиціонування"],"Коэффициент трансформации k = N1/N2 =":["Transformation ratio k = N1/N2 =","Коефіцієнт трансформації k = N1/N2 ="],"Коэффициент трансформации, напряжения и токи при нагрузке.":["Transformation ratio, voltages and currents under load.","Коефіцієнт трансформації, напруги і струми під навантаженням."],"Критическое скольжение sк":["Critical slip sk","Критичне ковзання sк"],"Магнитное поле B":["Magnetic field B","Магнітне поле B"],"Масло ДГ2":["DG2 oil","Мастило ДГ2"],"Момент нагрузки":["Load torque","Момент навантаження"],"Нагрузка":["Load","Навантаження"],"Нагрузка R":["Load R","Навантаження R"],"Нагрузка поровну":["Load shared equally","Навантаження порівну"],"Нагрузка судна":["Ship load","Навантаження судна"],"Нагрузка судна:":["Ship load:","Навантаження судна:"],"Напряжение +":["Voltage +","Напруга +"],"Напряжение −":["Voltage −","Напруга −"],"Напряжения различаются на":["The voltages differ by","Напруги різняться на"],"Не стартует: пусковой момент":["Will not start: starting torque","Не стартує: пусковий момент"],"ОБЕСТОЧЕНЫ":["DEAD","ЗНЕСТРУМЛЕНІ"],"ОТКАЗ":["FAIL","ВІДМОВА"],"Ом":["Ω","Ом"],"ПУСК":["START","ПУСК"],"Пар полюсов p":["Pole pairs p","Пар полюсів p"],"Пекарня и камбуз":["Bakery and galley","Пекарня й камбуз"],"Плавный пуск (U = 60%)":["Soft start (U = 60%)","Плавний пуск (U = 60%)"],"Подруливающее":["Bow thruster","Підрулювальний"],"Полезная мощность P2 =":["Useful power P2 =","Корисна потужність P2 ="],"Потери в стали (холостой ход)":["Iron losses (no load)         if (b.p1 > 150) { s.mist++; log('✗ ДГ1 ещё несёт ' + Math.round(b.p1) + ' кВт: при размыкании вся нагрузка скачком ляжет на ДГ2. Сначала снизьте скорость ДГ1 (разгрузите), пока он не будет нести меньше 150 кВт.', 'b'); return; }
        if (L() > PN) { s.blackout = true; s.on1 = false; s.on2 = false; return bad('Нагрузка ' + L() + ' кВт больше мощности одного ДГ (' + PN + ' кВт): ДГ2 перегружен и отключился. БЛЭКАУТ!'); }
        s.on1 = false; s.steps.out = true; good('ДГ1 отключён без толчка. ДГ2 несёт всю нагрузку. Смена агрегатов выполнена!');
      },
      reset() { reset(); }
    };
    root.querySelectorAll('[data-a]').forEach(b => b.onclick = () => A[b.dataset.a]());
    reset();
    loop(root, (t, dt) => {
      s.oilP = s.oil || s.run ? toward(s.oilP, 3, 1 * dt) : toward(s.oilP, 0, 1 * dt);
      const b = bus();
      if (s.on2) { s.f2 = b.fb; s.v2 = s.u1; }
      else if (s.run) { /* частота и напряжение задаются кнопками */ }
      else { s.f2 = toward(s.f2, 0, 12 * dt); s.v2 = 0; }
      if (s.run && !s.on2) s.ang += 360 * (s.f2 - b.fb) * dt;
      // нагрузка/блэкаут
      if (!s.blackout) {
        if (s.on1 && s.on2 && (b.p1 < -50 || b.p2 < -50)) { const w = b.p1 < b.p2 ? 1 : 2; if (w === 1) s.on1 = false; else s.on2 = false; s.mist++; log('⛔ Обратная мощность на ДГ' + w + ': он стал мотором и был отключён защитой. Не снижайте скорость агрегата ниже нагрузки.', 'b'); if (!s.on1 && !s.on2) s.blackout = true; }
        if (s.on1 !== s.on2 && L() > PN * 1.1) { s.blackout = true; s.on1 = false; s.on2 = false; s.mist++; log('⛔ Перегрузка единственного ДГ: отключился. БЛЭКАУТ. Для такой нагрузки нужны два ДГ.', 'b'); }
        if (b.fb && (b.fb < 57.5 || b.fb > 62.5)) { s.blackout = true; s.on1 = s.on2 = false; log('⛔ Частота вышла за допуск: блэкаут.', 'b'); }
      }
      // рисование
      const f = css('--fg') || '#222'; g.clearRect(0, 0, 560, 340);
      const cx = 120, cy = 110, R = 80; g.strokeStyle = f; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
      g.font = '12px sans-serif'; g.fillStyle = f; g.fillText('СИНХРОСКОП', cx - 36, cy - R - 8); g.fillText('12', cx - 7, cy - R + 14); g.fillText('«быстро» ↻', cx - 30, cy + R + 16);
      const okZone = s.run && !s.on2; g.fillStyle = 'rgba(34,160,90,.25)'; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, -Math.PI / 2 - 0.17, -Math.PI / 2 + 0.17); g.fill();
      const a = (okZone ? s.ang : 0) * Math.PI / 180 - Math.PI / 2; g.strokeStyle = okZone ? '#e0a100' : '#aaa'; g.lineWidth = 4; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + (R - 8) * Math.cos(a), cy + (R - 8) * Math.sin(a)); g.stroke();
      g.fillStyle = f; g.font = '13px sans-serif';
      g.fillText('Шины: ' + (b.fb ? b.fb.toFixed(2) + ' Гц, ' + s.u1 + ' В' : 'ОБЕСТОЧЕНЫ'), 14, 232);
      g.fillText('ДГ2 (не на шинах): ' + (s.run && !s.on2 ? s.f2.toFixed(2) + ' Гц, ' + Math.round(s.v2) + ' В' : s.on2 ? 'на шинах' : 'стоит'), 14, 252);
      if (s.run && !s.on2) { const df = s.f2 - b.fb; g.fillText('Δf = ' + (df >= 0 ? '+' : '') + df.toFixed(2) + ' Гц, ΔU = ' + Math.round(s.v2 - s.u1) + ' В', 14, 272); }
      g.fillText('Давление масла ДГ2: ' + s.oilP.toFixed(1) + ' бар', 14, 292); g.fillText('Нагрузка судна: ' + L() + ' кВт (мощность одного ДГ ' + PN + ' кВт)', 14, 312);
      const pbar = (x, y, n, p, on) => { g.fillStyle = css('--line'); g.fillRect(x, y, 120, 150); const h = clamp(p / PN, 0, 1.3) * 115; g.fillStyle = !on ? '#999' : p > PN ? '#dc2626' : p < 0 ? '#e0a100' : '#22a05a'; g.fillRect(x + 20, y + 150 - h, 80, h); g.fillStyle = f; g.fillText(n, x + 4, y - 6); g.fillText(on ? Math.round(p) + ' кВт' : 'откл.', x + 30, y + 168); };
      pbar(280, 56, 'ДГ1', b.p1, s.on1); pbar(420, 56, 'ДГ2', b.p2, s.on2);
      g.strokeStyle = '#dc2626'; g.setLineDash([5, 4]); g.beginPath(); g.moveTo(276, 56 + 150 - 115); g.lineTo(546, 56 + 150 - 115); g.stroke(); g.setLineDash([]); g.fillStyle = '#dc2626'; g.fillText('номинал 1000 кВт', 420, 56 + 150 - 120);
      // шаги
      const st = [['Масло ДГ2', s.oilP >= 1], ['Пуск ДГ2', s.run], ['Частота ≈ шины, чуть выше', s.run && !s.on2 && Math.abs(s.f2 - b.fb) < 0.3 || s.on2 || !!s.steps.sync], ['Автомат ДГ2 (синхр.)', s.on2 || !!s.steps.sync], ['Нагрузка поровну', s.on1 && s.on2 && Math.abs(b.p1 - b.p2) < 150], ['ДГ1 отключён', !!s.steps.out]];
      root.querySelector('.mx-steps').innerHTML = st.map(([n, ok], i) => `<span class="${ok ? 'ok' : ''}">${i + 1}. ${ok ? '✓ ' : ''}${n}</span>`).join('');
      B('oil').classList.toggle('on', s.oil);
      if (s.blackout && !s.done) { s.done = true; log('Блэкаут. Нажмите «Заново» и разберите, где ошиблись. Это тренажёр: на настоящем судне такая ошибка стоит дорого.', 'b'); }
      if (s.steps.out && !s.done) { s.done = true; log(s.mist === 0 ? '🏅 Безупречно: синхронизация, распределение, вывод ДГ1 без замечаний.' : 'Готово. Замечаний: ' + s.mist + '. Попробуйте без них.', s.mist ? 'w' : 'g'); window.dispatchEvent(new CustomEvent('uni:game', { detail: { game: 'dgstart', score: Math.max(0, 5 - s.mist), max: 5 } })); }
    });
  };


})();

SIMS.blackout = root => {
  root.innerHTML = `<div class="sim"><p class="note">3 дизель-генератора по 800 кВт на шинах 60 Гц. Пуск ДГ занимает 15 с, синхронизация 10 с. Перегруз выше 100% дольше 10 с отключает генераторы (блэкаут). Если нагрузка выше 110% дольше 5 с и включено преференциальное отключение, неответственные потребители сбрасываются.</p>
  <div class="ctls"><button class="btn" data-g="0"></button><button class="btn" data-g="1"></button><button class="btn" data-g="2"></button></div>
  <div class="ctls"><button class="btn" data-l="0"></button><button class="btn" data-l="1"></button><button class="btn" data-l="2"></button><button class="btn" data-l="3"></button></div>
  <div class="ctls"><label class="ctl"><input type="checkbox" id="as"> Автозапуск резервного ДГ (при загрузке выше 85%)</label><label class="ctl"><input type="checkbox" id="ps" checked> Преференциальное отключение</label><label class="ctl">Скорость: <select id="sp"><option value="1">×1</option><option value="3">×3</option></select></label></div>
  <div class="ctls"><button class="btn" id="sc1">Сценарий: манёвр у причала</button><button class="btn" id="sc2">Сценарий: отказ ДГ2</button></div>
  <canvas></canvas><div id="out" class="out"></div><div id="log" class="out"></div></div>`;
  const g = cv(root, 640, 200), PN = 800;
  let gens, loads, time, ovl, hi, wasBlack, blackouts, log;
  const stamp = () => { const m = Math.floor(time / 60), s = Math.floor(time % 60); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); };
  const note = t => { log.unshift(stamp() + ' ' + t); if (log.length > 8) log.pop(); };
  const reset = () => { gens = [{ st: 'on', t: 0 }, { st: 'on', t: 0 }, { st: 'off', t: 0 }]; loads = [{ n: 'Ходовая нагрузка', kw: 900, on: true, ess: true }, { n: 'Подруливающее', kw: 400, on: false, ess: true }, { n: 'Кондиционирование', kw: 200, on: true, ess: false }, { n: 'Пекарня и камбуз', kw: 200, on: true, ess: false }]; time = 0; ovl = 0; hi = 0; wasBlack = false; blackouts = 0; log = []; };
  reset(); note('Старт: ДГ1 и ДГ2 в работе, нагрузка 1300 кВт.');
  const startGen = i => { const G = gens[i]; if (G.st === 'off') { G.st = 'start'; G.t = 0; note('Пуск ДГ' + (i + 1) + '.'); } else if (G.st === 'on') { G.st = 'off'; note('ДГ' + (i + 1) + ' остановлен.'); } else if (G.st === 'start' || G.st === 'sync') { G.st = 'off'; note('Пуск ДГ' + (i + 1) + ' отменён.'); } };
  root.querySelectorAll('[data-g]').forEach(b => b.onclick = () => startGen(+b.dataset.g));
  root.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { const L = loads[+b.dataset.l]; L.on = !L.on; note(L.n + (L.on ? ': включено.' : ': отключено.')); });
  $(root, '#sc1').onclick = () => { reset(); note('Сценарий «манёвр»: подготовьте третий ДГ, затем включите подруливающее.'); };
  $(root, '#sc2').onclick = () => { reset(); gens[1].st = 'fail'; note('ДГ2 отказал. Нагрузка 1300 кВт на ДГ1 (800 кВт). Спасайте шины.'); };
  const label = { off: 'ВЫКЛ', start: 'ПУСК', sync: 'СИНХР.', on: 'ВКЛ', fail: 'ОТКАЗ' };
  loop(root, (t, dt) => {
    dt *= +$(root, '#sp').value; time += dt;
    gens.forEach(G => { if (G.st === 'start') { G.t += dt; if (G.t >= 15) { G.st = 'sync'; G.t = 0; } } else if (G.st === 'sync') { G.t += dt; if (G.t >= 10) { G.st = 'on'; G.t = 0; note('ДГ на шинах.'); } } });
    const cap = gens.filter(G => G.st === 'on').length * PN, P = cap ? loads.reduce((a, L) => a + (L.on ? L.kw : 0), 0) : 0, pct = cap ? P / cap * 100 : 0;
    if (cap) {
      wasBlack = false;
      if (pct > 100) ovl += dt; else ovl = Math.max(0, ovl - dt);
      if (pct > 110) hi += dt; else hi = 0;
      if ($(root, '#ps').checked && hi >= 5) { const sh = loads.filter(L => L.on && !L.ess); if (sh.length) { sh.forEach(L => L.on = false); note('Преференциальное отключение: сброшены ' + sh.map(L => L.n.toLowerCase()).join(', ') + '.'); } hi = 0; }
      if ($(root, '#as').checked && pct > 85 && !gens.some(G => G.st === 'start' || G.st === 'sync')) { const i = gens.findIndex(G => G.st === 'off'); if (i >= 0) { note('Автозапуск: загрузка ' + pct.toFixed(0) + '%.'); startGen(i); } }
      if (ovl >= 10) { gens.forEach(G => { if (G.st === 'on') G.st = 'off'; }); ovl = 0; note('Защита от перегруза: генераторы отключены.'); }
    }
    if (!gens.some(G => G.st === 'on')) { if (!wasBlack) { wasBlack = true; blackouts++; loads.forEach(L => L.on = false); ovl = 0; hi = 0; note('БЛЭКАУТ: шины обесточены. Запустите ДГ и возвращайте потребителей по одному.'); } }
    root.querySelectorAll('[data-g]').forEach(b => { const G = gens[+b.dataset.g]; b.textContent = 'ДГ' + (+b.dataset.g + 1) + ' ' + label[G.st] + (G.st === 'start' ? ' ' + (15 - G.t).toFixed(0) + ' с' : G.st === 'sync' ? ' ' + (10 - G.t).toFixed(0) + ' с' : ''); b.className = 'btn' + (G.st === 'on' ? ' on' : ''); b.disabled = G.st === 'fail'; });
    root.querySelectorAll('[data-l]').forEach(b => { const L = loads[+b.dataset.l]; b.textContent = L.n + ' ' + L.kw + ' кВт ' + (L.on ? 'ВКЛ' : 'ВЫКЛ'); b.className = 'btn' + (L.on ? ' on' : ''); });
    const dark = !cap, col = pct > 100 ? '#e74c3c' : pct > 85 ? '#f39c12' : '#2ecc71', fr = pct > 100 ? 60 - 3 * (pct / 100 - 1) : 60;
    g.clearRect(0, 0, 640, 200); g.fillStyle = dark ? '#111' : '#1e3a2f'; g.fillRect(0, 0, 640, 200);
    g.strokeStyle = dark ? '#444' : '#f1c40f'; g.lineWidth = 6; g.beginPath(); g.moveTo(40, 110); g.lineTo(600, 110); g.stroke(); g.lineWidth = 1; g.font = '13px sans-serif';
    gens.forEach((G, i) => { const x = 100 + i * 200, on = G.st === 'on'; g.fillStyle = on ? '#2ecc71' : G.st === 'fail' ? '#c0392b' : G.st === 'off' ? '#555' : '#f39c12'; g.fillRect(x - 30, 20, 60, 45); g.fillStyle = '#fff'; g.fillText('ДГ' + (i + 1), x - 12, 48); g.strokeStyle = on ? '#f1c40f' : '#444'; g.beginPath(); g.moveTo(x, 65); g.lineTo(x, 110); g.stroke(); if (G.st === 'start' || G.st === 'sync') { g.fillStyle = '#333'; g.fillRect(x - 30, 68, 60, 6); g.fillStyle = '#f39c12'; g.fillRect(x - 30, 68, 60 * (G.st === 'start' ? G.t / 15 / 2 : 0.5 + G.t / 10 / 2), 6); } });
    g.fillStyle = '#fff'; g.fillText('ГРЩ · частота ' + (dark ? '—' : fr.toFixed(1)) + ' Гц', 40, 132);
    g.fillStyle = '#333'; g.fillRect(40, 150, 560, 18); g.fillStyle = col; g.fillRect(40, 150, Math.min(560, pct * 5.6), 18);
    $(root, '#out').innerHTML = dark ? `<b class="bad">Шины обесточены.</b> Блэкаутов: ${blackouts}` : `Нагрузка ${P} кВт / в работе ${cap} кВт = <b style="color:${col}">${pct.toFixed(0)}%</b>${ovl > 0.05 ? ` · перегруз ${ovl.toFixed(1)}/10 с` : ''}${hi > 0.05 ? ` · выше 110%: ${hi.toFixed(1)}/5 с` : ''} · Блэкаутов: ${blackouts}`;
    $(root, '#log').innerHTML = '<b>Журнал событий</b><br>' + log.map(esc).join('<br>');
  });
};
