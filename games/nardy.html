<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Нарды</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#2b2b2b;color:#eee;display:flex;flex-direction:column;align-items:center;padding:12px}
a{color:#9cf}
#board{display:grid;grid-template-columns:6fr 1fr 6fr 1fr;grid-template-rows:240px 240px;background:#5a3416;border:8px solid #3e230d;width:min(96vw,640px)}
.half{display:flex;background:#d9b37a}
.pt{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:2px 0}
.pt.bot{flex-direction:column-reverse}
.pt::before{content:'';position:absolute;inset:0;background:var(--c);clip-path:polygon(0 0,100% 0,50% 88%)}
.pt.bot::before{clip-path:polygon(0 100%,100% 100%,50% 12%)}
.c1{--c:#8b2d1a}.c2{--c:#2f4f3a}
.ch{position:relative;z-index:1;width:min(6.2vw,38px);aspect-ratio:1;border-radius:50%;margin:1px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;flex-shrink:0}
.ch.w{background:#fafafa;border:2px solid #888;color:#000}
.ch.b{background:#1b1b1b;border:2px solid #777;color:#fff}
.src{box-shadow:inset 0 0 0 2px #ff0}
.sel{box-shadow:inset 0 0 0 4px #ff0;background-color:rgba(255,255,0,.25)}
.dst{box-shadow:inset 0 0 0 4px #0f0;background-color:rgba(0,255,0,.25)}
.bar,.off{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:13px;text-align:center;cursor:pointer}
.off{background:#3e230d}
#dice{font-size:52px;min-height:60px;letter-spacing:6px}
#status{margin:8px;font-size:19px;min-height:26px;text-align:center}
button{font-size:16px;padding:8px 16px;margin:6px;cursor:pointer}
.mode{background:#555;color:#fff;border:2px solid #777;border-radius:8px}
.mode.on{background:#3d7a4a;border-color:#8f8}
#opts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:2px 0 6px}
#opts button{margin:0;font-size:15px;padding:6px 12px;background:#444;color:#eee;border:2px solid #666;border-radius:8px}
#opts button.on{background:#3d7a4a;border-color:#8f8;color:#fff}
#opts .sep{width:100%}
</style></head><body>
<h2 id="title">Нарды</h2>
<div id="opts"></div>
<div><button class="mode" id="mShort" onclick="netMode('short')">Короткие нарды</button><button class="mode" id="mLong" onclick="netMode('long')">Длинные нарды</button></div>
<div id="status"></div>
<div id="dice"></div>
<div id="board">
  <div class="half" id="tl"></div><div class="bar" id="barW"></div><div class="half" id="tr"></div><div class="off" id="offB"></div>
  <div class="half" id="bl"></div><div class="bar" id="barB"></div><div class="half" id="br"></div><div class="off" id="offW"></div>
</div>
<div><button id="rollBtn" onclick="playerRoll()">Бросить кубики</button><button onclick="netNew()">Новая игра</button> <a href="index.html">← Меню</a></div>
<p id="rules" style="max-width:600px;color:#aaa"></p>
<script>
let S,left=[],seqs=[],selFrom=null,phase='roll',mode='short',first,cur='w';
const $=id=>document.getElementById(id);
const msg=t=>$('status').textContent=t;
const GKEY='fm_nardy';
let MODE='ai',LVL=1,GID=0;
try{const o=JSON.parse(localStorage.getItem(GKEY)||'{}');if(o.m==='2p')MODE='2p';if(o.l>=0&&o.l<=2)LVL=o.l;}catch(e){}
function setOpt(m,l){if(m){MODE=m;netQuit();}if(l!==undefined)LVL=l;try{localStorage.setItem(GKEY,JSON.stringify({m:MODE,l:LVL}))}catch(e){}opts();newGame();}
function opts(){
  const el=$('opts');el.innerHTML='';
  const b=(t,on,f)=>{const x=document.createElement('button');x.textContent=t;if(on)x.className='on';x.onclick=f;el.appendChild(x);};
  b('🤖 С компьютером',MODE==='ai',()=>setOpt('ai'));b('👥 Вдвоём',MODE==='2p',()=>setOpt('2p'));b('📶 По сети',MODE==='net',netOpen);
  if(MODE==='ai'){const s=document.createElement('div');s.className='sep';el.appendChild(s);['Лёгкий','Средний','Тяжёлый'].forEach((t,i)=>b(t,LVL===i,()=>setOpt(undefined,i)));}
}
const later=(f,ms)=>{const g=GID;setTimeout(()=>{if(g===GID)f();},ms);};
// Вдвоём: подписи игроков и перевод номера ячейки на доске в счёт того, кто ходит
const NAME={w:'белых',b:'чёрных'};
const rel=a=>a<0||a>23||cur==='w'?a:(mode==='long'?(a+12)%24:23-a);
const TWO=()=>MODE==='2p'||MODE==='net';
const rollMsg=()=>MODE==='net'?(cur===NET.me?'Ваш ход — бросьте кубики':'Ход соперника — он бросает кубики…'):MODE==='2p'?'Ход '+NAME[cur]+' — бросьте кубики':'Ваш ход — бросьте кубики';
const A=(pl,k)=>pl==='w'?k:(mode==='long'?(k+12)%24:23-k);
const RULES={
 short:'Короткие нарды. Вы — белые, идёте против часовой стрелки: сверху справа → налево → вниз → в свой дом (внизу справа), затем выводите шашки в правую нижнюю ячейку. Одинокую шашку соперника можно «побить» — она уходит на середину (бар). Нажмите шашку (жёлтая рамка), потом зелёное место.',
 long:'Длинные нарды. Все 15 ваших шашек стоят сверху справа («голова»), шашки компьютера — снизу слева. Оба идут против часовой стрелки. Ваш дом — внизу справа. Бить нельзя: на место, где стоит хоть одна чужая шашка, ходить нельзя. С головы за ход можно снять только одну шашку (кроме первого хода дублем 6-6, 4-4 или 3-3 — тогда две). Нельзя ставить 6 шашек подряд стеной, если впереди неё нет ни одной шашки соперника. Нажмите шашку (жёлтая рамка), потом зелёное место.'
};
function setMode(m){mode=m;newGame();}
const own=(s,pl,a)=>pl==='w'?Math.max(s.p[a],0):Math.max(-s.p[a],0);
const oth=(s,pl,a)=>pl==='w'?Math.max(-s.p[a],0):Math.max(s.p[a],0);
const sg=pl=>pl==='w'?1:-1;
const op=pl=>pl==='w'?'b':'w';
const DIE='⚀⚁⚂⚃⚄⚅';

function newGame(){
  const p=Array(24).fill(0);
  if(mode==='long'){p[23]=15;p[11]=-15;}
  else{p[23]=2;p[12]=5;p[7]=3;p[5]=5;p[0]=-2;p[11]=-5;p[16]=-3;p[18]=-5;}
  GID++;S={p,bar:{w:0,b:0},off:{w:0,b:0},head:0};first={w:true,b:true};left=[];seqs=[];selFrom=null;phase='roll';cur='w';
  $('title').textContent=mode==='long'?'Нарды (длинные)':'Нарды (короткие)';
  $('mShort').className='mode'+(mode==='short'?' on':'');$('mLong').className='mode'+(mode==='long'?' on':'');
  $('rules').textContent=RULES[mode]+(MODE==='net'&&NET?' По сети: вы играете '+(NET.me==='w'?'белыми':'чёрными')+', каждый ходит на своём телефоне. Чёрные идут навстречу белым.':'')+(MODE==='2p'?' Вдвоём: белые и чёрные ходят по очереди на одном устройстве, у каждого своя кнопка «Бросить кубики». Чёрные идут навстречу белым, их дом — вверху справа (в коротких) или вверху слева (в длинных).':'');
  draw();msg(rollMsg());
}
// длинные нарды: запрещена стена из 6 шашек подряд, если впереди неё нет шашки соперника
function badBlock(s,pl){
  const o=op(pl);
  for(let k=0;k<=18;k++){
    let all=true;for(let j=k;j<k+6;j++)if(!own(s,pl,A(pl,j))){all=false;break;}
    if(!all)continue;
    const blockOppK=[];for(let j=k;j<k+6;j++){const a=A(pl,j);for(let x=0;x<24;x++)if(A(o,x)===a)blockOppK.push(x);}
    const mn=Math.min(...blockOppK);
    let ahead=false;for(let x=0;x<mn;x++)if(own(s,o,A(o,x))){ahead=true;break;}
    if(!ahead)return true;
  }
  return false;
}
function allHome(s,pl){if(s.bar[pl])return false;for(let k=6;k<24;k++)if(own(s,pl,A(pl,k)))return false;return true;}
function singles(s,pl,d,headMax){
  if(mode==='long')return singlesLong(s,pl,d,headMax);
  const r=[];
  if(s.bar[pl]){const t=24-d;if(oth(s,pl,A(pl,t))<=1)r.push({from:24,to:t,d});return r;}
  const home=allHome(s,pl);
  for(let k=0;k<24;k++){
    if(!own(s,pl,A(pl,k)))continue;const t=k-d;
    if(t>=0){if(oth(s,pl,A(pl,t))<=1)r.push({from:k,to:t,d});}
    else if(home){let higher=false;for(let j=k+1;j<6;j++)if(own(s,pl,A(pl,j)))higher=true;if(t===-1||!higher)r.push({from:k,to:-1,d});}
  }
  return r;
}
function singlesLong(s,pl,d,headMax){
  const r=[],home=allHome(s,pl);
  for(let k=0;k<24;k++){
    if(!own(s,pl,A(pl,k)))continue;
    if(k===23&&s.head>=headMax)continue;
    const t=k-d;let m=null;
    if(t>=0){if(oth(s,pl,A(pl,t))===0)m={from:k,to:t,d};}
    else if(home){let higher=false;for(let j=k+1;j<6;j++)if(own(s,pl,A(pl,j)))higher=true;if(t===-1||!higher)m={from:k,to:-1,d};}
    if(m&&(m.to<0||!badBlock(applyM(s,pl,m),pl)))r.push(m);
  }
  return r;
}
function applyM(s,pl,m){
  const n={p:s.p.slice(),bar:{...s.bar},off:{...s.off},head:(s.head||0)+(mode==='long'&&m.from===23?1:0)};
  if(m.from===24)n.bar[pl]--;else n.p[A(pl,m.from)]-=sg(pl);
  if(m.to<0)n.off[pl]++;
  else{const a=A(pl,m.to);if(oth(n,pl,a)===1){n.p[a]=0;n.bar[op(pl)]++;}n.p[a]+=sg(pl);}
  return n;
}
function sequences(s,pl,ds){
  const out=[];
  const orders=ds.length===2&&ds[0]!==ds[1]?[ds,[ds[1],ds[0]]]:[ds];
  const headMax=(first[pl]&&ds.length===4&&[6,4,3].includes(ds[0]))?2:1;
  s={...s,head:0};
  function dfs(st,rem,seq){
    let moved=false;
    if(rem.length)for(const m of singles(st,pl,rem[0],headMax)){moved=true;dfs(applyM(st,pl,m),rem.slice(1),[...seq,m]);}
    if(!moved)out.push({seq,end:st});
  }
  for(const o of orders)dfs(s,o,[]);
  const mx=Math.max(...out.map(x=>x.seq.length));
  let res=out.filter(x=>x.seq.length===mx);
  if(mx===1&&ds.length===2&&ds[0]!==ds[1]){const hi=Math.max(...ds);if(res.some(x=>x.seq[0].d===hi))res=res.filter(x=>x.seq[0].d===hi);}
  return res;
}
function rollDice(){const a=(1+Math.random()*6)|0,b=(1+Math.random()*6)|0;return a===b?[a,a,a,a]:[a,b];}
function pip(s,pl){let t=s.bar[pl]*25;for(let k=0;k<24;k++)t+=own(s,pl,A(pl,k))*(k+1);return t;}
function evalS(s,pl){
  let v=pip(s,op(pl))-pip(s,pl);
  if(mode==='long'){
    for(let k=0;k<23;k++){const n=own(s,pl,A(pl,k));if(n)v+=4;if(n>4)v-=(n-4)*2;}
    for(let k=0;k<=18;k++){let run=0;for(let j=k;j<k+5&&own(s,pl,A(pl,j));j++)run++;v+=run*run;}
    return v+s.off[pl]*3;
  }
  for(let k=0;k<24;k++){const n=own(s,pl,A(pl,k));if(n===1)v-=(k<6?3:6);if(n>=2)v+=(k<6?5:3);}
  return v+s.off[pl]*2;
}
function playerRoll(rds){
  if(phase!=='roll')return;
  if(MODE==='net'&&!rds&&cur!==NET.me)return;
  if(MODE==='net'&&!rds){netRoll();return;}
  const ds=rds||rollDice();left=ds.slice();S.head=0;seqs=sequences(S,cur,ds);first[cur]=false;
  if(!seqs[0].seq.length){endTurn(1400);if(TWO())msg('Ходов нет — ход переходит '+(MODE==='net'?(cur===NET.me?'сопернику':'вам'):'сопернику'));return;}
  phase='move';draw();msg(MODE==='net'&&cur!==NET.me?'Соперник ходит…':(MODE==='2p'?'Ходят '+(cur==='w'?'белые':'чёрные')+'. ':'')+'Выберите шашку, затем зелёное место');
}
function clickPt(a){
  if(phase!=='move'||(MODE==='net'&&cur!==NET.me))return;const k=rel(a);
  if(selFrom!==null){const x=seqs.find(x=>x.seq[0].from===selFrom&&x.seq[0].to===k);if(x){doPlayerMove(x.seq[0]);return;}}
  selFrom=seqs.some(x=>x.seq[0].from===k)?k:null;draw();
}
function doPlayerMove(m,remote){
  if(MODE==='net'&&!remote)netSend({t:'mv',from:m.from,to:m.to,d:m.d});
  S=applyM(S,cur,m);
  seqs=seqs.filter(x=>x.seq[0].from===m.from&&x.seq[0].to===m.to&&x.seq[0].d===m.d).map(x=>({seq:x.seq.slice(1)}));
  left.splice(left.indexOf(m.d),1);selFrom=null;
  if(S.off[cur]===15)return win(cur);
  if(!seqs[0].seq.length)return endTurn(900);
  draw();
}
// Конец хода: вдвоём — передать кубики сопернику, с компьютером — ход компьютера
function endTurn(ms){
  if(TWO()){phase='wait';draw();later(()=>{cur=op(cur);phase='roll';left=[];draw();msg(rollMsg());},ms>1000?ms:300);return;}
  phase='ai';draw();msg((ms>1000?'Ходов нет. ':'')+'Ход компьютера…');later(aiTurn,ms);
}
function aiTurn(){
  const ds=rollDice();left=ds.slice();S.head=0;const ss=sequences(S,'b',ds);first.b=false;draw();
  if(!ss[0].seq.length){msg('У компьютера нет ходов');later(toPlayer,1400);return;}
  msg('Ход компьютера…');
  // Уровни: лёгкий — случайный ход, средний — простая оценка, тяжёлый — ещё и бережёт одиночные шашки и строит заборы
  let best=ss[Math.random()*ss.length|0],bv=-1e9;
  if(LVL>0)for(const x of ss){const v=(LVL===2?evalHard(x.end,'b'):evalS(x.end,'b'))+Math.random()*0.5;if(v>bv){bv=v;best=x;}}
  let i=0;
  const step=()=>{
    if(i>=best.seq.length){if(S.off.b===15)return win('b');return toPlayer();}
    const m=best.seq[i++];S=applyM(S,'b',m);left.splice(left.indexOf(m.d),1);draw();later(step,700);
  };
  later(step,900);
}
function toPlayer(){phase='roll';left=[];draw();msg(rollMsg());}
function win(pl){phase='over';draw();msg(MODE==='net'?(pl===NET.me?'Вы победили! 🎉':'Победил соперник'):MODE==='2p'?'Победили '+(pl==='w'?'белые':'чёрные')+'! 🎉':(pl==='w'?'Вы победили! 🎉':'Победил компьютер'));}
// Оценка для тяжёлого уровня: штраф за одиночные шашки под прямым ударом и бонус за 2+ шашки подряд (забор)
function evalHard(s,pl){
  let v=evalS(s,pl);const o=op(pl);
  if(mode==='short'){
    for(let k=0;k<24;k++){
      if(own(s,pl,A(pl,k))!==1)continue;
      let shots=0;for(let x=0;x<24;x++){if(!own(s,o,A(o,x)))continue;const dist=x-(23-k);if(dist>=1&&dist<=6)shots+=own(s,o,A(o,x));}
      if(s.bar[o]&&23-k>=18)shots+=2;
      v-=shots*(k<12?4:2);
    }
  }
  let run=0;for(let k=0;k<12;k++){if(own(s,pl,A(pl,k))>=(mode==='short'?2:1)){run++;v+=run*2;}else run=0;}
  return v;
}

const isSrc=k=>phase==='move'&&seqs.some(x=>x.seq[0].from===k);
const isDst=k=>phase==='move'&&selFrom!==null&&seqs.some(x=>x.seq[0].from===selFrom&&x.seq[0].to===k);
function checkers(el,n,cl){
  for(let i=0;i<Math.min(n,5);i++){const ch=document.createElement('div');ch.className='ch '+cl;if(i===4&&n>5)ch.textContent=n;el.appendChild(ch);}
}
function draw(){
  const mk=(id,idxs,top)=>{
    const el=$(id);el.innerHTML='';
    for(const a of idxs){
      const d=document.createElement('div');d.className='pt '+(top?'top ':'bot ')+(a%2?'c1':'c2');
      checkers(d,Math.abs(S.p[a]),S.p[a]>0?'w':'b');
      const k=rel(a);if(selFrom===k&&phase==='move')d.classList.add('sel');else if(isDst(k))d.classList.add('dst');else if(isSrc(k))d.classList.add('src');
      d.onclick=()=>clickPt(a);el.appendChild(d);
    }
  };
  mk('tl',[12,13,14,15,16,17],1);mk('tr',[18,19,20,21,22,23],1);mk('bl',[11,10,9,8,7,6],0);mk('br',[5,4,3,2,1,0],0);
  const mine=pl=>cur===pl&&(MODE==='net'?pl===NET.me:(pl==='w'||MODE==='2p'));
  const bw=$('barW');bw.innerHTML='';checkers(bw,S.bar.w,'w');bw.className='bar'+(mine('w')&&selFrom===24?' sel':mine('w')&&isSrc(24)?' src':'');bw.onclick=()=>{if(mine('w'))clickPt(24)};
  const bb=$('barB');bb.innerHTML='';checkers(bb,S.bar.b,'b');bb.className='bar'+(mine('b')&&selFrom===24?' sel':mine('b')&&isSrc(24)?' src':'');bb.onclick=()=>{if(mine('b'))clickPt(24)};
  const ob=$('offB');ob.textContent=(TWO()?'Вывести ⇧ ':'Вывел: ')+S.off.b;ob.className='off'+(mine('b')&&isDst(-1)?' dst':'');ob.onclick=()=>{if(mine('b'))clickPt(-1)};
  const ow=$('offW');ow.textContent='Вывести ⇩ '+S.off.w;ow.className='off'+(mine('w')&&isDst(-1)?' dst':'');ow.onclick=()=>{if(mine('w'))clickPt(-1)};
  $('dice').textContent=left.map(d=>DIE[d-1]).join('');
  $('rollBtn').disabled=phase!=='roll'||(MODE==='net'&&cur!==NET.me);
}
// ---- Игра по сети (📶): связь между телефонами держит приложение Fac Modo, сюда приходят только ходы соперника ----
let NET=null;
function netOpen(){if(window.parent===window){alert('Игра по сети работает внутри приложения Fac Modo');return}parent.postMessage({fm:'net-open',g:'nardy',t:document.title},'*')}
function netSend(d){if(NET&&!NET.lost)parent.postMessage({fm:'net-send',d},'*')}
function netQuit(){if(NET){NET=null;parent.postMessage({fm:'net-close'},'*')}}
function netNew(){if(MODE==='net')netSend({t:'new'});newGame()}
addEventListener('message',e=>{const m=e.data;if(!m||typeof m!=='object'||!m.fm||e.source!==window.parent)return;
 if(m.fm==='net-ready'){NET={host:!!m.host};MODE='net';netReady()}
 else if(m.fm==='net-msg'&&NET){const d=m.d||{};if(d.t==='new')newGame();else netGot(d)}
 else if(m.fm==='net-closed'&&NET){NET.lost=1;(typeof status==='function'?status:msg)('📶 Связь с соперником потеряна. Выбери режим заново')}});
function netMode(m){if(MODE==='net')netSend({t:'mode',m});setMode(m);}
function netReady(){NET.me=NET.host?'w':'b';opts();newGame();}
// Ход соперника может прийти, пока у нас ещё идёт пауза передачи хода — тогда чуть подождать
/* Честные кубики по сети: бросок складывается из двух случайных чисел, по одному от каждого телефона.
   Бросающий сначала шлёт только отпечаток своего числа (SHA-256), соперник отвечает своим числом, и лишь потом бросающий
   открывает своё. Подогнать результат не может никто: свой вклад каждый выбирает, не зная чужого. */
// SHA-256 без интернета и без crypto.subtle (его нет на file:// и в старых WebView): нужен для честной игры по сети
const SHA=(()=>{const P=[];for(let n=2;P.length<64;n++)if(P.every(p=>n%p))P.push(n);const fr=x=>(x-Math.floor(x))*4294967296|0;
 const K=P.map(p=>fr(Math.cbrt(p))),H0=P.slice(0,8).map(p=>fr(Math.sqrt(p))),R=(x,n)=>x>>>n|x<<32-n;
 return s=>{const b=new TextEncoder().encode(s),l=b.length,n=(l+72>>6)<<6,m=new Uint8Array(n),v=new DataView(m.buffer),w=new Int32Array(64);m.set(b);m[l]=128;v.setUint32(n-4,l*8>>>0);v.setUint32(n-8,Math.floor(l/536870912));
  const H=H0.slice();for(let o=0;o<n;o+=64){for(let i=0;i<64;i++)w[i]=i<16?v.getInt32(o+i*4):(w[i-16]+(R(w[i-15],7)^R(w[i-15],18)^w[i-15]>>>3)+w[i-7]+(R(w[i-2],17)^R(w[i-2],19)^w[i-2]>>>10))|0;
   let[a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=h+(R(e,6)^R(e,11)^R(e,25))+(e&f^~e&g)+K[i]+w[i]|0,t2=(R(a,2)^R(a,13)^R(a,22))+(a&b^a&c^b&c)|0;h=g;g=f;f=e;e=d+t1|0;d=c;c=b;b=a;a=t1+t2|0}
   [a,b,c,d,e,f,g,h].forEach((x,i)=>H[i]=H[i]+x|0)}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}})();
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
function diceOf(a,b){const h=SHA(a+'|'+b),v=[];for(let i=0;i<64&&v.length<2;i+=2){const x=parseInt(h.substr(i,2),16);if(x<252)v.push(x%6+1)}while(v.length<2)v.push(1);return v[0]===v[1]?[v[0],v[0],v[0],v[0]]:v;}
function netRoll(){if(NET.dr&&NET.dr.g===GID)return;NET.dr={a:rnd(),g:GID};netSend({t:'rc',h:SHA(NET.dr.a)});msg('Бросаем кубики вместе с соперником…');}
function netGot(d,n){n=n||0;const g=GID,again=()=>{if(n<40)setTimeout(()=>{if(g===GID)netGot(d,n+1)},150)};
 if(d.t==='mode'){if(d.m!=='long'&&d.m!=='short')return;mode=d.m;newGame();return;}
 if(d.t==='rc'){if(typeof d.h!=='string'||!/^[0-9a-f]{64}$/.test(d.h))return;if(phase!=='roll'||cur===NET.me)return again();NET.rh=d.h;NET.rb=rnd();NET.rg=GID;netSend({t:'rb',b:NET.rb});return;}
 if(d.t==='rb'){const r=NET.dr;if(!r||r.g!==GID||phase!=='roll'||cur!==NET.me||typeof d.b!=='string'||!/^[0-9a-f]{32}$/.test(d.b))return;NET.dr=null;netSend({t:'rr',a:r.a});playerRoll(diceOf(r.a,d.b));return;}
 if(d.t==='rr'){if(!NET.rh||NET.rg!==GID||phase!=='roll'||cur===NET.me)return;const h=NET.rh;NET.rh=null;
  if(typeof d.a!=='string'||SHA(d.a)!==h){phase='over';draw();msg('⚠ Соперник подменил кубики. Игра остановлена');return;}
  playerRoll(diceOf(d.a,NET.rb));return;}
 if(d.t==='mv'){if(phase!=='move'||cur===NET.me)return again();const x=seqs.find(x=>x.seq[0].from===d.from&&x.seq[0].to===d.to&&x.seq[0].d===d.d);if(x)doPlayerMove(x.seq[0],true);}}
opts();newGame();
