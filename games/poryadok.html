<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Порядок действий</title>
<style>
:root{--bg:#0d2236;--fg:#eef;--card:#123552;--line:#2d5a80;--muted:#9ab;--ok:#2f9e6a;--bad:#d96a5a;--acc:#4cc2ff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0 auto;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--fg);padding:12px 10px 40px;max-width:760px;font-size:16px}
h2{margin:6px 0 4px;padding-right:120px}p.help{color:var(--muted);font-size:14px;margin:0 0 12px}
.btn{padding:8px 14px;border-radius:10px;border:2px solid #3b6488;background:#24405c;color:#eef;cursor:pointer;font:inherit;font-size:15px;min-height:44px}
.btn.pri{background:var(--ok);border-color:#7fe0b0;color:#fff}
#menu{display:flex;flex-direction:column;gap:8px}
#menu .sc{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;padding:12px;border-radius:12px;border:2px solid #3b6488;background:#24405c;color:#eef;cursor:pointer;min-height:60px;width:100%}
#menu .sc i{font-style:normal;font-size:26px}#menu .sc b{display:block;font-size:16px}#menu .sc span{display:block;font-size:13px;color:#b9cde0;margin-top:2px}
#menu h4{margin:12px 2px 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stars{margin-left:auto;white-space:nowrap;font-size:15px;color:#f5c451}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}.top .info{flex:1;min-width:140px;font-size:14px;color:var(--muted)}
.bar{height:8px;background:#0b1a2a;border-radius:6px;overflow:hidden;margin:0 0 10px}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.done{margin:0 0 10px;padding:0;list-style:none}.done li{display:flex;gap:10px;margin:6px 0;padding:10px 12px;border-radius:10px;background:#12402f;border:1px solid #2f9e6a;animation:pop .25s ease both}
.done li b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;text-align:center;line-height:26px;font-size:14px}
.pool{display:flex;flex-direction:column;gap:8px}
.pool button{text-align:left;font:inherit;font-size:15px;line-height:1.35;padding:12px;border-radius:12px;border:2px solid #3b6488;background:#1a4268;color:#eef;cursor:pointer;min-height:48px}
.pool button.hint{border-color:#f5c451;box-shadow:0 0 0 3px rgba(245,196,81,.35)}
.pool button.no{animation:shake .35s}
.msg{min-height:22px;margin:10px 0;font-size:14px;color:var(--muted)}.msg.bad{color:#ffb4a8}.msg.good{color:#9fe7c0}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0}
.res h3{margin:0 0 6px}.res .big{font-size:34px;color:#f5c451;letter-spacing:4px}
.why{display:block;font-size:13px;color:#b9cde0;margin-top:3px}
.note{color:var(--muted);font-size:13px;margin-top:14px}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head><body>
<h2 id="h2"></h2>
<p class="help" id="help"></p>
<div id="menu"></div>
<div id="play" hidden>
 <div class="top"><button class="btn" id="back" type="button"></button><div class="info" id="info"></div><button class="btn" id="hintb" type="button"></button></div>
 <div class="bar"><i id="bar"></i></div>
 <ol class="done" id="done"></ol>
 <div class="pool" id="pool"></div>
 <div class="msg" id="msg" role="status"></div>
 <div id="end" hidden></div>
</div>
<script>
(function(){
var LG=window.FM_LANG==="en"?1:window.FM_LANG==="uk"?2:0;
function t(a){return a[LG]}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
document.documentElement.lang=["ru","en","uk"][LG];
var UI={
 title:["Порядок действий","Order of actions","Порядок дій"],
 help:["Шаги даны вперемешку. Нажимай их в том порядке, в каком их надо выполнять. Ошибка не штрафуется, но считается. Это учебный порядок: на судне всегда действуй по инструкции судна и системе управления безопасностью (СМБ).","The steps are shuffled. Tap them in the order in which they must be done. A mistake costs nothing but is counted. This is a learning order: on board always follow the ship's own instructions and the safety management system (SMS).","Кроки дано впереміш. Натискай їх у тому порядку, в якому їх треба виконувати. Помилка не штрафується, але рахується. Це навчальний порядок: на судні завжди дій за інструкцією судна та системою управління безпекою (СУБ)."],
 all:["Для всех на борту","For everyone on board","Для всіх на борту"],
 eng:["Машина и электрики","Engine room and electrical","Машина та електрики"],
 back:["← К списку","← Back to the list","← До списку"],
 hint:["💡 Подсказка","💡 Hint","💡 Підказка"],
 step:["Шаг","Step","Крок"],of:["из","of","із"],err:["ошибок","mistakes","помилок"],hints:["подсказок","hints","підказок"],
 no:["Ещё рано: подумай, что должно произойти раньше.","Not yet: think about what must happen first.","Ще зарано: подумай, що має статися раніше."],
 ok:["Верно!","Correct!","Вірно!"],
 hinted:["Подсветил следующий шаг.","The next step is highlighted.","Підсвітив наступний крок."],
 done:["Готово!","Done!","Готово!"],
 clean:["Чисто: без ошибок и подсказок.","Clean run: no mistakes and no hints.","Чисто: без помилок і підказок."],
 again:["Ещё раз","Again","Ще раз"],menu:["К списку","To the list","До списку"],
 order:["Правильный порядок и почему:","The right order and why:","Правильний порядок і чому:"],
 note:["Учебная модель. Реальные действия берите из инструкции вашего судна, СМБ, правил порта и требований флага.","A learning model. Take real actions from your ship's instructions, the SMS, port rules and flag requirements.","Навчальна модель. Реальні дії беріть з інструкції вашого судна, СУБ, правил порту та вимог прапора."]
};
/* сценарии: каждый шаг = [рус, eng, укр, почему рус, why eng, чому укр] */
var SC=[
{id:"fire",ic:"🔥",g:"all",t:["Пожар на борту: первые действия","Fire on board: first actions","Пожежа на борту: перші дії"],d:["Тревога, доклад, тушение, изоляция, сбор и счёт людей","Alarm, report, fighting, isolation, muster and head count","Тривога, доповідь, гасіння, ізоляція, збір і облік людей"],s:[
["Поднять тревогу: крикнуть «Пожар!» и нажать ближайшую кнопку пожарной тревоги","Raise the alarm: shout \"Fire!\" and press the nearest fire alarm call point","Подати тривогу: крикнути «Пожежа!» і натиснути найближчу кнопку пожежної тривоги","Чем раньше узнают все, тем больше времени на действия.","The sooner everyone knows, the more time there is to act.","Чим раніше дізнаються всі, тим більше часу на дії."],
["Доложить на мостик: где горит и что горит","Report to the bridge: where it is burning and what is burning","Доповісти на місток: де горить і що горить","Мостик объявит общесудовую тревогу и вызовет аварийную партию.","The bridge will sound the general alarm and call the emergency party.","Місток оголосить загальносуднову тривогу і викличе аварійну партію."],
["Если это безопасно и вы умеете, начать тушить ближайшим подходящим огнетушителем","If it is safe and you are trained, start fighting it with the nearest suitable extinguisher","Якщо це безпечно і ви вмієте, почати гасити найближчим відповідним вогнегасником","Маленький очаг в самом начале гасится быстро, но собой рисковать нельзя.","A small fire is put out quickly at the start, but do not risk yourself.","Невелике вогнище на початку гаситься швидко, але собою ризикувати не можна."],
["Если не справляетесь, отойти и закрыть за собой дверь (не запирая)","If you cannot cope, withdraw and close the door behind you (do not lock it)","Якщо не справляєтесь, відійти і зачинити за собою двері (не замикаючи)","Закрытая дверь ограничивает огонь и дым, а людей внутри можно найти.","A closed door limits fire and smoke, and people inside can still be found.","Зачинені двері обмежують вогонь і дим, а людей усередині можна знайти."],
["Закрыть двери, иллюминаторы и вентиляционные заслонки, остановить вентиляцию","Close doors, portholes and ventilation dampers, stop the ventilation","Зачинити двері, ілюмінатори та вентиляційні заслінки, зупинити вентиляцію","Без притока воздуха огонь слабеет и не идёт по судну.","Without fresh air a fire weakens and does not spread through the ship.","Без припливу повітря вогонь слабшає і не йде по судну."],
["Идти на свой пост по расписанию и отметиться: убедиться, что все на месте","Go to your station per the muster list and report in: make sure everyone is accounted for","Іти на свій пост за розкладом і відмітитися: переконатися, що всі на місці","Нельзя применять объёмное тушение, пока не известно, что в помещении никого нет.","Total flooding must not be used until it is known that nobody is in the space.","Не можна застосовувати об’ємне гасіння, поки не відомо, що в приміщенні нікого немає."],
["Аварийная партия в боевой одежде и с дыхательными аппаратами тушит огонь и охлаждает границы","The fire party in fire gear and breathing apparatus fights the fire and cools the boundaries","Аварійна партія в бойовому одязі й з дихальними апаратами гасить вогонь та охолоджує межі","Соседние переборки и палубы нужно охлаждать, чтобы огонь не перешёл дальше.","Neighbouring bulkheads and decks must be cooled so the fire does not spread.","Сусідні перебірки й палуби треба охолоджувати, щоб вогонь не перейшов далі."],
["Капитан решает о стационарной системе (например, CO₂) только когда все люди сосчитаны","The master decides on a fixed system (for example CO₂) only when everyone has been counted","Капітан вирішує про стаціонарну систему (наприклад, CO₂) лише коли всіх людей полічено","Газ опасен для людей: пускают его в закрытое помещение без людей.","The gas is dangerous to people: it is released into a sealed space with nobody inside.","Газ небезпечний для людей: його пускають у герметичне приміщення без людей."],
["Наблюдать за границами и температурой, оставить пост наблюдения: огонь может вспыхнуть снова","Watch the boundaries and temperature, keep a fire watch: the fire may flare up again","Стежити за межами й температурою, залишити пост спостереження: вогонь може спалахнути знову","Повторное возгорание после «потушили» случается часто.","A re-ignition after \"it is out\" happens often.","Повторне загоряння після «погасили» трапляється часто."]]},
{id:"mob",ic:"🛟",g:"all",t:["Человек за бортом","Man overboard","Людина за бортом"],d:["Крик, круг, мостик, поворот, спасательная шлюпка","Shout, lifebuoy, bridge, turn, rescue boat","Крик, круг, місток, поворот, рятувальний бот"],s:[
["Крикнуть «Человек за бортом!» на борт упавшего и не терять его из виду, указывая рукой","Shout \"Man overboard!\" on that side and keep the person in sight, pointing","Крикнути «Людина за бортом!» з того борту й не губити його з поля зору, показуючи рукою","Человека в воде очень легко потерять из виду.","A person in the water is very easy to lose sight of.","Людину у воді дуже легко втратити з поля зору."],
["Бросить ближайший спасательный круг (лучше с огнём или дымовой шашкой)","Throw the nearest lifebuoy (preferably one with a light or smoke signal)","Кинути найближче рятувальне коло (краще з вогнем або димовою шашкою)","Круг даёт плавучесть и отмечает место.","The buoy gives floatation and marks the spot.","Коло дає плавучість і позначає місце."],
["Сообщить на мостик и нажать кнопку «человек за бортом» на навигационном приборе","Report to the bridge and press the man-overboard button on the navigation equipment","Повідомити на місток і натиснути кнопку «людина за бортом» на навігаційному приладі","Прибор запоминает точку падения и помогает вернуться к ней.","The equipment stores the point of falling and helps return to it.","Прилад запам’ятовує точку падіння й допомагає повернутися до неї."],
["На мостике: переложить руль на борт упавшего, чтобы отвести винт","On the bridge: put the rudder over to the side of the casualty to swing the stern and propeller clear","На містку: перекласти стерно на борт того, хто впав, щоб відвести корму й гвинт","Так корма уходит от человека, а винт не заденет его.","This swings the stern away and keeps the propeller from the person.","Так корма відходить від людини, а гвинт її не зачепить."],
["Подать общесудовой сигнал тревоги и собрать спасательную партию","Sound the alarm signal and muster the rescue party","Подати сигнал тривоги й зібрати рятувальну партію","Нужны люди для шлюпки, наблюдения и помощи.","People are needed for the boat, lookout and assistance.","Потрібні люди для бота, спостереження й допомоги."],
["Выставить наблюдателей, вызвать капитана и выполнить манёвр возвращения к месту падения","Post lookouts, call the master and carry out the manoeuvre to return to the point of falling","Виставити спостерігачів, викликати капітана й виконати маневр повернення до місця падіння","Манёвр выбирается по обстановке, например поворот Вильямсона.","The manoeuvre is chosen to suit the situation, for example a Williamson turn.","Маневр обирається за обставинами, наприклад поворот Вільямсона."],
["Сообщить по радио соседним судам и береговой службе поиска и спасения","Notify nearby ships and the coastal rescue coordination centre by radio","Повідомити по радіо сусідні судна та берегову службу пошуку й рятування","Помощь со стороны сокращает время в холодной воде.","Outside help shortens the time spent in cold water.","Допомога збоку скорочує час у холодній воді."],
["Подготовить и спустить спасательную шлюпку, поднять человека на борт и оказать первую помощь","Prepare and launch the rescue boat, recover the person and give first aid","Підготувати й спустити рятувальний бот, підняти людину на борт і надати першу допомогу","Переохлаждение опасно: пострадавшему нужны тепло и осмотр медика.","Hypothermia is dangerous: the casualty needs warmth and a medical check.","Переохолодження небезпечне: потерпілому потрібні тепло й огляд медика."]]},
{id:"enclosed",ic:"🕳️",g:"all",t:["Вход в закрытое помещение","Entering an enclosed space","Вхід до закритого приміщення"],d:["Танк, коффердам, колодец: допуск, проветривание, замер, страховка","Tank, cofferdam, void: permit, ventilation, gas test, standby","Танк, коффердам, колодязь: допуск, провітрювання, замір, страхування"],s:[
["Оценить риски и получить разрешение на вход, подписанное ответственным лицом","Assess the risks and get an entry permit signed by the responsible officer","Оцінити ризики й отримати дозвіл на вхід, підписаний відповідальною особою","Без разрешения входить нельзя: это правило написано чужой кровью.","Never enter without a permit: this rule was written in other people's blood.","Без дозволу входити не можна: це правило написано чужою кров’ю."],
["Открыть люки и проветрить помещение принудительной вентиляцией","Open the hatches and ventilate the space with forced ventilation","Відкрити люки й провітрити приміщення примусовою вентиляцією","Воздух внутри может быть без кислорода или с опасными газами.","The air inside may lack oxygen or contain dangerous gases.","Повітря всередині може бути без кисню або з небезпечними газами."],
["Замерить воздух проверенным газоанализатором: кислород, горючие и ядовитые газы на разных уровнях","Test the air with a calibrated gas meter: oxygen, flammable and toxic gases at different levels","Виміряти повітря перевіреним газоаналізатором: кисень, горючі та отруйні гази на різних рівнях","Газы могут лежать слоями, одного замера у входа мало.","Gases can lie in layers, one test at the entrance is not enough.","Гази можуть лежати шарами, одного заміру біля входу мало."],
["Записать результаты замера в разрешение","Record the test results on the permit","Записати результати заміру в дозвіл","Запись показывает, что воздух проверяли, и с чем сравнивать потом.","The record shows that the air was checked and what to compare with later.","Запис показує, що повітря перевіряли, і з чим порівнювати потім."],
["Выставить наблюдающего у входа и подготовить спасательное снаряжение: страховку, носилки, дыхательный аппарат","Post a standby person at the entrance and prepare rescue gear: lifeline, stretcher, breathing apparatus","Виставити спостерігача біля входу й підготувати рятувальне спорядження: страхування, ноші, дихальний апарат","Спасать в одиночку входя внутрь нельзя: так погибают вторыми.","Never rescue by going in alone: that is how second victims die.","Рятувати наодинці, заходячи всередину, не можна: так гинуть другими."],
["Проверить связь, освещение, газоанализатор и ремни, провести инструктаж входящих","Check communications, lighting, gas meter and harnesses, brief the entrants","Перевірити зв’язок, освітлення, газоаналізатор і ремені, провести інструктаж тих, хто входить","Если связь или свет откажут внутри, помощь опоздает.","If communications or lighting fail inside, help arrives too late.","Якщо зв’язок або світло відмовлять усередині, допомога запізниться."],
["Сообщить на мостик или в ЦПУ о входе в помещение","Tell the bridge or the engine control room about the entry","Повідомити на місток або в ЦПК про вхід до приміщення","Вахта должна знать, где люди и когда ждать их выхода.","The watch must know where the people are and when to expect them out.","Вахта має знати, де люди й коли чекати їх виходу."],
["Входить, не выключая вентиляцию, и постоянно следить за газоанализатором и связью","Enter, leaving the ventilation running, and keep watching the gas meter and communications","Заходити, не вимикаючи вентиляцію, і постійно стежити за газоаналізатором і зв’язком","Состав воздуха может ухудшиться во время работы.","The air can get worse while the work goes on.","Склад повітря може погіршитися під час роботи."],
["По окончании пересчитать людей, закрыть помещение, закрыть разрешение и сообщить на мостик","When finished, count everyone out, close the space, close the permit and tell the bridge","Після завершення полічити людей, закрити приміщення, закрити дозвіл і повідомити на місток","Нельзя закрывать, пока не уверены, что внутри никого нет.","Never close up until you are sure nobody is inside.","Не можна закривати, поки не певні, що всередині нікого немає."]]},
{id:"hotwork",ic:"🔧",g:"all",t:["Огневые работы (сварка, резка)","Hot work (welding, cutting)","Вогневі роботи (зварювання, різання)"],d:["Разрешение, проверка места, пожарный пост, окончание работ","Permit, area check, fire watch, finishing the job","Дозвіл, перевірка місця, пожежний пост, завершення робіт"],s:[
["Запросить разрешение на огневые работы и получить его от ответственного лица","Apply for a hot work permit and get it from the responsible officer","Запросити дозвіл на вогневі роботи й отримати його від відповідальної особи","Огневые работы на судне без допуска запрещены.","Hot work on board without a permit is prohibited.","Вогневі роботи на судні без допуску заборонені."],
["Осмотреть место и соседние помещения, найти горючее и пары","Inspect the area and the spaces next to it, look for fuel and vapours","Оглянути місце й сусідні приміщення, знайти пальне та пари","Искры и нагрев переборки могут воспламенить то, что за ней.","Sparks and a heated bulkhead can ignite what is behind it.","Іскри й нагрів перебірки можуть запалити те, що за нею."],
["Проверить воздух газоанализатором, если есть риск горючих паров","Test the air with a gas meter if there is a risk of flammable vapours","Перевірити повітря газоаналізатором, якщо є ризик горючих парів","Пар топлива рядом со сваркой даёт взрыв.","Fuel vapour near welding causes an explosion.","Пара пального біля зварювання дає вибух."],
["Убрать горючие материалы или закрыть их негорючим покрытием","Remove combustible materials or cover them with a fire-resistant blanket","Прибрати горючі матеріали або накрити їх негорючим покриттям","Искры разлетаются далеко и попадают в щели.","Sparks fly far and get into gaps.","Іскри розлітаються далеко й потрапляють у щілини."],
["Подготовить огнетушитель и пожарный шланг, выставить наблюдающего с пожарным постом","Prepare an extinguisher and fire hose, post a fire watch","Підготувати вогнегасник і пожежний рукав, виставити спостерігача з пожежним постом","Начальный пожар нужно тушить сразу.","An incipient fire must be put out at once.","Початкову пожежу треба гасити одразу."],
["Сообщить мостику и ЦПУ о начале работ, проверить оборудование и заземление","Tell the bridge and engine control room that work is starting, check the equipment and earthing","Повідомити місток і ЦПК про початок робіт, перевірити обладнання та заземлення","Все на вахте должны знать, где работают с огнём.","Everyone on watch should know where hot work is under way.","Усі на вахті мають знати, де працюють з вогнем."],
["Выполнять работу, наблюдающий всё время следит за искрами и соседними местами","Do the work while the fire watch keeps looking at sparks and neighbouring places","Виконувати роботу, спостерігач увесь час стежить за іскрами й сусідніми місцями","Тление может быть незаметным.","Smouldering can be unnoticeable.","Тління може бути непомітним."],
["Прекратить работу, остудить место и оставить наблюдающего ещё на некоторое время по правилам судна","Stop the work, cool the area and leave the fire watch for some more time as per ship rules","Припинити роботу, остудити місце й залишити спостерігача ще на певний час за правилами судна","Огонь может появиться спустя время после окончания.","A fire can appear some time after the job is done.","Вогонь може з’явитися через деякий час після завершення."],
["Закрыть разрешение и сообщить на мостик и в ЦПУ","Close the permit and report to the bridge and engine control room","Закрити дозвіл і повідомити на місток і в ЦПК","Работы закончены только после закрытия допуска.","The job is complete only once the permit is closed.","Роботи завершені лише після закриття допуску."]]},
{id:"bunker",ic:"⛽",g:"eng",t:["Приём бункера: подготовка и проведение","Bunkering: preparation and operation","Прийом бункера: підготовка і проведення"],d:["План, совещание, герметизация, соединение, приём, отбор проб","Plan, meeting, spill containment, connection, receiving, sampling","План, нарада, герметизація, з’єднання, прийом, відбір проб"],s:[
["Составить план бункеровки: количества, сорта, расход, давление, баки и сигналы","Draw up the bunkering plan: quantities, grades, flow rate, pressure, tanks and signals","Скласти план бункерування: кількості, сорти, витрата, тиск, танки та сигнали","Все должны заранее знать, что принимается и куда.","Everyone must know in advance what is received and where it goes.","Усі мають заздалегідь знати, що приймається й куди."],
["Провести совещание с поставщиком и заполнить контрольный список","Hold a meeting with the supplier and complete the checklist","Провести нараду з постачальником і заповнити контрольний список","Договорённости фиксируются до начала, а не во время.","Agreements are fixed before the start, not during it.","Домовленості фіксуються до початку, а не під час."],
["Поднять сигнал бункеровки (флаг B днём, красный огонь ночью), запретить курение и открытый огонь","Show the bunkering signal (flag B by day, a red light at night), ban smoking and naked flames","Підняти сигнал бункерування (прапор B вдень, червоний вогонь уночі), заборонити паління та відкритий вогонь","Сигнал предупреждает других, а огонь у топлива недопустим.","The signal warns others, and fire near fuel is unacceptable.","Сигнал попереджає інших, а вогонь біля пального неприпустимий."],
["Закрыть шпигаты, поставить поддоны и подготовить средства сбора разливов","Plug the scuppers, set drip trays and prepare spill response equipment","Закрити шпігати, поставити піддони й підготувати засоби збору розливів","Малая утечка не должна уйти за борт.","A small leak must not go overboard.","Невеликий витік не має піти за борт."],
["Выставить клапаны на нужные баки, остальные закрыть, замерить и записать уровни в баках","Line up the valves to the right tanks, close the others, sound and record the tank levels","Виставити клапани на потрібні танки, решту закрити, виміряти й записати рівні в танках","Одна неверная заслонка — перелив или смесь сортов.","One wrong valve means an overflow or mixed grades.","Одна неправильна засувка — переповнення або суміш сортів."],
["Присоединить шланг к приёмному фланцу, проверить прокладки и болты","Connect the hose to the receiving flange, check the gaskets and bolts","Приєднати шланг до приймального фланця, перевірити прокладки та болти","Подтекание на соединении — самый частый разлив.","A leak at the connection is the most common spill.","Підтікання на з’єднанні — найчастіший розлив."],
["Проверить связь с поставщиком и аварийный останов","Check communication with the supplier and the emergency stop","Перевірити зв’язок з постачальником і аварійну зупинку","Остановить подачу нужно за секунды.","The supply must be stopped within seconds.","Зупинити подачу треба за лічені секунди."],
["Начать подачу на малой скорости и убедиться, что топливо идёт в нужный бак, без течи","Start at a slow rate and make sure the fuel goes to the right tank with no leaks","Почати подачу на малій швидкості й переконатися, що паливо йде в потрібний танк, без течі","Ошибку лучше заметить на малом расходе.","A mistake is best noticed at a low flow.","Помилку краще помітити на малій витраті."],
["Дать согласованный расход, постоянно следить за уровнями, давлением и соединением","Go to the agreed rate, keep watching the levels, pressure and the connection","Дати узгоджену витрату, постійно стежити за рівнями, тиском і з’єднанням","Баки наполняются неравномерно.","Tanks fill unevenly.","Танки наповнюються нерівномірно."],
["Перед окончанием в баке попросить снизить расход и остановить подачу на согласованном уровне","Before a tank is full, ask to reduce the rate and stop at the agreed level","Перед заповненням танка попросити знизити витрату й зупинити подачу на узгодженому рівні","Переполнение чаще всего бывает при доливе.","Overflows most often happen during topping off.","Переповнення найчастіше буває під час доливу."],
["Продуть шланг, закрыть клапаны, отсоединить шланг и убрать сигнал","Drain the hose, close the valves, disconnect the hose and take down the signal","Продути шланг, закрити клапани, від’єднати шланг і прибрати сигнал","Остатки топлива в шланге при отсоединении проливаются.","Fuel left in the hose spills when it is disconnected.","Залишки пального в шлангу при від’єднанні проливаються."],
["Взять пробу топлива, опечатать, получить накладную и записать приём в журнал","Take a fuel sample, seal it, get the delivery note and record the receipt in the log","Взяти пробу пального, опломбувати, отримати накладну й записати прийом у журнал","Проба нужна при спорах о качестве.","The sample is needed if quality is disputed.","Проба потрібна при суперечках щодо якості."]]},
{id:"emerg",ic:"🔋",g:"eng",t:["Проверка аварийного дизель-генератора","Testing the emergency generator","Перевірка аварійного дизель-генератора"],d:["Осмотр, пуск, нагрузка, возврат в автоматический режим","Inspection, start, loading, return to automatic mode","Огляд, пуск, навантаження, повернення в автоматичний режим"],s:[
["Предупредить мостик и ЦПУ, что будет проверка аварийного генератора","Warn the bridge and engine control room that the emergency generator will be tested","Попередити місток і ЦПК, що буде перевірка аварійного генератора","Все должны знать, что свет не пропадёт по ошибке.","Everyone must know that a power loss is not a mistake.","Усі мають знати, що світло не зникне через помилку."],
["Осмотреть: уровень масла и охлаждающей жидкости, топливо в баке, заряд стартёрных батарей","Inspect: oil and coolant levels, fuel in the tank, starting battery charge","Оглянути: рівень мастила й охолоджувальної рідини, паливо в баку, заряд стартерних батарей","Генератор должен стартовать с первой попытки.","The generator must start at the first attempt.","Генератор має стартувати з першої спроби."],
["Убедиться, что вентиляция и выхлоп свободны, вокруг нет посторонних предметов","Make sure the ventilation and exhaust are clear and nothing is stored around it","Переконатися, що вентиляція і вихлоп вільні, навколо немає сторонніх предметів","Закрытая заслонка или груз быстро ломают двигатель.","A closed damper or items nearby quickly damage the engine.","Закрита заслінка чи вантаж швидко ламають двигун."],
["Перевести генератор в режим проверки или ручной пуск","Switch the generator to test or manual start mode","Перевести генератор у режим перевірки або ручний пуск","Режим выбирается, чтобы не включить нагрузку случайно.","The mode is chosen so the load is not connected by accident.","Режим обирається, щоб випадково не ввімкнути навантаження."],
["Запустить двигатель и засечь время выхода на обороты","Start the engine and note how long it takes to come up to speed","Запустити двигун і засікти час виходу на оберти","Аварийный генератор обязан принять нагрузку за короткое время (по правилам не более 45 секунд).","An emergency generator must take load quickly (the rules say within 45 seconds).","Аварійний генератор має прийняти навантаження за короткий час (за правилами не більше 45 секунд)."],
["Проверить давление масла, температуру, напряжение и частоту","Check oil pressure, temperature, voltage and frequency","Перевірити тиск мастила, температуру, напругу та частоту","Нагрузку подают только на нормальные параметры.","Load is applied only at normal readings.","Навантаження подають лише за нормальних параметрів."],
["Подать нагрузку на аварийный щит (или проверить автоматическое включение)","Put the load on the emergency switchboard (or check automatic connection)","Подати навантаження на аварійний щит (або перевірити автоматичне увімкнення)","Проверка нужна именно под нагрузкой.","The test is meaningful only under load.","Перевірка потрібна саме під навантаженням."],
["Поработать под нагрузкой заданное время, слушая шум и осматривая течи и дым","Run under load for the set time, listening for noise and watching for leaks and smoke","Попрацювати під навантаженням задану кількість часу, слухаючи шум та оглядаючи витоки й дим","Многие поломки заметны только в работе.","Many faults show only when running.","Багато поломок помітні лише в роботі."],
["Вернуть питание на главный щит, дать остыть и остановить двигатель","Return the supply to the main switchboard, let it cool down and stop the engine","Повернути живлення на головний щит, дати охолонути й зупинити двигун","Горячий двигун не глушат сразу.","A hot engine is not shut down at once.","Гарячий двигун не глушать одразу."],
["Вернуть режим «автоматика», проверить топливо и батареи и записать проверку в журнал","Set it back to automatic, check the fuel and batteries and record the test in the log","Повернути режим «автоматика», перевірити паливо й батареї та записати перевірку в журнал","Если забыть автоматику, при блэкауте генератор не стартует сам.","If automatic is forgotten, the generator will not start by itself in a blackout.","Якщо забути автоматику, при блекауті генератор не стартує сам."]]},
{id:"blackout",ic:"🌑",g:"eng",t:["Восстановление после блэкаута","Recovering from a blackout","Відновлення після блекауту"],d:["Аварийный генератор, пуск основного, порядок включения потребителей","Emergency generator, starting a main DG, restoring consumers in order","Аварійний генератор, пуск основного, порядок вмикання споживачів"],s:[
["Убедиться, что аварийный генератор запустился и питает аварийный щит","Check that the emergency generator has started and is feeding the emergency switchboard","Переконатися, що аварійний генератор запустився й живить аварійний щит","Рулевое, связь и освещение питаются с него.","Steering, communications and lighting are fed from it.","Рульове, зв’язок і освітлення живляться з нього."],
["Доложить на мостик: что случилось и сколько займёт восстановление","Report to the bridge: what happened and how long recovery will take","Доповісти на місток: що сталося і скільки триватиме відновлення","Мостик должен принимать решения по управлению судном.","The bridge has to decide how to handle the ship.","Місток має ухвалювати рішення щодо керування судном."],
["Отключить автоматы неответственных потребителей и крупных двигателей на главном щите","Open the breakers of non-essential consumers and large motors on the main switchboard","Відключити автомати неважливих споживачів і великих двигунів на головному щиті","Нельзя подавать всё сразу на один генератор.","You cannot give everything to one generator at once.","Не можна подавати все одразу на один генератор."],
["Проверить, нет ли признаков короткого замыкания или пожара на щите","Check for signs of a short circuit or a fire on the switchboard","Перевірити, чи немає ознак короткого замикання або пожежі на щиті","Включать на неисправность значит повторить блэкаут.","Connecting onto a fault means repeating the blackout.","Вмикати на несправність означає повторити блекаут."],
["Запустить резервный дизель-генератор (автоматически или вручную)","Start a standby diesel generator (automatically or manually)","Запустити резервний дизель-генератор (автоматично або вручну)","Нужен генератор на главный щит.","A generator is needed for the main switchboard.","Потрібен генератор на головний щит."],
["Дождаться нормальных напряжения и частоты и замкнуть автомат генератора на шины","Wait for normal voltage and frequency and close the generator breaker onto the buses","Дочекатися нормальних напруги та частоти й замкнути автомат генератора на шини","Автомат на шины включают только при нормальных параметрах.","The breaker is closed onto the buses only at normal readings.","Автомат на шини вмикають лише за нормальних параметрів."],
["По очереди включить самые важные механизмы: насосы масла, охлаждения, топлива, рулевую","Restore the most important machinery one by one: oil, cooling and fuel pumps, steering","По черзі ввімкнути найважливіші механізми: насоси мастила, охолодження, палива, рульову","Одновременный пуск просадит напряжение и приведёт к новому блэкауту.","Starting everything at once sags the voltage and leads to another blackout.","Одночасний пуск просадить напругу й призведе до нового блекауту."],
["Включить остальных потребителей по очереди, следя за нагрузкой генераторов","Bring on the remaining consumers one by one, watching the generator load","Ввімкнути решту споживачів по черзі, стежачи за навантаженням генераторів","Нагрузку набирают постепенно.","Load is picked up gradually.","Навантаження набирають поступово."],
["Подготовить и запустить главный двигатель по инструкции, доложить мостику о готовности","Prepare and start the main engine per the manual, report readiness to the bridge","Підготувати й запустити головний двигун за інструкцією, доповісти місткові про готовність","Двигатель стартует после того, как работают насосы и воздух.","The engine starts after the pumps and air are running.","Двигун стартує після того, як працюють насоси й повітря."],
["Найти причину блэкаута, записать в журнал и принять меры, чтобы он не повторился","Find the cause of the blackout, log it and take steps to stop it happening again","Знайти причину блекауту, записати в журнал і вжити заходів, щоб він не повторився","Без причины блэкаут повторится.","Without the cause the blackout will come back.","Без причини блекаут повториться."]]}
];

function shuffle(a){for(var k=0;k<10;k++){a.sort(function(){return Math.random()-.5});if(a.length<2||a.some(function(v,i){return v!==i}))break}return a}
function start(id){cur=SC.filter(function(x){return x.id===id})[0];if(!cur)return;next=0;errs=0;hints=0;order=shuffle(cur.s.map(function(_,i){return i}));
 $("menu").hidden=true;$("help").hidden=true;$("play").hidden=false;$("end").hidden=true;$("done").innerHTML="";$("msg").textContent="";$("msg").className="msg";$("hintb").hidden=false;draw();window.scrollTo(0,0)}
function draw(){var n=cur.s.length;$("bar").style.width=Math.round(next/n*100)+"%";$("info").textContent=t(cur.t)+" · "+t(UI.step)+" "+Math.min(next+1,n)+" "+t(UI.of)+" "+n+" · "+errs+" "+t(UI.err);
 $("pool").innerHTML=order.filter(function(i){return i>=next}).map(function(i){return'<button type="button" data-i="'+i+'">'+esc(t(cur.s[i]))+"</button>"}).join("")}
function msg(m,c){$("msg").textContent=m;$("msg").className="msg "+(c||"")}
function pick(i){if(i===next){var li=document.createElement("li");li.innerHTML="<b>"+(next+1)+"</b><div>"+esc(t(cur.s[i]))+"</div>";$("done").appendChild(li);next++;msg(t(UI.ok),"good");
  if(next>=cur.s.length)finish();else draw()}else{errs++;msg(t(UI.no),"bad");draw();var b=$("pool").querySelector('[data-i="'+i+'"]');if(b){b.classList.add("no")}}}
function finish(){var st=(errs+hints===0)?3:(errs+hints<=3)?2:1;if(st>(DB[cur.id]||0)){DB[cur.id]=st;save()}
 $("pool").innerHTML="";$("hintb").hidden=true;$("bar").style.width="100%";$("info").textContent=t(cur.t);
 var h='<div class="res"><h3>'+esc(t(UI.done))+'</h3><div class="big">'+stars(st)+"</div><p>"+errs+" "+t(UI.err)+" · "+hints+" "+t(UI.hints)+(errs+hints===0?"<br>"+esc(t(UI.clean)):"")+"</p></div>";
 h+="<h4>"+esc(t(UI.order))+"</h4>";h+='<ol class="done">'+cur.s.map(function(s,i){return"<li><b>"+(i+1)+"</b><div>"+esc(t(s))+'<span class="why">'+esc(s[LG+3])+"</span></div></li>"}).join("")+"</ol>";
 h+='<div class="top"><button class="btn pri" type="button" data-a="again">'+esc(t(UI.again))+'</button><button class="btn" type="button" data-a="menu">'+esc(t(UI.menu))+"</button></div>";
 $("done").innerHTML="";$("end").innerHTML=h;$("end").hidden=false}
function toMenu(){cur=null;$("play").hidden=true;$("menu").hidden=false;$("help").hidden=false;menu();window.scrollTo(0,0)}
$("menu").addEventListener("click",function(e){var b=e.target.closest(".sc");if(b)start(b.dataset.id)});
$("pool").addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b&&cur)pick(+b.dataset.i)});
$("hintb").addEventListener("click",function(){if(!cur)return;hints++;msg(t(UI.hinted),"");var b=$("pool").querySelector('[data-i="'+next+'"]');if(b){b.classList.add("hint");try{b.scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}}});
$("back").addEventListener("click",toMenu);
$("end").addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;if(b.dataset.a==="again")start(cur.id);else toMenu()});
menu();
})();
</script></body></html>
