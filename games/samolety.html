<head>

<meta name="theme-color" content="#0f1a24">
<style>
:root{--bg:#d9e3ea;--fg:#1b2833;--mut:#4e6070;--btn:#f3f7fa;--line:#9cb0bf;--acc:#2f6b9b;--reserve:330px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--fg:#e2ebf2;--mut:#91a5b5;--btn:#1a2733;--line:#34495a;--acc:#7fc1f0}}
:root[data-theme="dark"]{--bg:#0f1a24;--fg:#e2ebf2;--mut:#91a5b5;--btn:#1a2733;--line:#34495a;--acc:#7fc1f0}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{margin:0;font-size:1.4rem;letter-spacing:.02em}
#hud{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:28px}
#hud span{background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}

#hud .lv{color:#e4573d;letter-spacing:2px}
.bar{display:flex;gap:8px}

canvas{width:min(100%,400px,calc((100vh - var(--reserve))*.6667));width:min(100%,400px,calc((100svh - var(--reserve))*.6667));min-width:240px;aspect-ratio:2/3;background:#123;border:3px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);touch-action:none}

#joy.act{border-color:var(--acc)}#joy.act #base{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--acc);opacity:.9;box-shadow:0 3px 10px rgba(0,0,0,.4);pointer-events:none}
button{font:inherit;font-size:1.3rem;color:var(--fg);background:var(--btn);border:2px solid var(--line);border-radius:10px;touch-action:none;-webkit-tap-highlight-color:transparent}
button:active,button.on{background:var(--acc);color:var(--bg)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#fire{width:108px;height:108px;border-radius:50%;font-size:1.1rem;font-weight:700}

<body>

<div id="hud"></div>
<div class="bar"><button id="pz" type="button">⏸ Пауза</button><button id="mus" type="button">♪ Музыка: вкл</button></div>
<canvas id="c" width="360" height="540"></canvas>
<div id="pad">
<div id="joy" aria-label="Джойстик"><div id="base"><div id="knob"></div></div></div>

</div>
<p id="hint">Компьютер: стрелки или WASD — полёт, пробел — огонь, P — пауза. Телефон: джойстик слева, кнопка «Огонь» справа. Бонусы: П мощность, Щ щит, + жизнь, ! бомба, С скорострельность. В конце уровня — тяжёлый бомбардировщик.</p>
<script>
const W=360,H=540,TH=1080;
const cv=document.getElementById('c'),g=cv.getContext('2d'),hud=document.getElementById('hud');
let st='menu',lvl=0,score=0,best=0,lives=3,nextLife=10000,frame=0,paused=false,banner=0,toast='',toastT=0,shake=0;
let player,en=[],pb=[],eb=[],pw=[],queue=[],waves=0,wavesDone=0,waveT=0,boss=null,bossDead=0,bossX=0,bossY=0,groups={},gid=0;
let shots=0,hits=0,lost=0,stars=0,bonus=0,scrollY=0,clouds=[],lastHud='',saved=0;
const fx=[],keys=new Set();let jvx=0,jvy=0,keyFire=false,touchFire=false;

const THEMES=[
 {name:'Над морем',kind:'sea',base:'#1e6a96',deep:'#15547a',shallow:'#4fb3c9',sand:'#e3cf94',green:['#6fb552','#2f6b2c']},
 {name:'Над полями',kind:'land',base:'#6f8f45',fields:['#8aa34f','#a7b25a','#c9b968','#5d7f3a','#7c9a48'],forest:['#3f7a35','#1f4a1e'],river:'#3a86b0',road:'#b9a67a'},
 {name:'Над пустыней',kind:'land',base:'#c9a868',fields:['#d6b878','#bf9a5a','#e0c690','#b08c50'],forest:['#8b8a45','#55552a'],river:'#4c9cb0',road:'#9a7f52'},
 {name:'Зимний фронт',kind:'land',base:'#dfe8ee',fields:['#eef3f6','#cfdbe3','#e6edf1','#d6e1e8'],forest:['#3f6a58','#1c3a30'],river:'#8fb3c8',road:'#b8c3cb'},
 {name:'Закат над морем',kind:'sea',base:'#2c5582',deep:'#203f66',shallow:'#5d86a8',sand:'#d9a066',green:['#7f8a3c','#46501f'],sunset:1}];

/* ---------- Фон (прокручивается) ---------- */
let BG=null,BGK='';
function bgTile(){
  const th=lvl%5,k=Math.min(2,SC),key=th+'/'+k.toFixed(2);if(BGK===key)return BG;BGK=key;
  const c=BG=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(TH*k);const o=c.getContext('2d');o.scale(k,k);
  let s=th*97+13;const R=()=>{s=(s*16807)%2147483647;return s/2147483647};
  const T=THEMES[th];
  const circle=(x,y,r,col)=>{o.fillStyle=col;o.beginPath();o.arc(x,y,r,0,7);o.fill()};
  const copies=fn=>{for(const dy of[-TH,0,TH]){o.save();o.translate(0,dy);fn();o.restore()}};
  if(T.kind==='sea'){
    const q=o.createLinearGradient(0,0,W,0);q.addColorStop(0,T.deep);q.addColorStop(.5,T.base);q.addColorStop(1,T.deep);o.fillStyle=q;o.fillRect(0,0,W,TH);
    for(let i=0;i<40;i++){const x=R()*W,y=R()*TH,r=20+R()*50,g2=o.createRadialGradient(x,y,0,x,y,r);g2.addColorStop(0,'rgba(255,255,255,.05)');g2.addColorStop(1,'rgba(255,255,255,0)');o.fillStyle=g2;o.fillRect(x-r,y-r,r*2,r*2)}
    const isl=[];for(let i=0;i<5;i++){const x=30+R()*(W-60),y=i*TH/5+R()*120,bl=[];const n=3+(R()*4|0);for(let j=0;j<n;j++)bl.push([(R()-.5)*50,(R()-.5)*40,12+R()*16]);const tr=[];for(let j=0;j<14;j++){const b=bl[R()*n|0];tr.push([b[0]+(R()-.5)*b[2],b[1]+(R()-.5)*b[2],2+R()*2.5])}isl.push({x,y,bl,tr})}
    copies(()=>{
      for(const I of isl)for(const b of I.bl)circle(I.x+b[0],I.y+b[1],b[2]+12,'rgba(120,210,220,.35)');
      for(const I of isl)for(const b of I.bl)circle(I.x+b[0],I.y+b[1],b[2]+4,T.sand);
      for(const I of isl)for(const b of I.bl){const x=I.x+b[0],y=I.y+b[1],r=b[2]-2,gg=o.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r);gg.addColorStop(0,T.green[0]);gg.addColorStop(1,T.green[1]);o.fillStyle=gg;o.beginPath();o.arc(x,y,r,0,7);o.fill()}
      for(const I of isl)for(const t of I.tr){circle(I.x+t[0]+1,I.y+t[1]+1.5,t[2],'rgba(0,0,0,.25)');circle(I.x+t[0],I.y+t[1],t[2],T.green[1])}
    });
    o.lineCap='round';
    for(let i=0;i<650;i++){const x=R()*W,y=R()*TH,l=3+R()*7;o.strokeStyle='rgba(255,255,255,'+(.08+R()*.2)+')';o.lineWidth=1;o.beginPath();o.moveTo(x,y);o.quadraticCurveTo(x+l/2,y-1.5,x+l,y);o.stroke()}
    if(T.sunset){const q2=o.createLinearGradient(0,0,0,TH);q2.addColorStop(0,'rgba(255,140,60,.18)');q2.addColorStop(.5,'rgba(255,90,90,.12)');q2.addColorStop(1,'rgba(255,140,60,.18)');o.fillStyle=q2;o.fillRect(0,0,W,TH)}
  }else{
    o.fillStyle=T.base;o.fillRect(0,0,W,TH);
    const fl=[];for(let i=0;i<70;i++)fl.push([R()*W,R()*TH,30+R()*60,20+R()*50,(R()-.5)*.5,T.fields[R()*T.fields.length|0]]);
    const fo=[];for(let i=0;i<22;i++){const x=R()*W,y=R()*TH,c=[];for(let j=0;j<8;j++)c.push([x+(R()-.5)*40,y+(R()-.5)*30,5+R()*7]);fo.push(c)}
    const vil=[];for(let i=0;i<6;i++){const x=R()*W,y=R()*TH,h=[];for(let j=0;j<6;j++)h.push([x+(R()-.5)*40,y+(R()-.5)*30,R()<.5]);vil.push(h)}
    copies(()=>{
      for(const f of fl){o.save();o.translate(f[0],f[1]);o.rotate(f[4]);o.fillStyle=f[5];o.fillRect(-f[2]/2,-f[3]/2,f[2],f[3]);o.strokeStyle='rgba(0,0,0,.08)';o.lineWidth=1;o.strokeRect(-f[2]/2,-f[3]/2,f[2],f[3]);o.fillStyle='rgba(0,0,0,.05)';for(let y=-f[3]/2+3;y<f[3]/2;y+=4)o.fillRect(-f[2]/2,y,f[2],1);o.restore()}
      for(const c of fo){for(const b of c)circle(b[0]+2,b[1]+3,b[2],'rgba(0,0,0,.2)');for(const b of c){const gg=o.createRadialGradient(b[0]-b[2]*.3,b[1]-b[2]*.3,1,b[0],b[1],b[2]);gg.addColorStop(0,T.forest[0]);gg.addColorStop(1,T.forest[1]);o.fillStyle=gg;o.beginPath();o.arc(b[0],b[1],b[2],0,7);o.fill()}}
      for(const v of vil)for(const h of v){o.fillStyle='rgba(0,0,0,.25)';o.fillRect(h[0]+1.5,h[1]+2,8,6);o.fillStyle=h[2]?'#9b4a32':'#7d6a55';o.fillRect(h[0],h[1],8,6);o.fillStyle='rgba(255,255,255,.25)';o.fillRect(h[0],h[1],8,2.5)}
    });
    const path=(fx0,amp1,amp2,ph)=>{o.beginPath();for(let y=0;y<=TH;y+=6){const x=fx0+Math.sin(y/TH*6.283+ph)*amp1+Math.sin(y/TH*12.566+ph*2)*amp2;y?o.lineTo(x,y):o.moveTo(x,y)}};
    path(W*.3,60,25,th);o.strokeStyle='rgba(0,0,0,.15)';o.lineWidth=16;o.stroke();o.strokeStyle=T.river;o.lineWidth=12;o.stroke();o.strokeStyle='rgba(255,255,255,.25)';o.lineWidth=2;o.stroke();
    path(W*.72,40,20,th+2);o.strokeStyle='rgba(0,0,0,.12)';o.lineWidth=7;o.stroke();o.strokeStyle=T.road;o.lineWidth=5;o.stroke();
  }
  return c;
}
let CL=null;
function cloudSprites(){
  if(CL)return CL;CL=[];
  for(let v=0;v<3;v++){
    const c=document.createElement('canvas');c.width=360;c.height=200;const o=c.getContext('2d');o.scale(2,2);
    let s=v*331+5;const R=()=>{s=(s*16807)%2147483647;return s/2147483647};
    for(let i=0;i<9;i++){const x=40+R()*100,y=35+R()*30,r=18+R()*22,q=o.createRadialGradient(x,y-r*.3,2,x,y,r);q.addColorStop(0,'rgba(255,255,255,.95)');q.addColorStop(.6,'rgba(240,246,250,.7)');q.addColorStop(1,'rgba(230,238,245,0)');o.fillStyle=q;o.beginPath();o.arc(x,y,r,0,7);o.fill()}
    CL.push(c);
  }
  return CL;
}
function newCloud(y){return{x:Math.random()*W-90,y:y===undefined?-120:y,v:Math.random()*3|0,s:.8+Math.random()*.7,sp:1.4+Math.random()*.7}}

/* ---------- Рисование самолётов ---------- */
const PL={
 yak:{len:32,span:36,ch:8,wy:-2,fw:4.2,ts:7,ty:11,cy:-3,body:'#5d7d44',wing:'#4f6b3a',nose:'#2f3d24',mark:'star',prop:1},
 bf:{len:31,span:33,ch:7.5,wy:-1,fw:4,ts:7,ty:11,cy:-2,body:'#7a817c',wing:'#686f6a',nose:'#e8c34a',mark:'cross',prop:1},
 ace:{len:31,span:33,ch:7.5,wy:-1,fw:4,ts:7,ty:11,cy:-2,body:'#8a3a32',wing:'#6e2c26',nose:'#e8c34a',mark:'cross',prop:1},
 ju:{len:44,span:64,ch:11,wy:-5,fw:5.5,ts:12,ty:15,cy:-17,body:'#5f6656',wing:'#545b4b',nose:'#3b4036',mark:'cross',eng:[-14,14],glass:1},
 boss:{len:48,span:76,ch:12,wy:-6,fw:6.5,ts:14,ty:17,cy:-19,body:'#4f5548',wing:'#474d41',nose:'#2f342b',mark:'cross',eng:[-28,-15,15,28],glass:1}};
function poly(p){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill()}
function ell(x,y,rx,ry){g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}
function circ(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function star(cx,cy,r,c){g.fillStyle=c||'#d8323a';g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;g.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q)}g.closePath();g.fill()}
function cross(x,y,r){g.fillStyle='#f2f2f2';g.fillRect(x-r,y-r*.42,r*2,r*.84);g.fillRect(x-r*.42,y-r,r*.84,r*2);g.fillStyle='#151515';g.fillRect(x-r*.8,y-r*.24,r*1.6,r*.48);g.fillRect(x-r*.24,y-r*.8,r*.48,r*1.6)}
function prop(x,y,r){g.fillStyle='rgba(220,220,220,.16)';ell(x,y,r,1.6);const w=r*Math.abs(Math.cos(frame*.9+x));g.fillStyle='rgba(25,25,25,.8)';g.fillRect(x-w,y-.7,w*2,1.4);g.fillStyle='#222';ell(x,y,1.3,1.3)}
function drawPlane(P,x,y,ang,sc,sx,sil){
  g.save();g.translate(x,y);g.rotate(ang);g.scale(sc*sx,sc);
  const C=c=>sil||c,L=P.len/2,s=P.span/2,wy=P.wy,ch=P.ch;
  g.fillStyle=C(P.wing);poly([-s,wy+1,-s+3,wy-1.5,-4,wy-2,4,wy-2,s-3,wy-1.5,s,wy+1,s-2,wy+ch*.8,4,wy+ch,-4,wy+ch,-s+2,wy+ch*.8]);
  if(!sil){const q=g.createLinearGradient(0,wy-2,0,wy+ch);q.addColorStop(0,'rgba(255,255,255,.22)');q.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=q;poly([-s,wy+1,-s+3,wy-1.5,s-3,wy-1.5,s,wy+1,s-2,wy+ch*.8,-s+2,wy+ch*.8]);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-s+3,wy+ch*.55,s*2-6,.6)}
  if(P.eng)for(const ex of P.eng){g.fillStyle=C(P.nose);ell(ex,wy+1,3.4,7.5);if(!sil){g.fillStyle='rgba(255,255,255,.18)';ell(ex-1,wy-1,1.2,4.5);prop(ex,wy-7,6)}}
  g.fillStyle=C(P.wing);poly([-P.ts,P.ty,P.ts,P.ty,P.ts-2,P.ty+4.5,-P.ts+2,P.ty+4.5]);
  g.fillStyle=C(P.body);ell(0,0,P.fw,L);
  if(sil){g.restore();return}
  {const q=g.createLinearGradient(-P.fw,0,P.fw,0);q.addColorStop(0,'rgba(255,255,255,.28)');q.addColorStop(.5,'rgba(255,255,255,0)');q.addColorStop(1,'rgba(0,0,0,.35)');g.fillStyle=q;ell(0,0,P.fw,L)}
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-.6,P.ty-3,1.2,L-P.ty+3);
  if(!P.glass){g.fillStyle=P.nose;ell(0,-L+3.5,P.fw*.92,4.2)}
  {const gw=P.glass?P.fw*.85:2.4,gh=P.glass?5.5:4.5,q=g.createLinearGradient(0,P.cy-gh,0,P.cy+gh);q.addColorStop(0,'#d8f0ff');q.addColorStop(1,'#3d6f95');g.fillStyle=q;ell(0,P.cy,gw,gh);g.fillStyle='rgba(255,255,255,.7)';ell(-gw*.35,P.cy-gh*.3,gw*.25,gh*.35)}
  const mr=ch*.4;for(const sg of[-1,1]){const mx=sg*s*.6,my=wy+ch*.45;if(P.mark==='star'){circ(mx,my,mr*1.1,'rgba(255,255,255,.85)');star(mx,my,mr)}else cross(mx,my,mr*.9)}
  if(P.mark==='star')star(0,P.ty-1,2.4);
  if(P.prop)prop(0,-L-1,9);
  g.restore();
}

/* ---------- Игра ---------- */
function reset(next){
  if(next)lvl++;else{lvl=0;score=0;lives=3;nextLife=10000}
  const pow=next&&player?player.pow:1;
  player={x:W/2,y:H-70,inv:120,sh:0,rf:0,pow,cool:0,bank:0};
  en=[];pb=[];eb=[];pw=[];fx.length=0;queue=[];boss=null;bossDead=0;groups={};
  waves=6+lvl*2;wavesDone=0;waveT=100;shots=0;hits=0;lost=0;banner=170;paused=false;st='play';
  clouds=[];for(let i=0;i<4;i++)clouds.push(newCloud(Math.random()*H));
}
const BASE={f:{hp:1,r:13,pts:100,P:'bf'},a:{hp:2,r:13,pts:150,P:'ace'},b:{hp:6,r:22,pts:300,P:'ju'},boss:{hp:1,r:50,pts:0,P:'boss'}};
function foe(k,x,y,o){const B=BASE[k];const e=Object.assign({k,x,y,vx:0,vy:2,t:0,hp:B.hp+(k==='b'?lvl>>1:0),r:B.r,pts:B.pts,P:B.P,cool:50+Math.random()*60|0,m:'dir',ph:0,bx:x,amp:0,ang:Math.PI,fl:0},o);e.max=e.hp;return e}
function spawnWave(){
  const id=++gid,R=Math.random,sp=1.6+lvl*.12,list=[];
  const types=['line','vee','side','sine'];if(lvl>=1)types.push('bomb');if(lvl>=2)types.push('ace');
  const p=types[R()*types.length|0];
  if(p==='line'){const x=50+R()*(W-100);for(let i=0;i<5;i++)list.push([i*18,foe('f',x,-30,{m:'sine',amp:30,vy:sp+.3})])}
  else if(p==='vee'){const cx=70+R()*(W-140);for(const o of[0,-1,1,-2,2])list.push([0,foe('f',cx+o*28,-30-Math.abs(o)*24,{vy:sp})])}
  else if(p==='side'){const L=R()<.5;const y=30+R()*110;for(let i=0;i<5;i++)list.push([i*14,foe('f',L?-20:W+20,y,{vx:L?2.4+lvl*.1:-2.4-lvl*.1,vy:1.1})])}
  else if(p==='sine'){for(let i=0;i<6;i++)list.push([i*16,foe('f',W/2,-30,{m:'sine',amp:120,vy:sp})])}
  else if(p==='bomb'){const n=lvl>=4?2:1;for(let i=0;i<n;i++)list.push([i*40,foe('b',n===1?W/2:i?W-90:90,-40,{m:'stop',vy:1.2,stopY:90+R()*60})])}
  else{for(let i=0;i<3;i++)list.push([i*30,foe('a',60+R()*(W-120),-30,{m:'dive',vy:sp+.6})])}
  groups[id]={n:list.length,k:0,miss:0};
  for(const [d,e] of list){e.g=id;queue.push({d,e})}
}
function spawnBoss(){boss=foe('boss',W/2,-90,{hp:50+lvl*22,pts:2000+lvl*500,m:'boss',vy:1,at:0});boss.max=boss.hp;en.push(boss);toastShow('Внимание: тяжёлый бомбардировщик!')}
function aimShot(x,y,sp,spread){const a=Math.atan2(player.y-y,player.x-x)+(spread||0);eb.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp})}
function moveFoe(e){
  const ox=e.x,oy=e.y;e.t++;
  if(e.m==='sine'){e.y+=e.vy;e.x=e.bx+Math.sin(e.t*.045+e.ph)*e.amp}
  else if(e.m==='dive'){if(!e.turn&&e.y>130){e.turn=1;const dx=player.x-e.x,dy=player.y-e.y,l=Math.hypot(dx,dy)||1,v=Math.hypot(e.vx,e.vy)+1;e.vx=dx/l*v;e.vy=Math.max(dy/l*v,1.2)}e.x+=e.vx;e.y+=e.vy}
  else if(e.m==='stop'){if(e.y<e.stopY)e.y+=e.vy;else{e.x+=Math.sin(e.t*.02)*1.1;if(e.t>560)e.m='leave'}}
  else if(e.m==='leave'){e.y+=1.6}

  else{e.x+=e.vx;e.y+=e.vy}
  if(e.k==='f'||e.k==='a'){const dx=e.x-ox,dy=e.y-oy;if(dx*dx+dy*dy>.01){let ta=Math.atan2(dy,dx)+Math.PI/2,d=ta-e.ang;d=Math.atan2(Math.sin(d),Math.cos(d));e.ang+=d*.15}}
}
function foeFire(e){
  if(e.y<10||e.y>H*.68)return;
  if(e.k==='b'){if(--e.cool<=0){e.cool=Math.max(50,100-lvl*5);for(const s of[-.22,0,.22])aimShot(e.x,e.y+18,2.4+lvl*.1,s)}}
  else if(e.k==='boss'){
    if(e.y<105)return;const c=e.at%420;
    if(c<140){if(c%45===0){const n=7+(lvl>>1),v=2.3+lvl*.08;for(let i=0;i<n;i++){const a=Math.PI/2+(i-(n-1)/2)*.17;eb.push({x:e.x,y:e.y+40,vx:Math.cos(a)*v,vy:Math.sin(a)*v})}}}
    else if(c<280){if(c%14===0)aimShot(e.x+((c/14|0)%2?-52:52),e.y+10,3+lvl*.1)}
    else if(c%7===0){const a=e.at*.09;for(const o of[0,Math.PI]){const b=a+o;eb.push({x:e.x,y:e.y+20,vx:Math.cos(b)*2.2,vy:Math.abs(Math.sin(b))*2.2+.6})}}
    if(lvl>=4&&e.at%360===180)for(const L of[1,0])en.push(foe('a',L?-20:W+20,60,{m:'dive',vx:L?1.5:-1.5,vy:2}));
  }

}
function hitFoe(e,x,y,pad){const dx=Math.abs(x-e.x),dy=Math.abs(y-e.y);if(e.k==='boss')return e.y>20&&((dx<66+pad&&Math.abs(y-(e.y-8))<14+pad)||(dx<13+pad&&dy<46+pad));if(e.k==='b')return(dx<31+pad&&Math.abs(y-(e.y-1))<8+pad)||(dx<7+pad&&dy<22+pad);return dx*dx+dy*dy<(e.r+pad)*(e.r+pad)}

function drop(x,y,k){pw.push({x,y,k:k===undefined?pick():k,l:660,t:0})}

}
function finish(){const acc=shots?Math.min(1,hits/shots):0;bonus=(lost===0?1000:0)+Math.round(acc*500);score+=bonus;stars=lost===0&&acc>=.35?3:lost<=1?2:1}

function update(){
  let mx=jvx,my=jvy;
  if(keys.has(3))mx-=1;if(keys.has(1))mx+=1;if(keys.has(0))my-=1;if(keys.has(2))my+=1;
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
  if(!player.dead){player.x=Math.min(W-18,Math.max(18,player.x+mx*3.9));player.y=Math.min(H-22,Math.max(40,player.y+my*3.9));player.bank+=(mx*.35-player.bank)*.15}
  if(player.cool>0)player.cool--;if(player.inv>0)player.inv--;if(player.sh>0)player.sh--;if(player.rf>0)player.rf--;
  if((keyFire||touchFire)&&!player.dead)pfire();
  if(frame%4===0&&!player.dead)fx.push({t:'smoke',x:player.x+(Math.random()-.5)*3,y:player.y+12,vx:0,vy:1.2,l:16,m:16,r:1.4,gr:.12,f:.98,c:'rgba(230,230,230,.6)'});

  for(const q of queue)if(--q.d<0){en.push(q.e);q.done=1}queue=queue.filter(q=>!q.done);
  if(!boss&&wavesDone>=waves&&!queue.length&&!en.length)spawnBoss();
  for(const e of en){
    moveFoe(e);foeFire(e);if(e.fl>0)e.fl--;
    if(e.k==='b'&&e.hp<=e.max/2&&frame%5===0)fx.push({t:'smoke',x:e.x+(Math.random()<.5?-14:14),y:e.y-4,vx:(Math.random()-.5)*.3,vy:1.2,l:40,m:40,r:3,gr:.18,f:.97,c:'#3a3a3a'});
    if(e.k==='boss'&&e.hp<=e.max/2&&frame%4===0)fx.push({t:'smoke',x:e.x+(Math.random()-.5)*100,y:e.y-6,vx:(Math.random()-.5)*.3,vy:1.3,l:45,m:45,r:4,gr:.2,f:.97,c:'#333'});

    if(e.k!=='boss'&&e.t>40&&(e.y>H+50||e.y<-140||e.x<-80||e.x>W+80)){e.dead=1;e.gone=1;if(e.g)groups[e.g].miss=1}

  if(toastT>0){g.globalAlpha=Math.min(1,toastT/30);g.fillStyle='rgba(15,25,35,.88)';g.fillRect(W/2-150,44,300,30);g.strokeStyle='#e6c34a';g.lineWidth=1.5;g.strokeRect(W/2-150,44,300,30);g.fillStyle='#ffe08a';g.font='bold 14px "Trebuchet MS",sans-serif';g.fillText(toast,W/2,64);g.globalAlpha=1}
  if(score>best)best=score;
  const hs='<span>Уровень <b>'+(lvl+1)+'</b></span><span>Очки <b>'+score+'</b></span><span>Рекорд <b>'+best+'</b></span><span class="lv">'+'♥'.repeat(Math.max(lives,0))+'</span><span>Мощь <b>'+'★'.repeat(player.pow)+'☆'.repeat(3-player.pow)+'</b></span><span>'+(boss?'Босс!':'Волна <b>'+wavesDone+'/'+waves+'</b>')+'</span>'+(player.sh>0?'<span>Щит</span>':'')+(player.rf>0?'<span>Скорострельность</span>':'');
  if(hs!==lastHud){hud.innerHTML=hs;lastHud=hs}
  const pt=paused?'▶ Продолжить':'⏸ Пауза';if(pzb.textContent!==pt)pzb.textContent=pt;
  if(st!=='play'){if(!saved){saved=1;try{localStorage.setItem('samolety_best',best)}catch(e){}}}else saved=0;
}

/* ---------- Музыка: героическая тема воздушного боя (ре минор, 150 ударов в минуту) ---------- */
let ac,mg,mb,nb,musicOn=true,seq=0,nextT=0,mtimer=null;
const CH=[[62,65,69],[62,65,70],[60,65,69],[60,64,67],[62,65,69],[62,65,70],[62,67,70],[61,64,69]];
const BAS=[38,34,41,36,38,34,43,45];
const MEL=[[69,-1,74,-1],[77,-1,-1,74],[72,-1,77,81],[79,-1,-1,-1],[81,-1,79,77],[77,-1,74,-1],[74,77,79,82],[81,-1,-1,-1]];
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(type,f,t,d,v){const o=ac.createOscillator(),q=ac.createGain();o.type=type;o.frequency.value=f;q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q).connect(mg);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v,f,type){const s=ac.createBufferSource(),q=ac.createGain(),fl=ac.createBiquadFilter();s.buffer=nb;fl.type=type;fl.frequency.value=f;q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(q).connect(mg);s.start(t);s.stop(t+d)}
function kick(t){const o=ac.createOscillator(),q=ac.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);q.gain.setValueAtTime(.85,t);q.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(q).connect(mg);o.start(t);o.stop(t+.24)}
function snare(t,v){noise(t,.11,v,2400,'bandpass');noise(t,.05,v*.6,6000,'highpass');tone('triangle',185,t,.07,v*.5)}
function brass(f,t,d,v,dst){
  const q=ac.createGain(),fl=ac.createBiquadFilter();fl.type='lowpass';
  fl.frequency.setValueAtTime(600,t);fl.frequency.linearRampToValueAtTime(2400,t+.07);fl.frequency.exponentialRampToValueAtTime(1000,t+d);
  q.gain.setValueAtTime(.0001,t);q.gain.linearRampToValueAtTime(v,t+.035);q.gain.setValueAtTime(v,t+d*.65);q.gain.exponentialRampToValueAtTime(.0001,t+d);
  for(const dt of[-6,6]){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(fl);o.start(t);o.stop(t+d+.03)}
  fl.connect(q);q.connect(dst||mg);
}
function step(s,t){
  const loop=s>>7,ss=s&127,bar=ss>>4,i=ss&15;
  if(i%2===0){const n=BAS[bar]+(i%8===6?12:0);tone('triangle',hz(n),t,.18,.55);tone('sawtooth',hz(n),t,.12,.07)}
  if(i===0||i===8||(i===10&&bar%2))kick(t);
  if(i===4||i===12)snare(t,.32);
  if(i%2===0)noise(t,.03,i%4===2?.12:.06,8000,'highpass');
  if(ss===0)noise(t,1.2,.22,5000,'highpass');
  if(bar===7&&i>=12)snare(t,.15+(i-12)*.05);
  {const c=CH[bar],k=i%6,n=c[k%3]+(k>=3?12:0);tone('square',hz(n+12),t,.07,.03)}
  if(i===0)for(const m of CH[bar])brass(hz(m-12),t,1.5,.035,mb);
  if(i%4===0){const q=i>>2,n=MEL[bar][q];if(n>0){let d=1;while(q+d<4&&MEL[bar][q+d]===-1)d++;brass(hz(n),t,d*.4-.03,.15,mb);if(loop)brass(hz(n-12),t,d*.4-.03,.07,mb)}}
}
function sched(){while(nextT<ac.currentTime+.2){step(seq,nextT);nextT+=.1;seq=(seq+1)%256}}
function startMusic(){
  if(!ac){
    ac=new(window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain();mg.gain.value=.3;mg.connect(ac.destination);mb=ac.createGain();mb.gain.value=.5;mb.connect(mg);const dl=ac.createDelay(1),fk=ac.createGain(),lp=ac.createBiquadFilter(),wt=ac.createGain();dl.delayTime.value=.3;fk.gain.value=.4;lp.type='lowpass';lp.frequency.value=1800;wt.gain.value=.5;mb.connect(dl);dl.connect(lp);lp.connect(fk);fk.connect(dl);lp.connect(wt);wt.connect(mg);
    nb=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  ac.resume();if(!mtimer){nextT=ac.currentTime+.1;mtimer=setInterval(sched,50)}
}
function sfxBoom(big){if(!ac||!musicOn)return;const t=ac.currentTime;noise(t,big?.8:.5,big?.9:.6,500,'lowpass');const o=ac.createOscillator(),q=ac.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(30,t+.4);q.gain.setValueAtTime(big?.9:.6,t);q.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(q).connect(mg);o.start(t);o.stop(t+.5)}
function sfxPing(){if(!ac||!musicOn)return;tone('square',1300,ac.currentTime,.08,.25)}
const mus=document.getElementById('mus');
mus.addEventListener('click',()=>{musicOn=!musicOn;if(musicOn){startMusic();mg.gain.value=.3}else if(mg)mg.gain.value=0;mus.textContent='♪ Музыка: '+(musicOn?'вкл':'выкл')});
const first=()=>{if(musicOn)startMusic()};
addEventListener('pointerdown',first,{once:true});addEventListener('keydown',first,{once:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')paused=true;if(ac){if(document.hidden)ac.suspend();else if(musicOn)ac.resume()}});

/* ---------- Запуск и управление ---------- */
try{best=+localStorage.getItem('samolety_best')||0}catch(e){}
const pzb=document.getElementById('pz');
pzb.addEventListener('click',()=>{if(st==='play')paused=!paused});
reset();st='menu';
let last=0,accT=0;
function loop(ts){
  accT+=Math.min(ts-last,100);last=ts;
  while(accT>=16.67){accT-=16.67;if(st==='play'&&!paused)update();if(!paused){fxStep();if(banner>0)banner--;if(toastT>0)toastT--}frame++}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
const KEYS={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{
  if(e.code in KEYS){e.preventDefault();keys.add(KEYS[e.code])}
  else if(e.code==='KeyP'||e.code==='Escape'){if(st==='play')paused=!paused}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(st!=='play')go();else keyFire=true}
});
addEventListener('keyup',e=>{if(e.code in KEYS)keys.delete(KEYS[e.code]);else if(e.code==='Space')keyFire=false});
addEventListener('blur',()=>{keys.clear();keyFire=false});
cv.addEventListener('pointerdown',()=>{window.focus();go()});
const joy=document.getElementById('joy'),base=document.getElementById('base'),knob=document.getElementById('knob');
let jid=null,jx=0,jy=0,jr=null;const JR=40;
function joyMove(e){
  let dx=e.clientX-jx,dy=e.clientY-jy;const l=Math.hypot(dx,dy);
  if(l>JR){jx+=dx/l*(l-JR);jy+=dy/l*(l-JR);dx*=JR/l;dy*=JR/l;base.style.left=(jx-jr.left)+'px';base.style.top=(jy-jr.top)+'px'}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  const L=Math.min(l,JR);if(L<JR*.12){jvx=jvy=0}else{jvx=dx/JR;jvy=dy/JR}
}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(e.pointerId);jr=joy.getBoundingClientRect();
  jx=Math.min(Math.max(e.clientX,jr.left+60),jr.right-60);jy=Math.min(Math.max(e.clientY,jr.top+60),jr.bottom-60);
  base.style.left=(jx-jr.left)+'px';base.style.top=(jy-jr.top)+'px';joy.classList.add('act');joyMove(e);if(navigator.vibrate)navigator.vibrate(6)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;jvx=jvy=0;knob.style.transform='';base.style.left='';base.style.top='';joy.classList.remove('act')}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);addEventListener('contextmenu',e=>e.preventDefault());
const fb=document.getElementById('fire');
fb.addEventListener('pointerdown',e=>{e.preventDefault();if(st!=='play')go();else touchFire=true;fb.classList.add('on');if(navigator.vibrate)navigator.vibrate(8)});
for(const ev of['pointerup','pointercancel','pointerleave'])fb.addEventListener(ev,()=>{touchFire=false;fb.classList.remove('on')});
try{if(window.Telegram&&Telegram.WebApp){const w=Telegram.WebApp;w.ready();w.expand();try{w.disableVerticalSwipes()}catch(e){}}}catch(e){}
